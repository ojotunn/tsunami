<script>
const PAGES = { landing: "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>{{BRAND}} · agents for pons tokens<\/title>\n<meta name=\"description\" content=\"Agents that run buyback and burn, creator reward collection, scheduled buys, and airdrops for pons tokens on Robinhood Chain.\">\n<link rel=\"icon\" href=\"/assets/brand-32.png\" sizes=\"32x32\">\n<link rel=\"apple-touch-icon\" href=\"/assets/brand-180.png\">\n<style>\n  :root{\n    /* O fundo e o mesmo preto do arquivo da marca (#000201). Isso importa: o\n       PNG tem fundo preto gravado, entao so nesse tom exato a moldura some e o\n       simbolo parece flutuar em vez de vir dentro de um quadrado. */\n    --bg:#000201; --panel:#0a0f16; --panel-2:#101821; --line:#1b2735;\n    --tx:#e9f2fa; --dim:#8b9cb0; --ok:#3fb950; --warn:#e3b341; --bad:#f85149;\n    /* Turquesa medido no proprio arquivo da marca, ao longo do degrade. */\n    --accent:#2ACCDF; --accent-hi:#20EBE3; --accent-lo:#134A95;\n    --grad:linear-gradient(135deg,#20EBE3,#1E6FB8);\n  }\n  *{box-sizing:border-box;margin:0;padding:0}\n  body{background:var(--bg);color:var(--tx);\n       font:16px/1.65 ui-sans-serif,-apple-system,\"Segoe UI\",Roboto,sans-serif;\n       -webkit-font-smoothing:antialiased;overflow-x:hidden}\n  a{color:var(--accent);text-decoration:none}\n  .wrap{max-width:1060px;margin:0 auto;padding:0 24px}\n\n  nav{border-bottom:1px solid var(--line);position:sticky;top:0;\n      background:rgba(0,2,1,.86);backdrop-filter:blur(8px);z-index:10}\n  nav .wrap{display:flex;align-items:center;gap:18px;height:64px}\n  .brand{display:flex;align-items:center;gap:10px;font-weight:700;\n         letter-spacing:-.02em;font-size:17px}\n  .brand img{width:26px;height:26px;display:block}\n  .brand span{color:var(--accent)}\n  nav .sp{flex:1}\n  .btn{background:var(--grad);color:#00171c;border:0;border-radius:8px;padding:10px 18px;\n       font:inherit;font-size:14px;font-weight:650;cursor:pointer;display:inline-block}\n  .btn.ghost{background:transparent;color:var(--accent);border:1px solid #2ACCDF55;\n             font-weight:550}\n\n  /* --- heroi editorial ---------------------------------------------------\n     A marca sangra pela direita em baixa opacidade e funciona como cenario, nao\n     como ilustracao. O texto ocupa a esquerda e nunca passa por cima dela. */\n  header{position:relative;padding:96px 0 78px;border-bottom:1px solid var(--line);\n         overflow:hidden}\n  .bleed{position:absolute;right:-90px;top:-40px;width:520px;height:520px;\n         opacity:.17;pointer-events:none;user-select:none}\n  header .wrap{position:relative;z-index:1}\n  .hero{max-width:62%}\n  .rule{width:44px;height:3px;background:var(--grad);border-radius:2px;margin-bottom:20px}\n  h1{font-size:clamp(46px,11vw,92px);line-height:1;letter-spacing:.02em;\n     font-weight:800;margin-bottom:18px}\n  h1 em{font-style:normal;color:var(--accent)}\n  .lead{font-size:18px;color:var(--dim);max-width:52ch;margin-bottom:28px}\n  .cta{display:flex;gap:12px;flex-wrap:wrap;align-items:center}\n  .cta small{color:var(--dim);font-size:13px}\n\n  /* Contrato do token da instancia. So aparece quando PONS_SITE_TOKEN existe. */\n  .token-badge{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;\n    margin-top:26px;padding:9px 14px;border:1px solid var(--line);\n    border-radius:999px;background:var(--panel)}\n  .tb-name{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;\n    color:var(--accent)}\n  .tb-addr{font:13px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--tx);\n    word-break:break-all}\n  .tb-btn{font:inherit;font-size:12px;color:var(--dim);background:transparent;\n    border:1px solid var(--line);border-radius:7px;padding:4px 9px;cursor:pointer;\n    text-decoration:none}\n  .tb-btn:hover{color:var(--tx);border-color:var(--dim)}\n\n  /* --- secoes numeradas --------------------------------------------------- */\n  section{padding:72px 0;border-bottom:1px solid var(--line)}\n  .lbl{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}\n  .num{font:700 13px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent);\n       letter-spacing:.08em}\n  h2{font-size:26px;letter-spacing:-.02em;font-weight:650}\n  .sub{color:var(--dim);margin-bottom:34px;max-width:62ch}\n\n  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}\n  .card{border-left:2px solid var(--line);padding:2px 0 2px 18px;transition:border-color .18s}\n  .card:hover{border-left-color:var(--accent)}\n  .card h3{font-size:16px;margin-bottom:8px;font-weight:620}\n  .card p{color:var(--dim);font-size:14px}\n  .card .tag{display:inline-block;font-size:11px;color:var(--dim);background:var(--panel);\n             border:1px solid var(--line);border-radius:999px;padding:2px 9px;margin-top:12px}\n\n  .steps{counter-reset:s;display:grid;gap:20px;\n         grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}\n  .step{border-top:1px solid var(--line);padding-top:16px}\n  .step::before{counter-increment:s;content:\"0\" counter(s);\n    font:700 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent);\n    display:block;margin-bottom:9px;letter-spacing:.08em}\n  .step h3{font-size:15px;margin-bottom:5px}\n  .step p{color:var(--dim);font-size:14px}\n\n  table{width:100%;border-collapse:collapse;font-size:14px}\n  th,td{text-align:left;padding:12px 12px 12px 0;border-bottom:1px solid var(--line)}\n  th{color:var(--dim);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.06em}\n  td code{font-size:12px;color:var(--dim)}\n\n  footer{padding:48px 0 64px;color:var(--dim);font-size:13px}\n  footer p{max-width:70ch;margin-bottom:10px}\n\n  /* No celular a marca de fundo sai de cena: com o texto ocupando a largura\n     toda, ela passaria por tras das letras e atrapalharia a leitura. */\n  @media (max-width:760px){\n    .hero{max-width:100%}\n    .bleed{display:none}\n    header{padding:64px 0 56px}\n    section{padding:54px 0}\n  }\n<\/style>\n<\/head>\n<body>\n\n<nav><div class=\"wrap\">\n  <div class=\"brand\"><img src=\"/assets/brand-64.png\" alt=\"\" width=\"26\" height=\"26\">{{BRAND_HTML}}<\/div>\n  <a href=\"#features\" style=\"color:var(--dim);font-size:14px\">features<\/a>\n  <div class=\"sp\"><\/div>\n  <a class=\"btn\" href=\"/app\">Open the app<\/a>\n<\/div><\/nav>\n\n<header>\n  <img class=\"bleed\" src=\"/assets/brand-512.png\" alt=\"\" width=\"520\" height=\"520\">\n  <div class=\"wrap\"><div class=\"hero\">\n    <div class=\"rule\"><\/div>\n    <h1>TSU<em>NAMI<\/em><\/h1>\n    <p class=\"lead\">\n      Tsunami brings functions that exist on pump.fun to Robinhood Chain,\n      through automated AI agents.\n    <\/p>\n    <div class=\"cta\">\n      <a class=\"btn\" href=\"/app\">Launch your agent<\/a>\n      <small>Sign in with your wallet. No password, no signup, no private key.<\/small>\n    <\/div>\n    {{TOKEN_BADGE}}\n  <\/div><\/div>\n<\/header>\n\n<section id=\"features\"><div class=\"wrap\">\n  <div class=\"lbl\"><span class=\"num\">01<\/span><h2>Six ways to keep your chart honest<\/h2><\/div>\n  <p class=\"sub\">Turn on only what you need. Every function clears two checks before it becomes\n     an action: the protocol's own limits, and the risk policy you set yourself.<\/p>\n  <div class=\"grid\">\n    <div class=\"card\">\n      <h3>Buyback &amp; burn<\/h3>\n      <p>Standing bid under your own token. The agent buys from the pool and sends straight\n         to the burn address, so the supply in circulation only goes one way.<\/p>\n      <span class=\"tag\">your deposit<\/span>\n    <\/div>\n    <div class=\"card\">\n      <h3>Creator rewards → burn<\/h3>\n      <p>The one that pays for itself. Your rewards collect themselves, wait in reserve, and\n         after graduation come back as buy pressure — funded entirely by fees you already earned.<\/p>\n      <span class=\"tag\">launch wallet · one signature<\/span>\n    <\/div>\n    <div class=\"card\">\n      <h3>Scheduled buys<\/h3>\n      <p>A fixed amount on the interval you choose, with a hard budget and a per-order impact\n         cap. The panel tells you upfront what that cadence costs you in pool fees for a year.<\/p>\n      <span class=\"tag\">your deposit<\/span>\n    <\/div>\n    <div class=\"card\">\n      <h3>Dip buying<\/h3>\n      <p>Be the bid when everyone else is asleep. Triggers on a fall from the recent high —\n         not from the last price — so ordinary noise never spends your money.<\/p>\n      <span class=\"tag\">your deposit<\/span>\n    <\/div>\n    <div class=\"card\">\n      <h3>Airdrops that reach real people<\/h3>\n      <p>Send to your own list, or straight to your actual on-chain holders read live from the\n         explorer. Addresses, duplicates and the per-wallet cap are all checked before anything moves.<\/p>\n      <span class=\"tag\">your tokens<\/span>\n    <\/div>\n    <div class=\"card\">\n      <h3>Dashboard and audit trail<\/h3>\n      <p>Price, liquidity, graduation progress, real circulating supply, and every decision the\n         agent ever proposed — including the ones your own rules blocked.<\/p>\n      <span class=\"tag\">read only<\/span>\n    <\/div>\n  <\/div>\n<\/div><\/section>\n\n<section><div class=\"wrap\">\n  <div class=\"lbl\"><span class=\"num\">02<\/span><h2>Running in under five minutes<\/h2><\/div>\n  <p class=\"sub\">Four steps. Not one of them asks for your private key.<\/p>\n  <div class=\"steps\">\n    <div class=\"step\">\n      <h3>Connect the wallet that launched your token<\/h3>\n      <p>You sign a plain text message to prove the address is yours. Signing moves no funds\n         and authorizes no transaction — and it is what unlocks the creator rewards side.<\/p>\n    <\/div>\n    <div class=\"step\">\n      <h3>Create the agent<\/h3>\n      <p>You get a brand new, dedicated wallet on Robinhood Chain, encrypted with your own\n         password. It can only ever move what you send to it — never your main wallet.<\/p>\n    <\/div>\n    <div class=\"step\">\n      <h3>Point the rewards, fund the rest<\/h3>\n      <p>One signature redirects your creator payout to the agent. For the functions that\n         buy, deposit only what you are willing to put to work — and withdraw it any time.<\/p>\n    <\/div>\n    <div class=\"step\">\n      <h3>Pick your functions and watch<\/h3>\n      <p>Every proposal shows the reasoning, the price impact, and the verdict from both\n         checks. On the default setting, nothing moves without your approval.<\/p>\n    <\/div>\n  <\/div>\n<\/div><\/section>\n\n<section><div class=\"wrap\">\n  <div class=\"lbl\"><span class=\"num\">03<\/span><h2>Where the keys live<\/h2><\/div>\n  <p class=\"sub\">The model is deliberately split: each kind of access has the smallest\n     blast radius we could give it.<\/p>\n  <table>\n    <tr><th>What<\/th><th>Who holds it<\/th><th>Worst case if leaked<\/th><\/tr>\n    <tr>\n      <td>Your main wallet<\/td>\n      <td>You, always<\/td>\n      <td>Nothing — the site never has access to it<\/td>\n    <\/tr>\n    <tr>\n      <td>Creator reward payout<\/td>\n      <td>Redirected via <code>setFeeRedirect<\/code><\/td>\n      <td>You revert it by signing again, any time<\/td>\n    <\/tr>\n    <tr>\n      <td>Operating capital<\/td>\n      <td>Agent wallet, encrypted keystore<\/td>\n      <td>Loss capped at what you deposited<\/td>\n    <\/tr>\n  <\/table>\n  <p style=\"margin-top:22px;color:var(--dim);font-size:14px\">\n    That's why there's no field to paste a private key. In that model a leak costs you\n    the entire wallet — tokens, NFTs, everything — instead of the operating deposit.\n  <\/p>\n<\/div><\/section>\n\n<footer><div class=\"wrap\">\n  <p><strong style=\"color:var(--tx)\">None of this is financial advice.<\/strong>\n     Fixed-supply tokens in a single pool are highly volatile. Buybacks and burns do not\n     guarantee price — pons's own documentation says as much. Providing liquidity can\n     lose more than the fees it earns.<\/p>\n  <p>Providing liquidity or running systematic buybacks may be a regulated activity\n     depending on your jurisdiction and volume. Worth talking to a lawyer before you\n     scale. If your token runs programmatic buybacks, disclosing that publicly is what\n     separates a transparent treasury from a manipulation complaint.<\/p>\n  <p style=\"margin-top:18px\">{{BRAND}} · open source, zero dependencies ·\n     <a href=\"/terms\">terms and risks<\/a> ·\n     <a href=\"https://docs.ponsfamily.com/docs\">pons docs<\/a><\/p>\n<\/div><\/footer>\n\n<\/body>\n<\/html>\n", app: "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>{{BRAND}} · app<\/title>\n<link rel=\"icon\" href=\"/assets/brand-32.png\" sizes=\"32x32\">\n<link rel=\"apple-touch-icon\" href=\"/assets/brand-180.png\">\n<style>\n  :root{\n    --bg:#0b0e13; --panel:#141920; --panel-2:#1a212a; --line:#252d38;\n    --tx:#e8eef5; --dim:#8b98a8; --accent:#2ACCDF; --ok:#3fb950;\n    --warn:#e3b341; --bad:#f85149;\n  }\n  *{box-sizing:border-box;margin:0;padding:0}\n  body{background:var(--bg);color:var(--tx);\n       font:14px/1.6 ui-sans-serif,-apple-system,\"Segoe UI\",Roboto,sans-serif}\n  a{color:var(--accent);text-decoration:none}\n  nav{border-bottom:1px solid var(--line);height:60px;display:flex;align-items:center;\n      gap:14px;padding:0 26px;position:sticky;top:0;background:rgba(11,14,19,.94);\n      backdrop-filter:blur(8px);z-index:20}\n  .logo{font-weight:700;letter-spacing:-.02em;font-size:16px;\n        display:flex;align-items:center;gap:9px}\n  .logo img{width:24px;height:24px;display:block}\n  .logo span{color:var(--accent)}\n  .sp{flex:1}\n  .chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--panel-2);\n        color:var(--dim);border:1px solid var(--line)}\n  .chip.ok{color:var(--ok);border-color:#1f4529}\n  .chip.bad{color:var(--bad);border-color:#5c2326}\n  button{background:var(--accent);color:#04101f;border:0;border-radius:8px;padding:9px 16px;\n         font:inherit;font-size:13px;font-weight:600;cursor:pointer}\n  button.ghost{background:transparent;color:var(--tx);border:1px solid var(--line);font-weight:500}\n  button.sm{padding:6px 12px;font-size:12px}\n  button:disabled{opacity:.4;cursor:not-allowed}\n\n  /* --- bloco de execucao, na linguagem da landing ------------------------\n     Uma acao principal so. O resto — a acao secundaria e o trancar — vira\n     link de texto, para nada competir com o botao que gasta dinheiro. */\n  .runbar{margin-top:4px}\n  .runbar .rule{height:2px;width:38px;border-radius:2px;margin:18px 0 14px;\n    background:linear-gradient(90deg,var(--accent-hi,#20EBE3),#1E6FB8)}\n  .runbar #runBtn{background:linear-gradient(135deg,#20EBE3,#1E6FB8);color:#00171c;\n    font-size:13.5px;padding:10px 20px}\n  .cap{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);\n    margin-bottom:7px}\n  .linky{background:none;border:0;padding:0;margin-left:14px;color:var(--dim);\n    font:inherit;font-size:12.5px;cursor:pointer;text-decoration:underline;\n    text-underline-offset:3px}\n  .linky:hover{color:var(--accent)}\n  .linky:disabled{opacity:.4;cursor:not-allowed}\n  .state{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--dim);\n    margin-bottom:13px}\n  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:0 0 7px}\n  .warnline{border-left:2px solid var(--accent);padding-left:12px;color:var(--dim);\n    font-size:12px;margin-top:16px;max-width:58ch}\n\n  main{max-width:1220px;margin:0 auto;padding:26px 26px 90px;\n       display:grid;grid-template-columns:330px 1fr;gap:22px;align-items:start}\n  @media(max-width:940px){main{grid-template-columns:1fr}}\n  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;\n        padding:20px;margin-bottom:18px}\n  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);\n           margin-bottom:14px;font-weight:600}\n  label{display:block;font-size:12px;color:var(--dim);margin:12px 0 5px}\n  input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);\n    border-radius:7px;padding:9px 11px;font:inherit;font-size:13px}\n  textarea{min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:12px;resize:vertical}\n  .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}\n  .addr{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:11px;margin-top:10px}\n  .kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;\n      border-bottom:1px solid var(--line);font-size:13px}\n  .kv:last-child{border:0}\n  .kv span:first-child{color:var(--dim)}\n  .fn{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:11px;background:var(--panel-2)}\n  .fn-head{display:flex;align-items:center;gap:11px;cursor:pointer}\n  .fn-head strong{font-size:13px;flex:1}\n  .fn p{margin-top:6px;color:var(--dim);font-size:12px}\n  .fn-body{display:none;margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}\n  .fn.open .fn-body{display:block}\n  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}\n  .note{font-size:12px;color:var(--dim);padding:8px 11px;background:var(--panel-2);\n        border-left:2px solid var(--line);border-radius:0 6px 6px 0;margin:6px 0}\n  .note.warn{border-left-color:var(--warn);color:#e0c07a}\n  .note.bad{border-left-color:var(--bad);color:#f0a8a4}\n  .note.ok{border-left-color:var(--ok);color:#93d6a4}\n  .dec{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;background:var(--panel-2)}\n  .dec-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}\n  .tag{font-size:11px;padding:2px 9px;border-radius:999px;background:#20262e;color:var(--dim)}\n  .tag.ok{background:#12261a;color:var(--ok)} .tag.bad{background:#2b1618;color:var(--bad)}\n  .tag.warn{background:#2a2314;color:var(--warn)}\n  .empty{color:var(--dim);font-size:13px;padding:26px;text-align:center}\n  .banner{background:#1a1408;border:1px solid #3d2f10;color:#e0c07a;border-radius:12px;\n          padding:14px 17px;margin-bottom:18px;font-size:13px}\n  .banner code{background:rgba(0,0,0,.3);padding:1px 5px;border-radius:4px}\n  .gate{max-width:520px;margin:80px auto;text-align:center}\n  .gate h1{font-size:24px;letter-spacing:-.02em;margin-bottom:12px}\n  .gate p{color:var(--dim);margin-bottom:24px}\n<\/style>\n<script>\n(function () {\n  'use strict';\n\n  // ===== código real do projeto, embutido =====\n  // Matemática de preço e profundidade para pools Uniswap V3.\n// Convenção: sqrtPriceX96 = sqrt(token1/token0) * 2^96, em unidades brutas.\n\nconst Q96 = 2n ** 96n;\nconst Q192 = 2n ** 192n;\nconst SCALE = 10n ** 18n;                       // precisão fixa interna (18 casas)\n\nconst pow10 = (n) => 10n ** BigInt(n);\n\n/**\n * Preço de token1 em token0 (unidades humanas), com 18 casas de precisão.\n * @returns {bigint} preço * 1e18\n */\nfunction priceToken1PerToken0(sqrtPriceX96, decimals0, decimals1) {\n  const sp = BigInt(sqrtPriceX96);\n  return (sp * sp * SCALE * pow10(decimals0)) / (Q192 * pow10(decimals1));\n}\n\n/**\n * Preço do token do lançamento denominado no token do par (ex.: WETH).\n * @returns {bigint} preço * 1e18\n */\nfunction tokenPriceInPair({ sqrtPriceX96, isToken0, tokenDecimals, pairDecimals }) {\n  if (isToken0) return priceToken1PerToken0(sqrtPriceX96, tokenDecimals, pairDecimals);\n  const p = priceToken1PerToken0(sqrtPriceX96, pairDecimals, tokenDecimals);\n  if (p === 0n) return 0n;\n  return (SCALE * SCALE) / p;\n}\n\n/** Market cap em token do par, escalado por 1e18. */\nconst marketCapInPair = (priceScaled, totalSupply, tokenDecimals) =>\n  (priceScaled * BigInt(totalSupply)) / pow10(tokenDecimals);\n\n/** tick -> preço (float, só para exibição). */\nconst tickToPrice = (tick) => Math.pow(1.0001, Number(tick));\n/** preço -> tick mais próximo, alinhado ao tickSpacing. */\nfunction priceToTick(price, tickSpacing = 200) {\n  const raw = Math.log(price) / Math.log(1.0001);\n  return Math.round(raw / tickSpacing) * tickSpacing;\n}\n\n/** Direção do trade a partir de um evento Swap, conforme docs da Pons. */\nfunction swapSide({ amount0, amount1, isToken0 }) {\n  const pairSigned = isToken0 ? BigInt(amount1) : BigInt(amount0);\n  return pairSigned > 0n ? 'buy' : 'sell';   // par entrando no pool = compra do token\n}\n\n/** Valor absoluto do lado do par (quanto de WETH trocou de mãos). */\nconst swapPairVolume = ({ amount0, amount1, isToken0 }) => {\n  const v = isToken0 ? BigInt(amount1) : BigInt(amount0);\n  return v < 0n ? -v : v;\n};\n\n// ------------------------------------------------------- profundidade\n\n/**\n * Simula um swap assumindo liquidez L constante na faixa ativa.\n * Válido para as posições full-range criadas pela Pons; degrada se o preço\n * atravessar limites de faixa — por isso `crossedRangeRisk` é sinalizado.\n *\n * @param {'buy'|'sell'} side  buy = entra token do par, sai token do lançamento\n * @returns {{amountOut: bigint, sqrtPriceX96After: bigint, priceImpactBps: number}}\n */\nfunction simulateSwap({ sqrtPriceX96, liquidity, amountIn, side, isToken0, feePips = 10000 }) {\n  const L = BigInt(liquidity);\n  if (L === 0n) throw new Error('pool has no active liquidity');\n  const sp = BigInt(sqrtPriceX96);\n  const inAfterFee = (BigInt(amountIn) * BigInt(1_000_000 - feePips)) / 1_000_000n;\n\n  // \"token do par sobe de preço o token\" => o par é token1 quando o token é token0\n  const pairIsToken1 = isToken0;\n  const addingToken1 = side === 'buy' ? pairIsToken1 : !pairIsToken1;\n\n  let spAfter;\n  let amountOut;\n  if (addingToken1) {\n    // ΔY = L * Δ√P  =>  √P' = √P + ΔY/L\n    spAfter = sp + (inAfterFee * Q96) / L;\n    // ΔX = L * Q96 * (√P' - √P) / (√P' * √P)\n    amountOut = (L * Q96 * (spAfter - sp)) / (spAfter * sp);\n  } else {\n    // adicionando token0: √P' = 1 / (1/√P + ΔX/L)\n    const denom = (L * Q96) / sp + inAfterFee;\n    spAfter = (L * Q96) / denom;\n    amountOut = (L * (sp - spAfter)) / Q96;\n  }\n\n  const impact = sp === 0n ? 0 : Number(((spAfter > sp ? spAfter - sp : sp - spAfter) * 20000n) / sp);\n  return {\n    amountOut,\n    sqrtPriceX96After: spAfter,\n    priceImpactBps: impact,                  // aprox: 2 * Δ√P/√P em bps\n    crossedRangeRisk: impact > 2000,         // >20% de impacto: simulação pouco confiável\n  };\n}\n\n/** Quanto do token do par é preciso para mover o preço em `bps`. */\nfunction pairAmountForMove({ sqrtPriceX96, liquidity, bps, isToken0 }) {\n  const sp = BigInt(sqrtPriceX96);\n  const L = BigInt(liquidity);\n  const target = sp + (sp * BigInt(bps)) / 20000n;      // Δ√P ≈ √P * bps/2 /10000\n  const delta = target - sp;\n  return isToken0 ? (L * delta) / Q96 : (L * Q96 * delta) / (target * sp);\n}\n\n// ------------------------------------------------------- formatação\n\nfunction formatUnits(value, decimals = 18, precision = 6) {\n  const v = BigInt(value);\n  const neg = v < 0n;\n  const abs = neg ? -v : v;\n  const base = pow10(decimals);\n  const int = abs / base;\n  let frac = (abs % base).toString().padStart(decimals, '0').slice(0, precision).replace(/0+$/, '');\n  return `${neg ? '-' : ''}${int}${frac ? '.' + frac : ''}`;\n}\n\nfunction parseUnits(text, decimals = 18) {\n  const [i, f = ''] = String(text).split('.');\n  return BigInt(i + f.padEnd(decimals, '0').slice(0, decimals));\n}\n\n  // Política de risco do agente. Tudo que a camada de execução puder fazer\n// precisa passar por aqui primeiro — o agente de IA propõe, a política decide.\n\nconst DEFAULT_POLICY = {\n  // --- capital -----------------------------------------------------------\n  minFundingWei: '1000000000000000',      // 0.001 ETH mínimo para ativar\n  maxNotionalPerTradeWei: '10000000000000000',  // 0.01 ETH por operação\n  maxDailyNotionalWei: '100000000000000000',    // 0.1 ETH por dia\n  reserveGasWei: '2000000000000000',      // nunca gastar abaixo desta reserva\n\n  // --- risco de mercado --------------------------------------------------\n  maxSlippageBps: 100,\n  minPoolLiquidityWei: '50000000000000000', // ignora pools sem profundidade\n  maxDrawdownBps: 2000,                   // 20% de queda do NAV pausa o agente\n  maxInventoryBps: 6000,                  // no máx. 60% do NAV no token\n\n  // --- ritmo -------------------------------------------------------------\n  maxTradesPerHour: 6,\n  minSecondsBetweenTrades: 120,\n\n  // --- governança --------------------------------------------------------\n  mode: 'propose',                        // 'propose' | 'auto'\n  requireApprovalAboveWei: '5000000000000000',\n  allowedTokens: [],                      // vazio = qualquer token indexado\n  blockedTokens: [],\n  killSwitch: false,\n};\n\n/** wei -> ETH legível. Sem dependência: a política não importa nada de fora. */\nconst fmtEth = (wei) => {\n  const v = BigInt(wei);\n  const whole = v / 10n ** 18n;\n  const frac = (v % 10n ** 18n).toString().padStart(18, '0').replace(/0+$/, '');\n  return frac ? `${whole}.${frac}` : String(whole);\n};\n\nconst BIG_FIELDS = [\n  'minFundingWei', 'maxNotionalPerTradeWei', 'maxDailyNotionalWei',\n  'reserveGasWei', 'minPoolLiquidityWei', 'requireApprovalAboveWei',\n];\n\nfunction validatePolicy(policy) {\n  const p = { ...policy };\n  for (const f of BIG_FIELDS) {\n    if (p[f] === undefined) throw new Error(`incomplete policy: ${f}`);\n    p[f] = BigInt(p[f]).toString();\n  }\n  if (!['propose', 'auto'].includes(p.mode)) throw new Error(\"mode must be 'propose' or 'auto'\");\n  if (BigInt(p.maxNotionalPerTradeWei) > BigInt(p.maxDailyNotionalWei)) {\n    throw new Error('maxNotionalPerTradeWei cannot exceed maxDailyNotionalWei');\n  }\n  return p;\n}\n\n/**\n * Avalia uma decisão proposta pelo agente contra a política e o estado atual.\n * Retorna sempre uma lista de violações — vazia significa aprovado.\n */\nfunction evaluate(decision, ctx) {\n  const p = ctx.policy;\n  const v = [];\n\n  if (p.killSwitch) v.push('kill switch is on');\n  if (decision.notionalWei !== undefined) {\n    const n = BigInt(decision.notionalWei);\n    // Taxa de serviço, quando houver. Ausente = 0, e aí a conta inteira fica\n    // idêntica à de antes da taxa existir.\n    const fee = BigInt(decision.feeWei ?? 0);\n\n    // Os limites de notional continuam olhando SÓ o notional: taxa não é\n    // exposição de mercado, e somá-la aqui encolheria em silêncio o orçamento\n    // de todo agente já salvo.\n    if (n > BigInt(p.maxNotionalPerTradeWei)) v.push(`notional ${n} exceeds the per-trade limit`);\n    if (BigInt(ctx.spentTodayWei ?? 0) + n > BigInt(p.maxDailyNotionalWei)) v.push('daily notional limit exceeded');\n\n    // A reserva de gás, sim, olha a saída TOTAL de ETH. Ela existe para o\n    // agente sempre conseguir sair de uma posição, e a taxa também sai da\n    // carteira. Sem isso a decisão passaria na aprovação e só estouraria no\n    // meio da execução, com o WETH já embrulhado.\n    //\n    // Diz o número que resolve, não só que está errado. \"eat into the gas\n    // reserve\" deixa a pessoa adivinhando quanto cabe; o teto é uma subtração.\n    const balance = BigInt(ctx.ethBalanceWei ?? 0);\n    const reserve = BigInt(p.reserveGasWei);\n    if (balance - (n + fee) < reserve) {\n      const room = balance > reserve ? balance - reserve : 0n;\n      v.push(\n        `this would eat into the gas reserve — balance ${fmtEth(balance)} ETH minus the ` +\n        `${fmtEth(reserve)} ETH reserved for gas` +\n        (fee > 0n ? ` minus the ${fmtEth(fee)} ETH service fee` : '') +\n        ` leaves at most ${fmtEth(room)} ETH per trade` +\n        (room === 0n ? '. Deposit more ETH into the agent wallet.' : ''),\n      );\n    }\n  }\n  if (ctx.poolLiquidityWei !== undefined && BigInt(ctx.poolLiquidityWei) < BigInt(p.minPoolLiquidityWei)) {\n    v.push('pool liquidity below the minimum');\n  }\n  if (ctx.drawdownBps !== undefined && ctx.drawdownBps > p.maxDrawdownBps) v.push('maximum drawdown reached');\n  if (ctx.inventoryBps !== undefined && decision.side === 'buy' && ctx.inventoryBps > p.maxInventoryBps) {\n    v.push('token inventory above the cap');\n  }\n  // \"trades\" aqui significa operações ENVIADAS. Quem passa esse contador é o\n  // runner, e ele conta só decisões com status 'executed' — simular não gasta\n  // nada e não pode consumir cota.\n  if (ctx.tradesLastHour >= p.maxTradesPerHour) {\n    v.push(`hourly trade limit reached (${ctx.tradesLastHour} of ${p.maxTradesPerHour} executed in the last hour)`);\n  }\n  if (ctx.secondsSinceLastTrade !== undefined && ctx.secondsSinceLastTrade < p.minSecondsBetweenTrades) {\n    v.push('minimum interval between trades not met');\n  }\n  if (p.blockedTokens.map((t) => t.toLowerCase()).includes(String(decision.token).toLowerCase())) {\n    v.push('token is on the block list');\n  }\n  if (p.allowedTokens.length && !p.allowedTokens.map((t) => t.toLowerCase()).includes(String(decision.token).toLowerCase())) {\n    v.push('token is not on the allow list');\n  }\n\n  const needsApproval = p.mode === 'propose'\n    || (decision.notionalWei !== undefined && BigInt(decision.notionalWei) >= BigInt(p.requireApprovalAboveWei));\n\n  return { violations: v, approved: v.length === 0, needsApproval };\n}\n\n\n\n  const SPECS = [{\"id\":\"buyback_burn\",\"label\":\"Buyback & burn\",\"description\":\"Buys the token with the agent balance and sends it to the burn address.\",\"needsCapital\":true,\"needsDelegation\":false,\"params\":{\"amountEth\":{\"type\":\"decimal\",\"default\":\"0.005\",\"label\":\"ETH per run\"},\"minIntervalMinutes\":{\"type\":\"int\",\"default\":60,\"label\":\"Minimum interval between runs (min)\"},\"burnAddress\":{\"type\":\"address\",\"default\":\"0x000000000000000000000000000000000000dEaD\",\"label\":\"Burn address\"}}},{\"id\":\"rewards_boost\",\"label\":\"Creator rewards → buyback & burn\",\"description\":\"Collects creator rewards, holds them in reserve, and after graduation puts 100% into buy and burn.\",\"needsCapital\":false,\"needsDelegation\":true,\"params\":{\"mode\":{\"type\":\"enum\",\"options\":[\"reserve_until_graduation\",\"burn_immediately\",\"collect_only\"],\"default\":\"reserve_until_graduation\",\"label\":\"What to do with rewards\"},\"deployPercent\":{\"type\":\"int\",\"default\":100,\"label\":\"% of rewards spent on buyback\"},\"minCollectWei\":{\"type\":\"decimal\",\"default\":\"0.002\",\"label\":\"Only collect above (ETH)\"},\"checkIntervalMinutes\":{\"type\":\"int\",\"default\":240,\"label\":\"Check interval (min)\"}}},{\"id\":\"dca\",\"label\":\"Scheduled buys (DCA)\",\"description\":\"Buys a fixed amount on a regular interval, with a per-order impact ceiling.\",\"needsCapital\":true,\"needsDelegation\":false,\"params\":{\"amountEth\":{\"type\":\"decimal\",\"default\":\"0.002\",\"label\":\"ETH per buy\"},\"intervalMinutes\":{\"type\":\"int\",\"default\":720,\"label\":\"Interval between buys (min)\"},\"totalBudgetEth\":{\"type\":\"decimal\",\"default\":\"0.1\",\"label\":\"Total program budget (ETH)\"},\"destination\":{\"type\":\"enum\",\"options\":[\"hold\",\"burn\"],\"default\":\"hold\",\"label\":\"Where bought tokens go\"}}},{\"id\":\"dip_buy\",\"label\":\"Dip buying\",\"description\":\"Buys when the price falls below its recent high by the percentage you choose.\",\"needsCapital\":true,\"needsDelegation\":false,\"params\":{\"dropPercent\":{\"type\":\"int\",\"default\":10,\"label\":\"Buy when the price falls this much (%)\"},\"amountEth\":{\"type\":\"decimal\",\"default\":\"0.002\",\"label\":\"How much ETH to spend each time\"},\"windowHours\":{\"type\":\"int\",\"default\":24,\"label\":\"Compare against the highest price of the last (hours)\"},\"cooldownMinutes\":{\"type\":\"int\",\"default\":180,\"label\":\"Wait at least this long between buys (minutes)\"},\"destination\":{\"type\":\"enum\",\"options\":[\"hold\",\"burn\"],\"default\":\"hold\",\"label\":\"Where the tokens go\"}}},{\"id\":\"airdrop\",\"label\":\"Airdrop\",\"description\":\"Distributes the token to a recipient list you provide.\",\"needsCapital\":false,\"needsDelegation\":false,\"params\":{\"recipientsCsv\":{\"type\":\"text\",\"default\":\"\",\"label\":\"List: address,amount per line\"},\"batchSize\":{\"type\":\"int\",\"default\":50,\"label\":\"Transfers per batch\"},\"dryRun\":{\"type\":\"bool\",\"default\":true,\"label\":\"Simulate only\"}}},{\"id\":\"holder_airdrop\",\"label\":\"Reward the holders\",\"description\":\"Distributes tokens to the real holders of your token, read from chain.\",\"needsCapital\":false,\"needsDelegation\":false,\"params\":{\"amountTokens\":{\"type\":\"decimal\",\"default\":\"0\",\"label\":\"Total to distribute (0 = whole balance)\"},\"mode\":{\"type\":\"enum\",\"options\":[\"equal\",\"proportional\"],\"default\":\"proportional\",\"label\":\"How to split\"},\"minHolderBalance\":{\"type\":\"decimal\",\"default\":\"1000\",\"label\":\"Minimum balance to qualify\"},\"maxHolders\":{\"type\":\"int\",\"default\":200,\"label\":\"Max holders per run (largest first)\"},\"excludeAddresses\":{\"type\":\"text\",\"default\":\"\",\"label\":\"Extra addresses to exclude, one per line\"},\"batchSize\":{\"type\":\"int\",\"default\":50,\"label\":\"Transfers per batch\"},\"dryRun\":{\"type\":\"bool\",\"default\":true,\"label\":\"Simulate only\"}}}];\n  const TOKEN = {\"address\":\"0x9f2b4c7e1a83d5064b7e2c9a15fd3e8b7c04a621\",\"symbol\":\"MYTOKEN\",\"name\":\"My Token\",\"decimals\":18,\"isToken0\":true,\"poolFee\":10000,\"sqrtPriceX96\":\"4619756043376610355707904\",\"liquidity\":\"28583097523751473441946\",\"totalSupply\":\"1000000000000000000000000000\",\"burned\":\"18400000000000000000000000\",\"graduated\":false,\"pairedPrincipal\":\"3114000000000000000\",\"graduationThreshold\":\"4200000000000000000\",\"pendingRewards\":\"13800000000000000\",\"maxTxTokens\":\"10000000000000000000000000\",\"maxWalletTokens\":\"20000000000000000000000000\"};\n  const CONTRACTS = {\"factory\":\"0xA5aAb3F0c6EeadF30Ef1D3Eb997108E976351feB\",\"factoryDeployBlock\":\"8991118\",\"locker\":\"0x736D76699C26D0d966744cAe304C000d471f7F35\",\"v3Factory\":\"0x1f7d7550B1b028f7571E69A784071F0205FD2EfA\",\"weth\":\"0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73\"};\n  const BURN = \"0x000000000000000000000000000000000000dEaD\";\n  const CHAIN_ID = 4663;\n\n  const S = { agents: [], fns: {}, decisions: [], nextId: 1, me: null };\n\n  const rnd = (n) => Array.from({ length: n }, () =>\n    '0123456789abcdef'[Math.floor(Math.random() * 16)]).join('');\n  const mkAddress = () => {\n    const h = rnd(40);\n    return '0x' + h.split('').map((c, i) => (parseInt(rnd(1), 16) > 7 ? c.toUpperCase() : c)).join('');\n  };\n  const now = () => Math.floor(Date.now() / 1000);\n\n  // ===== normalização de parâmetros (espelha functions/index.js) =====\n  function normalize(fnId, input) {\n    const spec = SPECS.find((s) => s.id === fnId);\n    const out = {};\n    for (const [k, def] of Object.entries(spec.params)) {\n      const raw = (input && input[k] !== undefined && input[k] !== '') ? input[k] : def.default;\n      if (def.type === 'int') {\n        const n = Number(raw);\n        if (!Number.isInteger(n) || n < 0) throw new Error(spec.label + ' → ' + def.label + ': must be an integer >= 0');\n        out[k] = n;\n      } else if (def.type === 'decimal') {\n        if (!/^\\d+(\\.\\d+)?$/.test(String(raw))) throw new Error(spec.label + ' → ' + def.label + ': must be a positive decimal');\n        out[k] = String(raw);\n      } else if (def.type === 'bool') {\n        out[k] = raw === true || raw === 'true';\n      } else if (def.type === 'enum') {\n        out[k] = def.options.includes(raw) ? raw : def.default;\n      } else {\n        out[k] = raw ?? '';\n      }\n    }\n    return out;\n  }\n\n  // ===== helpers de mercado usando a matemática real =====\n  const price = () => tokenPriceInPair({\n    sqrtPriceX96: BigInt(TOKEN.sqrtPriceX96), isToken0: TOKEN.isToken0,\n    tokenDecimals: TOKEN.decimals, pairDecimals: 18,\n  });\n\n  const quote = (amountIn, side) => simulateSwap({\n    sqrtPriceX96: BigInt(TOKEN.sqrtPriceX96), liquidity: BigInt(TOKEN.liquidity),\n    amountIn, side, isToken0: TOKEN.isToken0, feePips: TOKEN.poolFee,\n  });\n\n  const circulating = () => ({\n    total: BigInt(TOKEN.totalSupply),\n    burned: BigInt(TOKEN.burned),\n    circulating: BigInt(TOKEN.totalSupply) - BigInt(TOKEN.burned),\n  });\n\n  // ===== as cinco funções =====\n  const withSlippage = (a, bps) => (BigInt(a) * BigInt(10000 - bps)) / 10000n;\n\n  function planBuyback(agent, p) {\n    const amountIn = parseUnits(p.amountEth, 18);\n    const notes = [];\n    if (agent.eth < amountIn) {\n      return { notes: ['insufficient balance: has ' + formatUnits(agent.eth, 18) + ' ETH, needs ' + p.amountEth], decisions: [] };\n    }\n    const sim = quote(amountIn, 'buy');\n    const s = circulating();\n    notes.push('circulating supply today: ' + formatUnits(s.circulating, 18, 0) + ' of ' + formatUnits(s.total, 18, 0) +\n      ' (burned: ' + formatUnits(s.burned, 18, 0) + ')');\n    notes.push('totalSupply() does not change when you burn — the pons token has no burn()');\n    return {\n      notes,\n      decisions: [{\n        kind: 'buyback_burn', token: TOKEN.address, side: 'buy',\n        notionalWei: amountIn.toString(), priceImpactBps: sim.priceImpactBps,\n        expectedTokensOut: sim.amountOut.toString(),\n        rationale: 'buyback of ' + p.amountEth + ' ETH followed by a burn',\n        steps: [\n          { action: 'swap', side: 'buy', amountInWei: amountIn.toString(), minOutWei: withSlippage(sim.amountOut, 100).toString() },\n          { action: 'transfer', to: p.burnAddress || BURN, nst out = []; const errors = []; const seen = {};\n    String(csv).split(/\\r?\\n/).forEach((line, i) => {\n      const raw = line.trim();\n      if (!raw || raw[0] === '#') return;\n      const parts = raw.split(/[,;\\t]/).map((s) => (s || '').trim());\n      const addr = parts[0]; const amount = parts[1]; const n = i + 1;\n      if (!/^0x[0-9a-fA-F]{40}$/.test(addr || '')) { errors.push('line ' + n + ': invalid address \"' + addr + '\"'); return; }\n      if (seen[addr.toLowerCase()]) { errors.push('line ' + n + ': duplicate address ' + addr); return; }\n      let value;\n      try { value = parseUnits(amount, decimals); } catch (e) { errors.push('line ' + n + ': invalid amount \"' + amount + '\"'); return; }\n      if (value <= 0n) { errors.push('line ' + n + ': amount must be greater than zero'); return; }\n      seen[addr.toLowerCase()] = 1;\n      out.push({ address: addr, amount: value });\n    });\n    return { recipients: out, errors, total: out.reduce((s, r) => s + r.amount, 0n) };\n  }\n\n  function planAirdrop(agent, p) {\n    const parsed = parseRecipients(p.recipientsCsv, TOKEN.decimals);\n    const notes = parsed.errors.slice();\n    if (!parsed.recipients.length) {\n      notes.push('no valid recipients — provide the address list');\n      return { notes, decisions: [] };\n    }\n    const known = S.agents.map((a) => a.address.toLowerCase()).concat([String(S.me || '').toLowerCase()]);\n    const self = parsed.recipients.filter((r) => known.indexOf(r.address.toLowerCase()) >= 0);\n    if (self.length) {\n      self.forEach((h) => notes.push('recipient ' + h.address + ' is a wallet owned by this tool'));\n      notes.push('airdrop cancelled: the list points at wallets owned by this tool');\n      return { notes, decisions: [] };\n    }\n    if (agent.token < parsed.total) {\n      notes.push('agent balance (' + formatUnits(agent.token, 18, 4) + ') is below the airdrop total (' +\n        formatUnits(parsed.total, 18, 4) + ')');\n    }\n    const over =
