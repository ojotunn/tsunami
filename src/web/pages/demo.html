th ? (a.eth > 300000000000000n ? a.eth - 300000000000000n : 0n) : a.token;\n      if (amount <= 0n) throw new Error('nothing to withdraw');\n      if (body.live) { if (isEth) a.eth = 0n; else a.token = 0n; }\n      return {\n        dryRun: !body.live, asset: isEth ? 'eth' : 'token',\n        to: body.to || S.me, amount: amount.toString(),\n        gasCost: isEth ? '300000000000000' : undefined,\n        hash: body.live ? '0x' + rnd(64) : undefined,\n      };\n    }],\n\n    ['PATCH', /^\\/api\\/agents\\/([^/]+)$/, (m, body) => {\n      const a = S.agents.find((x) => x.id === m[1]);\n      if (body.label !== undefined) a.label = String(body.label).trim() || a.label;\n      if (body.token !== undefined) a.target_token = body.token ? String(body.token).toLowerCase() : null;\n      return { ok: true, agent: a, tokenInfo: body.token\n        ? { address: body.token, valid: true, hasCode: true, isPonsToken: true,\n            erc20: { name: TOKEN.name, symbol: TOKEN.symbol, decimals: 18 }, verdict: null }\n        : null };\n    }],\n\n    ['POST', /^\\/api\\/agents\\/([^/]+)\\/delegation$/, (m) => {\n      const a = S.agents.find((x) => x.id === m[1]);\n      return {\n        agentAddress: a.address, token: TOKEN.address,\n        tokenInfo: { address: TOKEN.address, valid: true, hasCode: true, isPonsToken: true,\n          erc20: { name: TOKEN.name, symbol: TOKEN.symbol, decimals: 18 }, verdict: null },\n        status: { feeRecipient: a.delegated ? a.address : S.me, redirectedToAgent: a.delegated, canCollectNow: a.delegated },\n        transactions: [\n          {\n            label: 'point the creator payout at the agent', to: CONTRACTS.locker,\n            data: '0x2f1a' + rnd(60), signature: 'setFeeRedirect(address,address)',\n            note: 'only the token deployer can call this; from then on rewards land in the agent wallet',\n            simulation: { ok: true },\n          },\n          {\n            label: 'authorize the agent to trigger collection', to: CONTRACTS.locker,\n            data: '0x8b4c' + rnd(60), signature: 'setFeeCollector(address,bool)',\n            note: 'restricted to the locker owner — if it fails, the agent can still collect through the pons interface',\n            // A demo mostra o caso real: esta chamada é do dono do locker, não do\n            // criador do token. Fingir que passa esconderia justamente a limitação.\n            simulation: { ok: false, error: 'OwnableUnauthorizedAccount',\n              reason: 'This call is restricted to the locker owner - the pons team, not token creators. You cannot authorize a collector yourself; the agent collects through the redirect instead.' },\n          },\n        ],\n      };\n    }],\n\n    ['POST', /^\\/api\\/decisions\\/(\\d+)\\/execute$/, () => {\n      throw new Error('execution is disabled in the demo — run the site locally to try it');\n    }],\n\n    ['POST', /^\\/api\\/decisions\\/(\\d+)\\/(approve|reject)$/, (m) => {\n      const d = S.decisions.find((x) => x.id === Number(m[1]));\n      if (d) d.status = m[2] === 'approve' ? 'approved' : 'rejected_by_user';\n      return { ok: true };\n    }],\n\n    ['POST', /^\\/api\\/airdrop\\/validate$/, (m, body) => {\n      const p = parseRecipients(body.csv || '', 18);\n      return {\n        count: p.recipients.length, total: p.total.toString(),\n        totalFormatted: formatUnits(p.total, 18, 4), errors: p.errors,\n        sample: p.recipients.slice(0, 5).map((r) => ({ address: r.address, amount: r.amount.toString() })),\n      };\n    }],\n  ];\n\n  window.fetch = async function (url, opts) {\n    opts = opts || {};\n    const path = String(url).replace(/^https?:\\/\\/[^/]+/, '');\n    const method = opts.method || 'GET';\n    const body = opts.body ? JSON.parse(opts.body) : {};\n    await new Promise((r) => setTimeout(r, 90));\n    for (const [m, re, fn] of ROUTES) {\n      if (m !== method) continue;\n      const match = re.exec(path);\n      if (!match) continue;\n      try {\n        const out = fn(match, body);\n        return new Response(JSON.stringify(out, (k, v) => (typeof v === 'bigint' ? v.toString() : v)),\n          { status: 200, headers: { 'content-type': 'application/json' } });\n      } catch (e) {\n        return new Response(JSON.stringify({ error: e.message }), { status: 400, headers: { 'content-type': 'application/json' } });\n      }\n    }\n    return new Response(JSON.stringify({ error: 'route not available in the demo: ' + method + ' ' + path }),\n      { status: 404, headers: { 'content-type': 'application/json' } });\n  };\n\n  // ===== carteira falsa: o \"conectar\" e o \"assinar\" funcionam na demo =====\n  S.me = null;\n  window.ethereum = {\n    isDemo: true,\n    request: async ({ method, params }) => {\n      if (method === 'eth_requestAccounts') { S.me = mkAddress(); return [S.me]; }\n      if (method === 'personal_sign') return '0x' + rnd(130);\n      // A demo finge estar sempre na rede certa: a troca de rede é justamente\n      // a parte que não dá para simular de forma honesta sem uma carteira real.\n      if (method === 'eth_chainId') return '0x1237';\n      if (method === 'wallet_switchEthereumChain' || method === 'wallet_addEthereumChain') return null;\n      if (method === 'eth_sendTransaction') {\n        const a = S.agents.find((x) => x.id === (window.__lastAgentId || ''));\n        S.agents.forEach((x) => { x.delegated = true; });\n        return '0x' + rnd(64);\n      }\n      throw new Error('método não simulado: ' + method);\n    },\n  };\n\n  // ===== ferramentas de demo: depositar e limpar =====\n  window.__demo = {\n    fund(agentId, eth) {\n      const a = S.agents.find((x) => x.id === agentId);\n      if (!a) return;\n      a.eth += parseUnits(String(eth), 18);\n      a.token += parseUnits('12840000', 18);\n      a.status = 'funded';\n    },\n    state: S,\n  };\n\n  window.alert = (m) => {\n    const d = document.createElement('div');\n    d.textContent = m;\n    d.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1a212a;' +\n      'border:1px solid #2f3a47;color:#e8eef5;padding:12px 18px;border-radius:10px;font:13px system-ui;' +\n      'z-index:9999;max-width:80%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5)';\n    document.body.appendChild(d);\n    setTimeout(() => d.remove(), 3400);\n  };\n  // location.reload é somente-leitura no navegador — o \"Sair\" é tratado na barra de demo.\n  window.__demoLogout = () => {\n    S.me = null;\n    S.agents.length = 0;\n    S.decisions.length = 0;\n    document.getElementById('gate').style.display = 'block';\n    document.getElementById('app').style.display = 'none';\n    document.getElementById('connectBtn').style.display = 'inline-block';\n    document.getElementById('logoutBtn').style.display = 'none';\n    document.getElementById('userChip').style.display = 'none';\n  };\n})();\n<\/script>\n<script>\n(function () {\n  function build() {\n    const bar = document.createElement('div');\n    bar.style.cssText = 'position:fixed;right:18px;bottom:18px;background:#141920;border:1px solid #2a3542;' +\n      'border-radius:12px;padding:13px 15px;z-index:900;font:12px system-ui;color:#8b98a8;' +\n      'box-shadow:0 10px 34px rgba(0,0,0,.55);max-width:250px';\n    bar.innerHTML = '<div style=\"color:#e3b341;font-weight:600;margin-bottom:7px\">demo mode<\/div>' +\n      '<div style=\"margin-bottom:9px;line-height:1.45\">The agent starts with no balance, just like the real thing. ' +\n      'Fund it so the capital functions can run.<\/div>' +\n      '<button id=\"__fund\" style=\"background:#5aa2ff;color:#04101f;border:0;border-radius:7px;padding:7px 12px;' +\n      'font:inherit;font-weight:600;cursor:pointer;width:100%\">Deposit 0.05 ETH into the agent<\/button>';\n    document.body.appendChild(bar);\n    const out = document.getElementById('logoutBtn');\n    if (out) out.onclick = () => window.__demoLogout();\n\n    document.getElementById('__fund').onclick = () => {\n      const sel = document.getElementById('agentSelect');\n      if (!sel || !sel.value) return alert('create and select an agent first');\n      window.__demo.fund(sel.value, 0.05);\n      sel.dispatchEvent(new Event('change'));\n      alert('0.05 ETH credited to the agent wallet (demo)');\n    };\n  }\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', build);\n  else build();\n})();\n<\/script>\n<\/head>\n<body>\n\n<nav>\n  <div class=\"logo\"><a href=\"/\" style=\"color:inherit;display:flex;align-items:center;gap:9px\"><img src=\"/assets/brand-64.png\" alt=\"\" width=\"24\" height=\"24\">{{BRAND_HTML}}<\/a><\/div>\n  <span class=\"chip\" id=\"chainChip\">…<\/span>\n  <div class=\"sp\"><\/div>\n  <span class=\"chip\" id=\"walletChain\" style=\"display:none\"><\/span>\n  <span class=\"chip\" id=\"userChip\" style=\"display:none\"><\/span>\n  <button id=\"connectBtn\">Connect wallet<\/button>\n  <button class=\"ghost sm\" id=\"logoutBtn\" style=\"display:none\">Sign out<\/button>\n<\/nav>\n\n<div id=\"gate\" class=\"gate\">\n  <h1>Connect your wallet<\/h1>\n  <p>You'll sign a plain text message to prove the address is yours.\n     This moves no funds and authorizes no transaction.<\/p>\n  <button id=\"gateBtn\">Connect wallet<\/button>\n  <p style=\"margin-top:20px;font-size:12px\">\n    No wallet in your browser? The <a href=\"/\">CLI<\/a> does the same from the command line.\n  <\/p>\n<\/div>\n\n<main id=\"app\" style=\"display:none\">\n  <div>\n    <div class=\"card\">\n      <h2>Create agent<\/h2>\n      <label>Label<\/label>\n      <input id=\"label\" placeholder=\"my token's agent\">\n      <label>Target token<\/label>\n      <input id=\"token\" class=\"mono\" placeholder=\"0x…\">\n      <label>Keystore password<\/label>\n      <input id=\"password\" type=\"password\" placeholder=\"at least 8 characters\">\n      <label style=\"display:flex;gap:8px;align-items:flex-start;margin-top:14px;cursor:pointer\">\n        <input type=\"checkbox\" id=\"terms\" style=\"width:auto;margin-top:3px\">\n        <span style=\"font-size:12px;color:var(--dim)\">I have read the\n          <a href=\"/terms\" target=\"_blank\">terms and risks<\/a> — including that losing the\n          password means losing the agent's funds.<\/span>\n      <\/label>\n      <button id=\"createBtn\" style=\"margin-top:12px\">Create agent and wallet<\/button>\n      <div id=\"created\" style=\"display:none\">\n        <div class=\"addr\">\n          <div style=\"font-size:12px;color:var(--dim);margin-bottom:6px\">Deposit address<\/div>\n          <div class=\"mono\" id=\"createdAddr\"><\/div>\n        <\/div>\n        <div class=\"note warn\">Save this password. Without it the keystore — and the agent's funds — cannot be recovered.<\/div>\n        <div class=\"note\" id=\"depositAdvice\"><\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"card\">\n      <h2>My agents<\/h2>\n      <select id=\"agentSelect\"><option value=\"\">—<\/option><\/select>\n      <div id=\"agentInfo\"><\/div>\n    <\/div>\n\n    <div class=\"card\">\n      <h2>Delegate creator rewards<\/h2>\n      <p style=\"font-size:12px;color:var(--dim)\">\n        One signature points your creator payout at the agent. Revert it whenever you want.\n      <\/p>\n      <button class=\"ghost\" id=\"delegBtn\" style=\"margin-top:12px\">Prepare transaction<\/button>\n      <div id=\"delegOut\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div>\n    <div id=\"betaBanner\"><\/div>\n    <div class=\"banner\">\n      <strong>About burning:<\/strong> the pons token has no <code>burn()<\/code>.\n      Sending to <code>0x…dEaD<\/code> does remove coins from circulation, but\n      <code>totalSupply()<\/code> stays at 1B forever. Publish circulating supply,\n      not total.\n    <\/div>\n\n    <div class=\"card\">\n      <h2>Functions<\/h2>\n      <div id=\"functions\"><div class=\"empty\">loading…<\/div><\/div>\n\n      <div class=\"runbar\">\n        <div class=\"rule\"><\/div>\n\n        <!-- Senha: aparece so no primeiro start desta aba. Depois disso o\n             botao age sozinho, e este bloco fica escondido. -->\n        <div id=\"askPw\" style=\"display:none\">\n          <p class=\"cap\">Keystore password · unlocks this agent for this browser tab<\/p>\n          <input type=\"password\" id=\"livePw\" placeholder=\"agent password\" autocomplete=\"off\">\n        <\/div>\n\n        <div id=\"agentState\" class=\"state\" style=\"display:none\">\n          <span class=\"dot\"><\/span><span id=\"stateText\"><\/span>\n          <button class=\"linky\" onclick=\"forgetPassword()\">lock<\/button>\n        <\/div>\n\n        <button id=\"runBtn\" disabled>Start agent<\/button>\n        <button class=\"linky\" id=\"dryBtn\" disabled onclick=\"startAgent(false)\">preview without sending<\/button>\n\n        <div class=\"warnline\">Runs the agent and sends every decision your policy approves,\n          without stopping for review one by one. Your risk policy, the protocol limits and\n          the on-chain check before each transaction all still apply.<\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"card\">\n      <h2>Results<\/h2>\n      <div id=\"result\"><div class=\"empty\">Pick an agent, turn on some functions, and run it.<\/div><\/div>\n    <\/div>\n  <\/div>\n<\/main>\n\n<script>\nconst $ = (id) => document.getElementById(id);\nconst esc = (s) => String(s ?? '').replace(/[&<>\"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst api = async (method, path, body) => {\n  const res = await fetch(path, {\n    method, headers: {'content-type':'application/json'},\n    body: body ? JSON.stringify(body) : undefined, credentials: 'same-origin',\n  });\n  const data = await res.json();\n  if (!res.ok) throw new Error(data.error || 'request failed');\n  return data;\n};\n// Prices in these pools are tiny (1e-9 ETH is common). Rounding to 6 decimals would\n// show \"0\" for almost every token, so values below 1 use significant digits instead\n// of fixed decimal places.\nconst eth = (wei, d = 18) => {\n  const v = BigInt(wei || 0);\n  if (v === 0n) return '0';\n  const neg = v < 0n;\n  const n = Number(neg ? -v : v) / Number(10n ** BigInt(d));\n  const s = n >= 1 ? n.toFixed(6).replace(/0+$/, '').replace(/\\.$/, '') : Number(n.toPrecision(4)).toString();\n  return (neg ? '-' : '') + s;\n};\n\nlet CONFIG = null, ME = null, AGENT = null, ME_TERMS = false;\n\nasync function boot() {\n  CONFIG = await api('GET', '/api/config');\n  renderFunctions();\n  renderBanners();\n  api('GET', '/api/health').then((h) => {\n    const c = $('chainChip');\n    if (h.rpc === 'ok' && h.chainId === h.expected) {\n      c.className = 'chip ok'; c.textContent = `chain ${h.chainId} · block ${h.head}`;\n    } else {\n      c.className = 'chip bad';\n      c.textContent = h.rpc === 'ok' ? `unexpected chain ${h.chainId}` : 'RPC unavailable';\n    }\n  });\n  const me = await api('GET', '/api/auth/me');\n  ME_TERMS = !!me.termsAccepted;\n  // Conta que já usava a ferramenta e ainda não aceitou a versão atual dos\n  // termos precisa saber disso antes de tentar executar, não no erro.\n  if (me.address && !ME_TERMS) renderBanners();\n  if (me.address) await onLogin(me.address);\n}\n\n// ---------------------------------------------------------------- login\n\nasync function connect() {\n  if (!window.ethereum) {\n    return alert('No wallet found in this browser. Install MetaMask or use the CLI.');\n  }\n  try {\n    const [address] = await window.ethereum.request({ method: 'eth_requestAccounts' });\n    // Troca de rede antes de assinar: assim a pessoa já entra na rede certa e\n    // não descobre o problema só na hora da primeira transação. Se ela recusar,\n    // o login continua — assinar mensagem não depende de rede.\n    await ensureChain({ silent: true });\n    const { nonce, message } = await api('POST', '/api/auth/nonce', { address });\n    const signature = await window.ethereum.request({\n      method: 'personal_sign', params: [message, address],\n    });\n    const session = await api('POST', '/api/auth/verify', { address, nonce, signature });\n    ME_TERMS = false;\n    await onLogin(session.address);\n  } catch (e) {\n    alert(e.message || 'could not connect');\n  }\n}\n\nasync function onLogin(address) {\n  ME = address;\n  $('gate').style.display = 'none';\n  $('app').style.display = 'grid';\n  $('connectBtn').style.display = 'none';\n  $('logoutBtn').style.display = 'inline-block';\n  const chip = $('userChip');\n  chip.style.display = 'inline-block';\n  chip.textContent = address.slice(0, 6) + '…' + address.slice(-4);\n  renderWalletChain();\n  await loadAgents();\n}\n\n$('connectBtn').onclick = connect;\n$('gateBtn').onclick = connect;\n$('logoutBtn').onclick = async () => { await api('POST', '/api/auth/logout'); location.reload(); };\n\n// ---------------------------------------------------------------- agentes\n\n// A lista é carregada e um agente é SELECIONADO sozinho.\n//\n// Deixar o seletor vazio depois de um refresh faz o painel parecer vazio, e\n// painel vazio parece perda de dados — foi exatamente essa a leitura num teste\n// real (\"atualizei a página e meu agente sumiu\"). Nada tinha sumido: só não\n// havia nada escolhido. Escolher sozinho custa uma linha e elimina o susto.\nasync function loadAgents(preferId = null) {\n  const agents = await api('GET', '/api/agents');\n  const sel = $('agentSelect');\n  sel.innerHTML = '<option value=\"\">—<\/option>' +\n    agents.map((a) => `<option value=\"${a.id}\">${esc(a.label)} · ${a.address.slice(0,10)}…<\/option>`).join('');\n\n  if (agents.length === 0) {\n    AGENT = null;\n    $('runBtn').disabled = true;\n    $('dryBtn').disabled = true;\n    $('agentInfo').innerHTML = `\n      <div class=\"kv\"><span>agents on this account<\/span><span>none yet<\/span><\/div>\n      <p class=\"muted\" style=\"margin:10px 0 0\">\n        Agents belong to the wallet that created them. This account\n        (<span class=\"mono\">${esc(ME || '')}<\/span>) has none.\n        If you created one earlier, switch back to that account in your wallet\n        and reload — nothing is deleted when you refresh.\n      <\/p>`;\n    return;\n  }\n\n  // mantém a escolha atual; senão fica com a última usada; senão com a primeira\n  const remembered = (() => { try { return sessionStorage.getItem('pons_agent'); } catch { return null; } })();\n  const wanted = (preferId && agents.some((a) => a.id === preferId) && preferId)\n    || (AGENT && agents.some((a) => a.id === AGENT.id) && AGENT.id)\n    || (remembered && agents.some((a) => a.id === remembered) && remembered)\n    || agents[0].id;\n  sel.value = wanted;\n  if (!AGENT || AGENT.id !== wanted) await selectAgent(wanted);\n}\n\n$('createBtn').onclick = async () => {\n  const b = $('createBtn');\n  if (!$('terms').checked && !ME_TERMS) return alert('please read and accept the terms first');\n  b.disabled = true; b.textContent = 'generating wallet…';\n  try {\n    if (!ME_TERMS) { await api('POST', '/api/terms/accept'); ME_TERMS = true; }\n    const agent = await api('POST', '/api/agents', {\n      label: $('label').value || 'agent', password: $('password').value,\n      token: $('token').value.trim() || undefined, custody: 'hybrid',\n    });\n    $('created').style.display = 'block';\n    $('createdAddr').textContent = agent.address;\n    $('depositAdvice').textContent = CONFIG.beta\n      ? `While this is in early access, keep deposits small — around ${CONFIG.depositAdviceEth} ETH is a sensible ceiling.`\n      : '';\n    $('password').value = '';\n    await loadAgents(agent.id);\n  } catch (e) { alert(e.message); }\n  b.disabled = false; b.textContent = 'Create agent and wallet';\n};\n\n$('agentSelect').onchange = (e) => selectAgent(e.target.value);\n\nasync function selectAgent(id) {\n  if (!id) {\n    AGENT = null; $('agentInfo').innerHTML = '';\n    $('runBtn').disabled = true; $('dryBtn').disabled = true;\n    renderRunState();\n    return;\n  }\n  AGENT = await api('GET', '/api/agents/' + id);\n  try { sessionStorage.setItem('pons_agent', id); } catch { /* modo privado: sem memória, sem problema */ }\n  $('runBtn').disabled = false;\n  $('dryBtn').disabled = false;\n  renderRunState();\n  // O token alvo é editável aqui. Antes só dava para escolher na criação, e\n  // quem errasse o endereço tinha que criar outro agente — carteira nova, chave\n  // nova, fundos para mover. Trocar um campo de texto não pode custar isso.\n  $('agentInfo').innerHTML = `\n    <div class=\"addr\"><div class=\"mono\">${AGENT.address}<\/div><\/div>\n    <div class=\"kv\"><span>status<\/span><span>${esc(AGENT.status)}<\/span><\/div>\n    <div class=\"kv\"><span>balance<\/span><span>${AGENT.balances ? AGENT.balances.ethFormatted + ' ETH' : 'network unavailable'}<\/span><\/div>\n    <label>Target token — the token this agent works on<\/label>\n    <input id=\"agentToken\" class=\"mono\" placeholder=\"0x…\" value=\"${esc(AGENT.target_token || '')}\">\n    <button class=\"ghost sm\" id=\"saveTokenBtn\" style=\"margin-top:8px\">Check and save token<\/button>\n    <div id=\"agentTokenOut\"><\/div>\n\n    <label style=\"margin-top:18px\">Withdraw — send the agent's funds back to you<\/label>\n    <div class=\"grid2\">\n      <select id=\"wAsset\">\n        <option value=\"eth\">ETH<\/option>\n        <option value=\"token\">the target token<\/option>\n      <\/select>\n      <input id=\"wPassword\" type=\"password\" placeholder=\"keystore password\">\n    <\/div>\n    <input id=\"wTo\" class=\"mono\" style=\"margin-top:8px\" placeholder=\"destination (default: ${esc(ME || 'your wallet')})\">\n    <div class=\"grid2\" style=\"margin-top:8px\">\n      <button class=\"ghost sm\" id=\"wCheckBtn\">Check first<\/button>\n      <button class=\"ghost sm\" id=\"wSendBtn\">Withdraw everything<\/button>\n    <\/div>\n    <div id=\"wOut\"><\/div>`;\n  $('saveTokenBtn').onclick = saveAgentToken;\n  $('wCheckBtn').onclick = () => withdraw(false);\n  $('wSendBtn').onclick = () => withdraw(true);\n  if (AGENT.target_token) $('token').value = AGENT.target_token;\n  for (const f of AGENT.functions) {\n    const cb = $('on-' + f.function_id);\n    if (cb) cb.checked = !!f.enabled;\n  }\n}\n\n/**\n * Grava o novo token alvo. O servidor confere o endereço na chain antes de\n * aceitar, então o erro aparece aqui — antes de a pessoa assinar qualquer coisa\n * e descobrir na MetaMask que o contrato não conhece o token.\n */\nasync function saveAgentToken() {\n  const btn = $('saveTokenBtn');\n  const out = $('agentTokenOut');\n  const value = $('agentToken').value.trim();\n  btn.disabled = true; btn.textContent = 'checking on chain…';\n  out.innerHTML = '';\n  try {\n    const r = await api('PATCH', '/api/agents/' + AGENT.id, { token: value });\n    AGENT = r.agent;\n    $('token').value = r.agent.target_token || '';\n    const ti = r.tokenInfo;\n    out.innerHTML = value\n      ? `<div class=\"note ok\">Saved. ${ti?.erc20 ? esc((ti.erc20.symbol || '') + ' ' + (ti.erc20.name || '')) + ' — ' : ''}launched through pons ✓<\/div>`\n      : '<div class=\"note\">Target token cleared.<\/div>';\n  } catch (e) {\n    out.innerHTML = `<div class=\"note bad\">${esc(e.message)}<\/div>`;\n  }\n  btn.disabled = false; btn.textContent = 'Check and save token';\n}\n\n/**\n * Saque. `live=false` só calcula e mostra o que sairia; `live=true` envia.\n * O destino em branco significa a carteira conectada — devolver ao dono é o\n * caso normal, e digitar endereço à mão é onde se perde dinheiro.\n */\nasync function withdraw(live) {\n  const out = $('wOut');\n  const password = $('wPassword').value;\n  if (!password) { out.innerHTML = '<div class=\"note bad\">Enter the agent keystore password.<\/div>'; return; }\n\n  const asset = $wValue('wAsset');\n  const to = $('wTo').value.trim() || undefined;\n\n  if (live && !confirm(\n    `Send the agent's entire ${asset === 'eth' ? 'ETH balance' : 'token balance'} to ` +\n    `${to || ME}?\\n\\nThis is a real transaction on chain.`\n  )) return;\n\n  const btn = live ? $('wSendBtn') : $('wCheckBtn');\n  const label = btn.textContent;\n  btn.disabled = true; btn.textContent = live ? 'sending…' : 'checking…';\n  try {\n    const r = await api('POST', `/api/agents/${AGENT.id}/withdraw`, { password, asset, to, live });\n    $('wPassword').value = '';\n    out.innerHTML = r.dryRun\n      ? `<div class=\"note\">Would send ${esc(fmtAmount(r, asset))} to <span class=\"mono\">${esc(r.to)}<\/span>` +\n        `${r.gasCost ? ' — gas up to ' + eth(r.gasCost) + ' ETH' : ''}. Nothing sent yet.<\/div>`\n      : `<div class=\"note ok\">Sent ${esc(fmtAmount(r, asset))} to <span class=\"mono\">${esc(r.to)}<\/span><br>` +\n        `<span class=\"mono\">${esc(r.hash || '')}<\/span><\/div>`;\n    if (!r.dryRun) await selectAgent(AGENT.id);\n  } catch (e) {\n    out.innerHTML = `<div class=\"note bad\">${esc(e.message)}<\/div>`;\n  }\n  btn.disabled = false; btn.textContent = label;\n}\n\nconst $wValue = (id) => $(id).value;\nconst fmtAmount = (r, asset) => asset === 'eth' ? eth(r.amount) + ' ETH' : r.amount + ' units';\n\n// ---------------------------------------------------------------- funções\n\nfunction renderFunctions() {\n  $('functions').innerHTML = CONFIG.functions.map((f) => `\n    <div class=\"fn\" id=\"fn-${f.id}\">\n      <div class=\"fn-head\" onclick=\"toggleFn('${f.id}')\">\n        <input type=\"checkbox\" style=\"width:auto\" id=\"on-${f.id}\" onclick=\"event.stopPropagation()\">\n        <strong>${esc(f.label)}<\/strong>\n        ${f.needsDelegation ? '<span class=\"tag\">delegation<\/span>' : ''}\n        ${f.needsCapital ? '<span class=\"tag\">capital<\/span>' : ''}\n      <\/div>\n      <p>${esc(f.description)}<\/p>\n      <div class=\"fn-body\"><div class=\"grid2\">\n        ${Object.entries(f.params).map(([k,p]) => `\n          <div style=\"${p.type==='text'?'grid-column:1/-1':''}\">\n            <label>${esc(p.label)}<\/label>\n            ${p.type==='enum'\n              ? `<select id=\"p-${f.id}-${k}\">${p.options.map((o)=>`<option ${o===p.default?'selected':''}>${o}<\/option>`).join('')}<\/select>`\n              : p.type==='text'\n              ? `<textarea id=\"p-${f.id}-${k}\" placeholder=\"0xabc…,1000&#10;0xdef…,2500\"><\/textarea>`\n              : p.type==='bool'\n              ? `<select id=\"p-${f.id}-${k}\"><option value=\"true\">yes<\/option><option value=\"false\">no<\/option><\/select>`\n              : `<input id=\"p-${f.id}-${k}\" value=\"${esc(p.default)}\">`}\n          <\/div>`).join('')}\n      <\/div><\/div>\n    <\/div>`).join('');\n}\nwindow.toggleFn = (id) => $('fn-'+id).classList.toggle('open');\n\nwindow.reaccept = async () => {\n  try {\n    await api('POST', '/api/terms/accept');\n    ME_TERMS = true;\n    renderBanners();\n  } catch (e) { alert(e.message || 'could not record your acceptance'); }\n};\n\nfunction renderBanners() {\n  const parts = [];\n  if (ME && !ME_TERMS) {\n    parts.push(`<div class=\"banner\" style=\"background:#181410;border-color:#5c4423;color:#edd0a5\">\n      <strong>The terms of use changed.<\/strong> Please\n      <a href=\"/terms\" target=\"_blank\" rel=\"noopener\">read them<\/a> and accept again —\n      sending transactions is on hold until you do. Reading your agents, simulating and\n      withdrawing are not affected.\n      <button class=\"ghost sm\" style=\"margin-left:8px\" onclick=\"reaccept()\">I accept the updated terms<\/button><\/div>`);\n  }\n  if (CONFIG.maintenance?.on) {\n    parts.push(`<div class=\"banner\" style=\"background:#180f10;border-color:#5c2326;color:#eda9a5\">\n      <strong>Paused for maintenance.<\/strong> ${esc(CONFIG.maintenance.reason || 'Creating agents and running executions are on hold.')}\n      Reading your agents and exporting keystores still works.<\/div>`);\n  }\n  // O banner permanente da taxa saiu daqui de proposito. A cobranca continua\n  // declarada nos dois lugares que importam na hora de gastar: nos termos, que\n  // a pessoa precisa aceitar, e na linha \"service fee\" de cada decisao, ao lado\n  // do notional, antes de qualquer aprovacao. Ver feeRow() mais acima.\n  if (CONFIG.beta) {\n    parts.push(`<div class=\"banner\">\n      <strong>Early access.<\/strong> On-chain execution is new here and has seen little\n      real-world use. ${CONFIG.liveExecution\n        ? `Do not deposit more than you are willing to lose — around ${esc(CONFIG.depositAdviceEth)} ETH is a sensible ceiling while this is being proven.`\n        : 'Sending transactions is currently switched off on this server: the agent will analyse and propose, but nothing moves on chain.'}\n      <\/div>`);\n  }\n  $('betaBanner').innerHTML = parts.join('');\n\n  // Sem envio real ligado no servidor o botão principal viraria promessa vazia:\n  // o pedido voltaria como ensaio e a pessoa acharia que enviou. Aqui ele\n  // assume o texto do que de fato acontece.\n  if (!CONFIG.liveExecution) {\n    $('runBtn').textContent = 'Run agent (nothing is sent)';\n    $('dryBtn').style.display = 'none';\n  }\n  renderRunState();\n}\n\n/** Grava o que está nos campos antes de rodar, senão o agente usa o salvo. */\nasync function salvarFuncoes() {\n  for (const f of CONFIG.functions) {\n    const params = {};\n    for (const k of Object.keys(f.params)) {\n      const el = $(`p-${f.id}-${k}`);\n      if (el) params[k] = el.value;\n    }\n    await api('POST', `/api/agents/${AGENT.id}/functions`,\n      { functionId: f.id, enabled: $('on-'+f.id).checked, params });\n  }\n}\n\n// ------------------------------------------------------ iniciar o agente\n//\n// Um botão só: roda o agente, aprova o que a política liberou e envia.\n//\n// A senha é pedida UMA VEZ por aba. Ela não é uma trava de formulário — é o que\n// decifra a chave privada, então sem ela não existe assinatura. Depois do\n// primeiro start fica no sessionStorage desta aba e some quando a aba fecha. O\n// servidor continua sem guardá-la: recebe, usa e esquece a cada pedido.\n//\n// O que este botão NÃO pula: decisão com qualquer violação fica de fora, a\n// política de risco e os limites do protocolo seguem valendo no servidor, e\n// cada transação continua passando por eth_call antes de ser assinada. Aqui se\n// pula a revisão humana, não as verificações.\n\nconst chaveSenha = (id) => 'pons_pw_' + id;\nconst senhaDaAba = (id) => { try { return sessionStorage.getItem(chaveSenha(id)); } catch { return null; } };\n\n/** Só guarda depois que o servidor aceitou — senha errada nunca fica salva. */\nfunction guardarSenha(senha) {\n  try { sessionStorage.setItem(chaveSenha(AGENT.id), senha); } catch { /* modo privado */ }\n  $('livePw').value = '';\n  renderRunState();\n}\n\nwindow.forgetPassword = () => {\n  try { sessionStorage.removeItem(chaveSenha(AGENT.id)); } catch { /* modo privado */ }\n  renderRunState();\n};\n\n/** Campo de senha ou linha de estado, conforme esta aba já conheça o agente. */\nfunction renderRunState() {\n  if (!AGENT) { $('askPw').style.display = 'none'; $('agentState').style.display = 'none'; return; }\n  const destravado = !!senhaDaAba(AGENT.id);\n  $('askPw').style.display = (destravado || !CONFIG.liveExecution) ? 'none' : 'block';\n  $('agentState').style.display = destravado ? 'flex' : 'none';\n  if (destravado) {\n    $('stateText').textContent =\n      'Unlocked for this tab · ' + AGENT.address.slice(0, 10) + '…' + AGENT.address.slice(-4);\n  }\n}\n\nwindow.startAgent = async (live = true) => {\n  const b = live ? $('runBtn') : $('dryBtn');\n  const rotulo = b.textContent;\n\n  // O preview não envia nada, então não precisa de senha nenhuma.\n  let senha = null;\n  if (live) {\n    senha = senhaDaAba(AGENT.id) || $('livePw').value;\n    if (!senha) { $('livePw').focus(); return alert('enter the agent keystore password once to start it'); }\n  }\n\n  b.disabled = true; b.textContent = live ? 'starting…' : 'reading…';\n  try {\n    await salvarFuncoes();\n    const out = await api('POST', `/api/agents/${AGENT.id}/run`, { persist: true });\n    renderResult(out);\n    if (!live) return;\n\n    const aprovaveis = (out.results || [])\n      .flatMap((r) => r.decisions || [])\n      .filter((d) => d.id && d.verdict && d.verdict.violations.length === 0);\n\n    if (!aprovaveis.length) {\n      $('result').insertAdjacentHTML('afterbegin',\n        '<div class=\"note\">Nothing to send: no decision passed your policy this round.<\/div>');\n      return;\n    }\n\n    // Soma o que sai da carteira: o que entra no mercado mais a taxa.\n    const totalWei = aprovaveis.reduce((s, d) =>\n      s + BigInt(d.decision.notionalWei || 0) + BigInt(d.decision.feeWei || 0), 0n);\n    if (!confirm(`Send ${aprovaveis.length} decision(s) for real now, spending up to `\n      + `${eth(totalWei.toString())} ETH from the agent wallet? This cannot be undone.`)) return;\n\n    for (const d of aprovaveis) {\n      const alvo = $('exec-' + d.id);\n      if (alvo) alvo.insertAdjacentHTML('beforeend', `<div class=\"note\" id=\"run-${d.id}\">sending…<\/div>`);\n      try {\n        if (d.verdict.needsApproval) await api('POST', `/api/decisions/${d.id}/approve`);\n        const r = await api('POST', `/api/decisions/${d.id}/execute`, { password: senha, live: true });\n        guardarSenha(senha);\n        if ($('run-' + d.id)) {\n          $('run-' + d.id).outerHTML = `<div class=\"note ok\">Executed ${r.steps.length} step(s)<\/div>` +\n            r.steps.map((s) => `<div class=\"note${s.failed ? ' bad' : ''}\">${esc(s.label)}${\n              s.failed ? ' — did not go through: ' + esc(s.failed)\n              : s.skipped ? ' — ' + esc(s.skipped)\n              : s.hash ? ' — <span class=\"mono\">' + esc(s.hash.slice(0, 18)) + '…<\/span>' : ''}<\/div>`).join('');\n        }\n      } catch (e) {\n        // Uma decisão que falha não interrompe as outras: são independentes, e\n        // parar aqui deixaria metade do plano sem explicação na tela.\n        if ($('run-' + d.id)) $('run-' + d.id).outerHTML = `<div class=\"note bad\">${esc(e.message)}<\/div>`;\n      }\n    }\n  } catch (e) {\n    $('result').innerHTML = `<div class=\"note bad\">${esc(e.message)}<\/div>`;\n  }\n  b.disabled = false; b.textContent = rotulo;\n};\n\n$('runBtn').onclick = () => startAgent(true);\n\n\n// Taxa de serviço na tela da decisão. Na coleta de rewards o número é\n// estimativa — dizer isso evita a reclamação de quando não bater.\nfunction feeRow(dec) {\n  if (!dec.feeBps) return '';\n  const pct = dec.feeBps / 100;\n  if (dec.feeWei && BigInt(dec.feeWei) > 0n) {\n    return `<div class=\"kv\"><span>service fee (${pct}%)<\/span><span>${eth(dec.feeWei)} ETH<\/span><\/div>`;\n  }\n  if (dec.feeEstimateWei) {\n    return `<div class=\"kv\"><span>service fee (${pct}%)<\/span><span>~${eth(dec.feeEstimateWei)} ETH · estimated,\n      charged on what is actually collected<\/span><\/div>`;\n  }\n  return `<div class=\"kv\"><span>service fee<\/span><span>${pct}% of what this collects<\/span><\/div>`;\n}\n\nfunction renderResult(out) {\n  const s = out.state;\n  const supply = s.supply ? `\n    <div class=\"kv\"><span>circulating supply<\/span><span>${eth(s.supply.circulating)}<\/span><\/div>\n    <div class=\"kv\"><span>already burned<\/span><span>${eth(s.supply.burned)}<\/span><\/div>` : '';\n  const head = `\n    <div class=\"kv\"><span>token<\/span><span class=\"mono\">${esc(s.symbol || out.token)}<\/span><\/div>\n    <div class=\"kv\"><span>price<\/span><span>${eth(s.pricePair)} ETH<\/span><\/div>\n    <div class=\"kv\"><span>graduated<\/span><span>${s.graduated ? 'yes' : 'no'}<\/span><\/div>\n    <div class=\"kv\"><span>agent balance<\/span><span>${eth(s.balances.eth)} ETH<\/span><\/div>\n    ${supply}<div style=\"height:16px\"><\/div>`;\n\n  const blocks = out.results.map((r) => {\n    if (r.error) return `<div class=\"note bad\"><strong>${esc(r.functionId)}<\/strong> — ${esc(r.error)}<\/div>`;\n    const notes = (r.notes||[]).map((n)=>`<div class=\"note\">${esc(n)}<\/div>`).join('');\n    const decs = (r.decisions||[]).map((d) => {\n      const v = d.verdict;\n      const tag = v.violations.length ? 'bad' : (v.needsApproval ? 'warn' : 'ok');\n      const txt = v.violations.length ? 'blocked' : (v.needsApproval ? 'awaiting approval' : 'approved');\n      return `<div class=\"dec\">\n        <div class=\"dec-head\"><strong>${esc(d.decision.kind)}<\/strong><span class=\"tag ${tag}\">${txt}<\/span><\/div>\n        <p style=\"margin-top:6px;font-size:12px;color:var(--dim)\">${esc(d.decision.rationale)}<\/p>\n        <div class=\"kv\" style=\"margin-top:8px\"><span>notional<\/span><span>${eth(d.decision.notionalWei)} ETH<\/span><\/div>\n        <div class=\"kv\"><span>impact<\/span><span>${(d.decision.priceImpactBps/100).toFixed(2)}%<\/span><\/div>\n        ${feeRow(d.decision)}\n        ${v.violations.map((x)=>`<div class=\"note bad\">${esc(x)}<\/div>`).join('')}\n        ${!v.violations.length && v.needsApproval\n          ? `<button class=\"ghost sm\" style=\"margin-top:10px\" onclick=\"approve(${d.id})\">Approve<\/button>` : ''}\n        ${!v.violations.length ? `<div id=\"exec-${d.id}\"><\/div>` : ''}\n      <\/div>`;\n    }).join('');\n    return `<div style=\"margin-bottom:20px\">\n      <div style=\"font-weight:600;margin-bottom:8px\">${esc(r.label || r.functionId)}<\/div>\n      ${notes}${decs || '<div class=\"note\">no action proposed this round<\/div>'}\n    <\/div>`;\n  }).join('');\n\n  $('result').innerHTML = head + (blocks || '<div class=\"empty\">no functions enabled<\/div>');\n}\n\nwindow.approve = async (id) => {\n  await api('POST', `/api/decisions/${id}/approve`);\n  const slot = $('exec-' + id);\n  slot.innerHTML = `\n    <div class=\"note ok\" style=\"margin-top:10px\">Approved and recorded.<\/div>\n    <label>Keystore password (used only to sign, never stored)<\/label>\n    <input type=\"password\" id=\"pw-${id}\" placeholder=\"agent password\">\n    <button class=\"ghost sm\" style=\"margin-top:8px\" onclick=\"execute(${id}, false)\">Simulate<\/button>\n    ${CONFIG.liveExecution\n      ? `<button class=\"sm\" style=\"margin-top:8px;margin-left:6px\" onclick=\"execute(${id}, true)\">Send for real<\/button>`\n      : `<div class=\"note warn\">Live sending is off on this server. Start it with\n           <code>PONS_ALLOW_LIVE_EXECUTION=1<\/code> once you have tested on testnet.<\/div>`}`;\n};\n\nwindow.execute = async (id, live) => {\n  const pw = $('pw-' + id)?.value;\n  if (!pw) return alert('enter the agent keystore password');\n  if (live && !confirm('This will send real transactions on chain. Continue?')) return;\n\n  const slot = $('exec-' + id);\n  slot.insertAdjacentHTML('beforeend', `<div class=\"note\" id=\"run-${id}\">running…<\/div>`);\n  try {\n    const out = await api('POST', `/api/decisions/${id}/execute`, { password: pw, live });\n    $('pw-' + id).value = '';\n    $('run-' + id).outerHTML = `<div class=\"note ${out.dryRun ? '' : 'ok'}\">\n      ${out.dryRun ? 'Simulated' : 'Executed'} ${out.steps.length} step(s)<\/div>` +\n      out.steps.map((s) => `<div class=\"note${s.failed ? ' bad' : ''}\">${esc(s.label)}${\n        s.failed ? ' — did not go through: ' + esc(s.failed)\n        : s.skipped ? ' — ' + esc(s.skipped)\n        : s.notSimulated ? ' — not simulated: ' + esc(s.reason || '')\n        : s.hash ? ' — <span class=\"mono\">' + esc(s.hash.slice(0, 18)) + '…<\/span>'\n        : s.gasLimit ? ' — gas ' + esc(s.gasLimit) : ''}<\/div>`).join('');\n  } catch (e) {\n    $('run-' + id).outerHTML = `<div class=\"note bad\">${esc(e.message)}<\/div>`;\n  }\n};\n\n// ---------------------------------------------------------------- delegação\n\n$('delegBtn').onclick = async () => {\n  if (!AGENT) return alert('pick an agent first');\n  try {\n    const d = await api('POST', `/api/agents/${AGENT.id}/delegation`, { token: $('token').value.trim() || undefined });\n    const st = d.status || {};\n    // Cada transação já vem simulada pelo servidor com o endereço conectado.\n    // Só aparece botão de assinar no que de fato passa: oferecer um botão que\n    // sempre reverte é convidar a pessoa a queimar gás para descobrir sozinha.\n    const ti = d.tokenInfo || {};\n    // O endereço inspecionado aparece SEMPRE. Sem ele, \"token not found\" deixa\n    // no ar a pergunta mais básica: procurado onde, exatamente?\n    const tokenBlock = `\n      <div class=\"kv\"><span>token checked<\/span><span class=\"mono\">${esc((d.token||'—').slice(0,14))}…<\/span><\/div>\n      ${ti.erc20 ? `<div class=\"kv\"><span>token name<\/span><span>${esc(ti.erc20.symbol || '')} ${esc(ti.erc20.name || '')}<\/span><\/div>` : ''}\n      <div class=\"kv\"><span>launched through pons<\/span><span>${\n        ti.isPonsToken === true ? 'yes ✓' : ti.checked === false ? 'could not check' : 'no'\n      }<\/span><\/div>\n      ${ti.verdict ? `<div class=\"note ${ti.checked === false ? 'warn' : 'bad'}\">${esc(ti.verdict)}<\/div>` : ''}`;\n\n    $('delegOut').innerHTML = tokenBlock + `\n      <div class=\"kv\"><span>current payout<\/span><span class=\"mono\">${esc((st.feeRecipient||'—').slice(0,14))}…<\/span><\/div>\n      <div class=\"kv\"><span>points to agent<\/span><span>${st.redirectedToAgent?'yes ✓':'no'}<\/span><\/div>\n      ${d.deployer ? `<div class=\"kv\"><span>token launched by<\/span><span class=\"mono\">${esc(d.deployer.slice(0,14))}…<\/span><\/div>` : ''}\n      ${d.transactions.map((t,i)=>{\n        const sim = t.simulation || {};\n        const cls = sim.ok ? 'note ok' : sim.unknown ? 'note warn' : 'note bad';\n        const verdict = sim.ok\n          ? '<span class=\"tag ok\">simulated: will succeed<\/span>'\n          : sim.unknown\n            ? '<span class=\"tag warn\">could not check right now<\/span>'\n            : `<span class=\"tag bad\">will fail${sim.error ? ' · ' + esc(sim.error) : ''}<\/span>`;\n        // Só o caso comprovadamente ruim ganha o botão de \"assinar mesmo assim\".\n        // Quando a checagem não completou, o botão normal continua — a carteira\n        // faz a própria simulação antes de você confirmar.\n        const btn = sim.ok || sim.unknown\n          ? `<button class=\"ghost sm\" style=\"margin-top:8px\" onclick=\"sendTx(${i})\">Sign in wallet<\/button>`\n          : `<button class=\"ghost sm\" style=\"margin-top:8px\" onclick=\"sendTx(${i}, true)\">Sign anyway<\/button>`;\n        return `\n        <div class=\"${cls}\"><strong>${esc(t.label)}<\/strong> ${verdict}<br>\n          <span class=\"mono\">${esc(t.signature)}<\/span><br>\n          <span style=\"opacity:.8\">${esc(sim.ok ? t.note : (sim.reason || t.note))}<\/span>\n          <br>${btn}\n        <\/div>`;\n      }).join('')}`;\n    window.__txs = d.transactions;\n  } catch (e) { $('delegOut').innerHTML = `<div class=\"note bad\">${esc(e.message)}<\/div>`; }\n};\n\n// ---------------------------------------------------- rede da carteira\n//\n// A carteira não conhece a Robinhood Chain por padrão, e `personal_sign` não\n// se importa com rede nenhuma — então dá para fazer login inteiro conectado na\n// Ethereum e só descobrir o problema na hora de assinar a transação, que é\n// quando a MetaMask abre na rede errada. Aqui a rede é trocada (ou adicionada)\n// ANTES de qualquer eth_sendTransaction, e o estado fica visível o tempo todo.\n\nconst CHAIN_ID_HEX = () => CONFIG.chain.idHex || ('0x' + CONFIG.chain.id.toString(16));\n\nasync function walletChainId() {\n  if (!window.ethereum) return null;\n  try { return await window.ethereum.request({ method: 'eth_chainId' }); }\n  catch { return null; }\n}\n\nconst sameChain = (hex) =>\n  typeof hex === 'string' && parseInt(hex, 16) === CONFIG.chain.id;\n\n/** Garante que a carteira está na rede certa. Devolve true se está. */\nasync function ensureChain({ silent = false } = {}) {\n  if (!window.ethereum) return false;\n  if (sameChain(await walletChainId())) { renderWalletChain(); return true; }\n\n  try {\n    await window.ethereum.request({\n      method: 'wallet_switchEthereumChain',\n      params: [{ chainId: CHAIN_ID_HEX() }],\n    });\n  } catch (err) {\n    // 4902 = rede desconhecida pela carteira. Alguns provedores devolvem o\n    // código aninhado em err.data, e a MetaMask às vezes manda -32603 com a\n    // mesma causa; por isso a checagem é larga em vez de igual a 4902.\n    const code = err?.code ?? err?.data?.originalError?.code;\n    const unknown = code === 4902 || code === -32603 || /unrecognized|not added|add.*chain/i.test(err?.message || '');\n    if (!unknown) {\n      if (!silent) alert(err?.message || 'network switch rejected');\n      renderWalletChain();\n      return false;\n    }\n    try {\n      await window.ethereum.request({\n        method: 'wallet_addEthereumChain',\n        params: [{\n          chainId: CHAIN_ID_HEX(),\n          chainName: CONFIG.chain.name,\n          nativeCurrency: CONFIG.chain.nativeCurrency || { name: 'Ether', symbol: 'ETH', decimals: 18 },\n          rpcUrls: [CONFIG.chain.rpc],\n          blockExplorerUrls: CONFIG.chain.explorer ? [CONFIG.chain.explorer] : undefined,\n        }],\n      });\n    } catch (addErr) {\n      if (!silent) alert(addErr?.message || 'could not add the network');\n      renderWalletChain();\n      return false;\n    }\n  }\n\n  const ok = sameChain(await walletChainId());\n  renderWalletChain();\n  return ok;\n}\n\nasync function renderWalletChain() {\n  const chip = $('walletChain');\n  if (!chip) return;\n  if (!window.ethereum || !ME) { chip.style.display = 'none'; return; }\n  chip.style.display = 'inline-block';\n  const hex = await walletChainId();\n  if (sameChain(hex)) {\n    chip.className = 'chip ok';\n    chip.textContent = 'wallet on ' + CONFIG.chain.name;\n    chip.onclick = null;\n    chip.style.cursor = 'default';\n    chip.title = '';\n  } else {\n    chip.className = 'chip bad';\n    chip.textContent = 'wallet on wrong network — click to switch';\n    chip.style.cursor = 'pointer';\n    chip.title = 'Your wallet is on chain ' + (hex ? parseInt(hex, 16) : '?') +\n      '. Transactions must be signed on ' + CONFIG.chain.name + ' (chain ' + CONFIG.chain.id + ').';\n    chip.onclick = () => ensureChain();\n  }\n}\n\nif (window.ethereum?.on) {\n  window.ethereum.on('chainChanged', () => renderWalletChain());\n  window.ethereum.on('accountsChanged', () => location.reload());\n}\n\nwindow.sendTx = async (i, knownToFail = false) => {\n  const tx = window.__txs[i];\n  if (!window.ethereum) return alert('no wallet in this browser');\n  if (knownToFail && !confirm(\n    (tx.simulation?.reason || 'This call reverts when simulated.') +\n    '\\n\\nSigning it will still cost gas and will almost certainly fail. Continue anyway?'\n  )) return;\n  // A troca de rede vem primeiro. Sem isto a MetaMask abre na rede em que o\n  // usuário estiver, e a transação ou falha ou vai parar na chain errada.\n  if (!await ensureChain()) {\n    return alert('Switch your wallet to ' + CONFIG.chain.name + ' (chain ' +\n      CONFIG.chain.id + ') before signing. Nothing was sent.');\n  }\n  try {\n    const hash = await window.ethereum.request({\n      method: 'eth_sendTransaction',\n      params: [{ from: ME, to: tx.to, data: tx.data, chainId: CHAIN_ID_HEX() }],\n    });\n    alert('transaction sent: ' + hash);\n  } catch (e) { alert(e.message || 'transaction rejected'); }\n};\n\nboot().catch((e) => {\n  $('chainChip').className = 'chip bad';\n  $('chainChip').textContent = e.message;\n});\n<\/script>\n<\/body>\n<\/html>\n" };
const f = document.getElementById('f');
document.querySelectorAll('.tab').forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll('.tab').forEach((x) => x.classList.remove('on'));
    b.classList.add('on');
    f.srcdoc = PAGES[b.dataset.v];
  };
});
f.srcdoc = PAGES.app;
</script>
</body></html>
