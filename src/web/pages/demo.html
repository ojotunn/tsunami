px\">\n      <div style=\"font-weight:600;margin-bottom:8px\">${esc(r.label || r.functionId)}<\/div>\n      ${notes}${decs || '<div class=\"note\">no action proposed this round<\/div>'}\n    <\/div>`;\n  }).join('');\n\n  $('result').innerHTML = head + (blocks || '<div class=\"empty\">no functions enabled<\/div>');\n}\n\nwindow.approve = async (id) => {\n  await api('POST', `/api/decisions/${id}/approve`);\n  const slot = $('exec-' + id);\n  slot.innerHTML = `\n    <div class=\"note ok\" style=\"margin-top:10px\">Approved and recorded.<\/div>\n    <label>Keystore password (used only to sign, never stored)<\/label>\n    <input type=\"password\" id=\"pw-${id}\" placeholder=\"agent password\">\n    <button class=\"ghost sm\" style=\"margin-top:8px\" onclick=\"execute(${id}, false)\">Simulate<\/button>\n    ${CONFIG.liveExecution\n      ? `<button class=\"sm\" style=\"margin-top:8px;margin-left:6px\" onclick=\"execute(${id}, true)\">Send for real<\/button>`\n      : `<div class=\"note warn\">Live sending is off on this server. Start it with\n           <code>PONS_ALLOW_LIVE_EXECUTION=1<\/code> once you have tested on testnet.<\/div>`}`;\n};\n\nwindow.execute = async (id, live) => {\n  const pw = $('pw-' + id)?.value;\n  if (!pw) return alert('enter the agent keystore password');\n  if (live && !confirm('This will send real transactions on chain. Continue?')) return;\n\n  const slot = $('exec-' + id);\n  slot.insertAdjacentHTML('beforeend', `<div class=\"note\" id=\"run-${id}\">running…<\/div>`);\n  try {\n    const out = await api('POST', `/api/decisions/${id}/execute`, { password: pw, live });\n    $('pw-' + id).value = '';\n    $('run-' + id).outerHTML = `<div class=\"note ${out.dryRun ? '' : 'ok'}\">\n      ${out.dryRun ? 'Simulated' : 'Executed'} ${out.steps.length} step(s)<\/div>` +\n      out.steps.map((s) => `<div class=\"note\">${esc(s.label)}${\n        s.skipped ? ' — ' + esc(s.skipped)\n        : s.notSimulated ? ' — not simulated: ' + esc(s.reason || '')\n        : s.hash ? ' — <span class=\"mono\">' + esc(s.hash.slice(0, 18)) + '…<\/span>'\n        : s.gasLimit ? ' — gas ' + esc(s.gasLimit) : ''}<\/div>`).join('');\n  } catch (e) {\n    $('run-' + id).outerHTML = `<div class=\"note bad\">${esc(e.message)}<\/div>`;\n  }\n};\n\n// ---------------------------------------------------------------- delegação\n\n$('delegBtn').onclick = async () => {\n  if (!AGENT) return alert('pick an agent first');\n  try {\n    const d = await api('POST', `/api/agents/${AGENT.id}/delegation`, { token: $('token').value.trim() || undefined });\n    const st = d.status || {};\n    // Cada transação já vem simulada pelo servidor com o endereço conectado.\n    // Só aparece botão de assinar no que de fato passa: oferecer um botão que\n    // sempre reverte é convidar a pessoa a queimar gás para descobrir sozinha.\n    const ti = d.tokenInfo || {};\n    // O endereço inspecionado aparece SEMPRE. Sem ele, \"token not found\" deixa\n    // no ar a pergunta mais básica: procurado onde, exatamente?\n    const tokenBlock = `\n      <div class=\"kv\"><span>token checked<\/span><span class=\"mono\">${esc((d.token||'—').slice(0,14))}…<\/span><\/div>\n      ${ti.erc20 ? `<div class=\"kv\"><span>token name<\/span><span>${esc(ti.erc20.symbol || '')} ${esc(ti.erc20.name || '')}<\/span><\/div>` : ''}\n      <div class=\"kv\"><span>launched through pons<\/span><span>${\n        ti.isPonsToken === true ? 'yes ✓' : ti.checked === false ? 'could not check' : 'no'\n      }<\/span><\/div>\n      ${ti.verdict ? `<div class=\"note ${ti.checked === false ? 'warn' : 'bad'}\">${esc(ti.verdict)}<\/div>` : ''}`;\n\n    $('delegOut').innerHTML = tokenBlock + `\n      <div class=\"kv\"><span>current payout<\/span><span class=\"mono\">${esc((st.feeRecipient||'—').slice(0,14))}…<\/span><\/div>\n      <div class=\"kv\"><span>points to agent<\/span><span>${st.redirectedToAgent?'yes ✓':'no'}<\/span><\/div>\n      ${d.deployer ? `<div class=\"kv\"><span>token launched by<\/span><span class=\"mono\">${esc(d.deployer.slice(0,14))}…<\/span><\/div>` : ''}\n      ${d.transactions.map((t,i)=>{\n        const sim = t.simulation || {};\n        const cls = sim.ok ? 'note ok' : sim.unknown ? 'note warn' : 'note bad';\n        const verdict = sim.ok\n          ? '<span class=\"tag ok\">simulated: will succeed<\/span>'\n          : sim.unknown\n            ? '<span class=\"tag warn\">could not check right now<\/span>'\n            : `<span class=\"tag bad\">will fail${sim.error ? ' · ' + esc(sim.error) : ''}<\/span>`;\n        // Só o caso comprovadamente ruim ganha o botão de \"assinar mesmo assim\".\n        // Quando a checagem não completou, o botão normal continua — a carteira\n        // faz a própria simulação antes de você confirmar.\n        const btn = sim.ok || sim.unknown\n          ? `<button class=\"ghost sm\" style=\"margin-top:8px\" onclick=\"sendTx(${i})\">Sign in wallet<\/button>`\n          : `<button class=\"ghost sm\" style=\"margin-top:8px\" onclick=\"sendTx(${i}, true)\">Sign anyway<\/button>`;\n        return `\n        <div class=\"${cls}\"><strong>${esc(t.label)}<\/strong> ${verdict}<br>\n          <span class=\"mono\">${esc(t.signature)}<\/span><br>\n          <span style=\"opacity:.8\">${esc(sim.ok ? t.note : (sim.reason || t.note))}<\/span>\n          <br>${btn}\n        <\/div>`;\n      }).join('')}`;\n    window.__txs = d.transactions;\n  } catch (e) { $('delegOut').innerHTML = `<div class=\"note bad\">${esc(e.message)}<\/div>`; }\n};\n\n// ---------------------------------------------------- rede da carteira\n//\n// A carteira não conhece a Robinhood Chain por padrão, e `personal_sign` não\n// se importa com rede nenhuma — então dá para fazer login inteiro conectado na\n// Ethereum e só descobrir o problema na hora de assinar a transação, que é\n// quando a MetaMask abre na rede errada. Aqui a rede é trocada (ou adicionada)\n// ANTES de qualquer eth_sendTransaction, e o estado fica visível o tempo todo.\n\nconst CHAIN_ID_HEX = () => CONFIG.chain.idHex || ('0x' + CONFIG.chain.id.toString(16));\n\nasync function walletChainId() {\n  if (!window.ethereum) return null;\n  try { return await window.ethereum.request({ method: 'eth_chainId' }); }\n  catch { return null; }\n}\n\nconst sameChain = (hex) =>\n  typeof hex === 'string' && parseInt(hex, 16) === CONFIG.chain.id;\n\n/** Garante que a carteira está na rede certa. Devolve true se está. */\nasync function ensureChain({ silent = false } = {}) {\n  if (!window.ethereum) return false;\n  if (sameChain(await walletChainId())) { renderWalletChain(); return true; }\n\n  try {\n    await window.ethereum.request({\n      method: 'wallet_switchEthereumChain',\n      params: [{ chainId: CHAIN_ID_HEX() }],\n    });\n  } catch (err) {\n    // 4902 = rede desconhecida pela carteira. Alguns provedores devolvem o\n    // código aninhado em err.data, e a MetaMask às vezes manda -32603 com a\n    // mesma causa; por isso a checagem é larga em vez de igual a 4902.\n    const code = err?.code ?? err?.data?.originalError?.code;\n    const unknown = code === 4902 || code === -32603 || /unrecognized|not added|add.*chain/i.test(err?.message || '');\n    if (!unknown) {\n      if (!silent) alert(err?.message || 'network switch rejected');\n      renderWalletChain();\n      return false;\n    }\n    try {\n      await window.ethereum.request({\n        method: 'wallet_addEthereumChain',\n        params: [{\n          chainId: CHAIN_ID_HEX(),\n          chainName: CONFIG.chain.name,\n          nativeCurrency: CONFIG.chain.nativeCurrency || { name: 'Ether', symbol: 'ETH', decimals: 18 },\n          rpcUrls: [CONFIG.chain.rpc],\n          blockExplorerUrls: CONFIG.chain.explorer ? [CONFIG.chain.explorer] : undefined,\n        }],\n      });\n    } catch (addErr) {\n      if (!silent) alert(addErr?.message || 'could not add the network');\n      renderWalletChain();\n      return false;\n    }\n  }\n\n  const ok = sameChain(await walletChainId());\n  renderWalletChain();\n  return ok;\n}\n\nasync function renderWalletChain() {\n  const chip = $('walletChain');\n  if (!chip) return;\n  if (!window.ethereum || !ME) { chip.style.display = 'none'; return; }\n  chip.style.display = 'inline-block';\n  const hex = await walletChainId();\n  if (sameChain(hex)) {\n    chip.className = 'chip ok';\n    chip.textContent = 'wallet on ' + CONFIG.chain.name;\n    chip.onclick = null;\n    chip.style.cursor = 'default';\n    chip.title = '';\n  } else {\n    chip.className = 'chip bad';\n    chip.textContent = 'wallet on wrong network — click to switch';\n    chip.style.cursor = 'pointer';\n    chip.title = 'Your wallet is on chain ' + (hex ? parseInt(hex, 16) : '?') +\n      '. Transactions must be signed on ' + CONFIG.chain.name + ' (chain ' + CONFIG.chain.id + ').';\n    chip.onclick = () => ensureChain();\n  }\n}\n\nif (window.ethereum?.on) {\n  window.ethereum.on('chainChanged', () => renderWalletChain());\n  window.ethereum.on('accountsChanged', () => location.reload());\n}\n\nwindow.sendTx = async (i, knownToFail = false) => {\n  const tx = window.__txs[i];\n  if (!window.ethereum) return alert('no wallet in this browser');\n  if (knownToFail && !confirm(\n    (tx.simulation?.reason || 'This call reverts when simulated.') +\n    '\\n\\nSigning it will still cost gas and will almost certainly fail. Continue anyway?'\n  )) return;\n  // A troca de rede vem primeiro. Sem isto a MetaMask abre na rede em que o\n  // usuário estiver, e a transação ou falha ou vai parar na chain errada.\n  if (!await ensureChain()) {\n    return alert('Switch your wallet to ' + CONFIG.chain.name + ' (chain ' +\n      CONFIG.chain.id + ') before signing. Nothing was sent.');\n  }\n  try {\n    const hash = await window.ethereum.request({\n      method: 'eth_sendTransaction',\n      params: [{ from: ME, to: tx.to, data: tx.data, chainId: CHAIN_ID_HEX() }],\n    });\n    alert('transaction sent: ' + hash);\n  } catch (e) { alert(e.message || 'transaction rejected'); }\n};\n\nboot().catch((e) => {\n  $('chainChip').className = 'chip bad';\n  $('chainChip').textContent = e.message;\n});\n<\/script>\n<\/body>\n<\/html>\n" };
const f = document.getElementById('f');
document.querySelectorAll('.tab').forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll('.tab').forEach((x) => x.classList.remove('on'));
    b.classList.add('on');
    f.srcdoc = PAGES[b.dataset.v];
  };
});
f.srcdoc = PAGES.app;
</script>
</body></html>
