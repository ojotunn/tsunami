const PAGES = { landing: "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>{{BRAND}} · agents for pons tokens<\/title>\n<meta name=\"description\" content=\"Agents that run buyback and burn, creator reward collection, scheduled buys, and airdrops for pons tokens on Robinhood Chain.\">\n<style>\n  :root{\n    --bg:#0b0e13; --panel:#141920; --panel-2:#1a212a; --line:#252d38;\n    --tx:#e8eef5; --dim:#8b98a8; --accent:#5aa2ff; --ok:#3fb950;\n    --warn:#e3b341; --bad:#f85149;\n  }\n  *{box-sizing:border-box;margin:0;padding:0}\n  body{background:var(--bg);color:var(--tx);\n       font:16px/1.65 ui-sans-serif,-apple-system,\"Segoe UI\",Roboto,sans-serif;\n       -webkit-font-smoothing:antialiased}\n  a{color:var(--accent);text-decoration:none}\n  .wrap{max-width:1060px;margin:0 auto;padding:0 24px}\n\n  nav{border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(11,14,19,.9);\n      backdrop-filter:blur(8px);z-index:10}\n  nav .wrap{display:flex;align-items:center;gap:20px;height:62px}\n  .logo{font-weight:700;letter-spacing:-.02em;font-size:17px}\n  .logo span{color:var(--accent)}\n  nav .sp{flex:1}\n  .btn{background:var(--accent);color:#04101f;border:0;border-radius:8px;padding:10px 18px;\n       font:inherit;font-size:14px;font-weight:600;cursor:pointer;display:inline-block}\n  .btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line);font-weight:500}\n\n  header{padding:88px 0 64px;border-bottom:1px solid var(--line)}\n  .badge{display:inline-block;font-size:12px;color:var(--dim);border:1px solid var(--line);\n         border-radius:999px;padding:5px 13px;margin-bottom:22px}\n  h1{font-size:clamp(32px,5.2vw,50px);line-height:1.1;letter-spacing:-.03em;\n     font-weight:700;max-width:17ch;margin-bottom:20px}\n  h1 em{font-style:normal;color:var(--accent)}\n  .lead{font-size:18px;color:var(--dim);max-width:60ch;margin-bottom:30px}\n  .cta{display:flex;gap:12px;flex-wrap:wrap;align-items:center}\n  .cta small{color:var(--dim);font-size:13px}\n\n  section{padding:66px 0;border-bottom:1px solid var(--line)}\n  h2{font-size:26px;letter-spacing:-.02em;margin-bottom:10px;font-weight:650}\n  .sub{color:var(--dim);margin-bottom:32px;max-width:62ch}\n\n  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}\n  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px}\n  .card h3{font-size:16px;margin-bottom:8px;font-weight:620}\n  .card p{color:var(--dim);font-size:14px}\n  .card .tag{display:inline-block;font-size:11px;color:var(--dim);background:var(--panel-2);\n             border:1px solid var(--line);border-radius:999px;padding:2px 9px;margin-top:12px}\n\n  .steps{counter-reset:s;display:grid;gap:14px}\n  .step{display:flex;gap:16px;background:var(--panel);border:1px solid var(--line);\n        border-radius:12px;padding:20px}\n  .step::before{counter-increment:s;content:counter(s);flex:0 0 30px;height:30px;\n    background:var(--panel-2);border:1px solid var(--line);border-radius:50%;\n    display:grid;place-items:center;font-size:13px;color:var(--accent);font-weight:600}\n  .step h3{font-size:15px;margin-bottom:4px}\n  .step p{color:var(--dim);font-size:14px}\n\n  .note{border-left:3px solid var(--warn);background:#1a1408;border-radius:0 10px 10px 0;\n        padding:18px 22px;color:#e8cd8f;font-size:15px}\n  .note strong{color:#f4dfa8}\n  .note code{background:rgba(0,0,0,.35);padding:1px 6px;border-radius:4px;font-size:13px}\n\n  .no{border-left:3px solid var(--bad);background:#180f10;border-radius:0 10px 10px 0;\n      padding:18px 22px;color:#eda9a5;font-size:15px}\n  .no strong{color:#f5c2bf}\n\n  table{width:100%;border-collapse:collapse;font-size:14px}\n  th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line)}\n  th{color:var(--dim);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.06em}\n  td code{font-size:12px;color:var(--dim)}\n\n  footer{padding:44px 0;color:var(--dim);font-size:13px}\n  footer p{max-width:70ch;margin-bottom:10px}\n<\/style>\n<\/head>\n<body>\n\n<nav><div class=\"wrap\">\n  <div class=\"logo\">{{BRAND_HTML}}<\/div>\n  <a href=\"#features\" style=\"color:var(--dim);font-size:14px\">features<\/a>\n  <a href=\"#security\" style=\"color:var(--dim);font-size:14px\">security<\/a>\n  <a href=\"/demo\" style=\"color:var(--dim);font-size:14px\">demo<\/a>\n  <div class=\"sp\"><\/div>\n  <a class=\"btn\" href=\"/app\">Open the app<\/a>\n<\/div><\/nav>\n\n<header><div class=\"wrap\">\n  <div class=\"badge\">Robinhood Chain · chain 4663 · Uniswap V3 pools at 1%<\/div>\n  <h1>Agents that look after your token <em>while you sleep<\/em><\/h1>\n  <p class=\"lead\">\n    Buyback and burn, automatic creator reward collection, scheduled buys, dip buying,\n    and airdrops — for tokens launched on pons. You pick what the agent does, you set\n    the limits, and every action is on the record.\n  <\/p>\n  <div class=\"cta\">\n    <a class=\"btn\" href=\"/app\">Create your agent<\/a>\n    <a class=\"btn ghost\" href=\"/demo\">Try the demo first<\/a>\n    <small>Sign in with your wallet. No password, no signup.<\/small>\n  <\/div>\n<\/div><\/header>\n\n<section id=\"features\"><div class=\"wrap\">\n  <h2>What the agent does<\/h2>\n  <p class=\"sub\">Turn on only what you need. Every function has its own settings and clears\n     two checks before it becomes an action: the protocol's own limits, and the risk policy you define.<\/p>\n  <div class=\"grid\">\n    <div class=\"card\">\n      <h3>Buyback &amp; burn<\/h3>\n      <p>Buys your token from the pool with the agent's balance and sends it to the burn\n         address.<\/p>\n      <span class=\"tag\">uses capital<\/span>\n    <\/div>\n    <div class=\"card\">\n      <h3>Creator rewards → burn<\/h3>\n      <p>Collects your creator rewards, holds them in reserve, and after graduation puts\n         the percentage you choose into buying and burning.<\/p>\n      <span class=\"tag\">keyless delegation<\/span>\n    <\/div>\n    <div class=\"card\">\n      <h3>Scheduled buys<\/h3>\n      <p>A fixed amount on the interval you choose, with a total budget and a per-order\n         impact limit. The panel shows what that cadence costs you in pool fees.<\/p>\n      <span class=\"tag\">uses capital<\/span>\n    <\/div>\n    <div class=\"card\">\n      <h3>Dip buying<\/h3>\n      <p>Buys when the price falls below its recent high by the percentage you choose.\n         Measured against the high, not the last price, so ordinary noise doesn't trigger a buy.<\/p>\n      <span class=\"tag\">uses capital<\/span>\n    <\/div>\n    <div class=\"card\">\n      <h3>Airdrop<\/h3>\n      <p>Batched distribution to your recipient list, validating addresses, duplicates,\n         and the protocol's per-wallet cap before anything is sent.<\/p>\n      <span class=\"tag\">your own list<\/span>\n    <\/div>\n    <div class=\"card\">\n      <h3>Dashboard and audit trail<\/h3>\n      <p>Price, liquidity, graduation status, circulating supply, and the full history of\n         every proposed decision — including the ones that got blocked.<\/p>\n      <span class=\"tag\">read only<\/span>\n    <\/div>\n  <\/div>\n<\/div><\/section>\n\n<section><div class=\"wrap\">\n  <h2>How it works<\/h2>\n  <p class=\"sub\">Four steps. None of them asks for your private key.<\/p>\n  <div class=\"steps\">\n    <div class=\"step\"><div>\n      <h3>Connect your wallet<\/h3>\n      <p>You sign a plain text message to prove the address is yours. Signing a message\n         moves no funds and authorizes no transaction.<\/p>\n    <\/div><\/div>\n    <div class=\"step\"><div>\n      <h3>Create the agent<\/h3>\n      <p>The system generates a brand new, dedicated wallet for it on Robinhood Chain.\n         You get the deposit address, and the key is encrypted with your password.<\/p>\n    <\/div><\/div>\n    <div class=\"step\"><div>\n      <h3>Delegate rewards, fund the capital<\/h3>\n      <p>One signature points your creator payout at the agent. For the functions that\n         buy, you deposit only what you're willing to put at risk.<\/p>\n    <\/div><\/div>\n    <div class=\"step\"><div>\n      <h3>Pick your functions and watch<\/h3>\n      <p>Every proposal shows the reasoning, the estimated impact, and the verdict from\n         both checks. On the default setting, nothing runs without your approval.<\/p>\n    <\/div><\/div>\n  <\/div>\n<\/div><\/section>\n\n<section id=\"security\"><div class=\"wrap\">\n  <h2>Two things we'd rather say up front<\/h2>\n  <p class=\"sub\">Better you hear it before you configure anything than after you've announced a number.<\/p>\n\n  <div class=\"note\" style=\"margin-bottom:16px\">\n    <strong>Burning does not reduce total supply.<\/strong> The pons token is an ERC-20\n    with no <code>burn()<\/code> function — nothing on chain can lower\n    <code>totalSupply()<\/code>. Sending to <code>0x…dEaD<\/code> genuinely removes coins\n    from circulation, but explorers that compute market cap from total supply will show\n    no change at all. The panel reports circulating supply separately so you can publish\n    the number that actually holds up.\n  <\/div>\n\n  <div class=\"no\">\n    <strong>We don't manufacture holders or volume.<\/strong> There is no function here\n    that spins up wallets and spreads tokens across them to inflate the holder count —\n    the airdrop module actively cancels a batch if it detects a recipient controlled by\n    the tool itself. Holder count is the number people check to judge whether a token's\n    distribution is healthy before they buy. Wallets you created didn't change hands,\n    they changed pockets. And wallets funded from a single source that never sell are a\n    pattern any on-chain analyst spots in minutes.\n  <\/div>\n<\/div><\/section>\n\n<section><div class=\"wrap\">\n  <h2>Where the keys live<\/h2>\n  <p class=\"sub\">The model is deliberately split: each kind of access has the smallest\n     blast radius we could give it.<\/p>\n  <table>\n    <tr><th>What<\/th><th>Who holds it<\/th><th>Worst case if leaked<\/th><\/tr>\n    <tr>\n      <td>Your main wallet<\/td>\n      <td>You, always<\/td>\n      <td>Nothing — the site never has access to it<\/td>\n    <\/tr>\n    <tr>\n      <td>Creator reward payout<\/td>\n      <td>Redirected via <code>setFeeRedirect<\/code><\/td>\n      <td>You revert it by signing again, any time<\/td>\n    <\/tr>\n    <tr>\n      <td>Operating capital<\/td>\n      <td>Agent wallet, encrypted keystore<\/td>\n      <td>Loss capped at what you deposited<\/td>\n    <\/tr>\n  <\/table>\n  <p style=\"margin-top:22px;color:var(--dim);font-size:14px\">\n    That's why there's no field to paste a private key. In that model a leak costs you\n    the entire wallet — tokens, NFTs, everything — instead of the operating deposit.\n  <\/p>\n<\/div><\/section>\n\n<footer><div class=\"wrap\">\n  <p><strong style=\"color:var(--tx)\">None of this is financial advice.<\/strong>\n     Fixed-supply tokens in a single pool are highly volatile. Buybacks and burns do not\n     guarantee price — pons's own documentation says as much. Providing liquidity can\n     lose more than the fees it earns.<\/p>\n  <p>Providing liquidity or running systematic buybacks may be a regulated activity\n     depending on your jurisdiction and volume. Worth talking to a lawyer before you\n     scale. If your token runs programmatic buybacks, disclosing that publicly is what\n     separates a transparent treasury from a manipulation complaint.<\/p>\n  <p style=\"margin-top:18px\">{{BRAND}} · open source, zero dependencies ·\n     <a href=\"/terms\">terms and risks<\/a> ·\n     <a href=\"https://docs.ponsfamily.com/docs\">pons docs<\/a><\/p>\n<\/div><\/footer>\n\n<\/body>\n<\/html>\n", app: "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>{{BRAND}} · app<\/title>\n<style>\n  :root{\n    --bg:#0b0e13; --panel:#141920; --panel-2:#1a212a; --line:#252d38;\n    --tx:#e8eef5; --dim:#8b98a8; --accent:#5aa2ff; --ok:#3fb950;\n    --warn:#e3b341; --bad:#f85149;\n  }\n  *{box-sizing:border-box;margin:0;padding:0}\n  body{background:var(--bg);color:var(--tx);\n       font:14px/1.6 ui-sans-serif,-apple-system,\"Segoe UI\",Roboto,sans-serif}\n  a{color:var(--accent);text-decoration:none}\n  nav{border-bottom:1px solid var(--line);height:60px;display:flex;align-items:center;\n      gap:14px;padding:0 26px;position:sticky;top:0;background:rgba(11,14,19,.94);\n      backdrop-filter:blur(8px);z-index:20}\n  .logo{font-weight:700;letter-spacing:-.02em;font-size:16px}\n  .logo span{color:var(--accent)}\n  .sp{flex:1}\n  .chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--panel-2);\n        color:var(--dim);border:1px solid var(--line)}\n  .chip.ok{color:var(--ok);border-color:#1f4529}\n  .chip.bad{color:var(--bad);border-color:#5c2326}\n  button{background:var(--accent);color:#04101f;border:0;border-radius:8px;padding:9px 16px;\n         font:inherit;font-size:13px;font-weight:600;cursor:pointer}\n  button.ghost{background:transparent;color:var(--tx);border:1px solid var(--line);font-weight:500}\n  button.sm{padding:6px 12px;font-size:12px}\n  button:disabled{opacity:.4;cursor:not-allowed}\n\n  main{max-width:1220px;margin:0 auto;padding:26px 26px 90px;\n       display:grid;grid-template-columns:330px 1fr;gap:22px;align-items:start}\n  @media(max-width:940px){main{grid-template-columns:1fr}}\n  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;\n        padding:20px;margin-bottom:18px}\n  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);\n           margin-bottom:14px;font-weight:600}\n  label{display:block;font-size:12px;color:var(--dim);margin:12px 0 5px}\n  input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);\n    border-radius:7px;padding:9px 11px;font:inherit;font-size:13px}\n  textarea{min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:12px;resize:vertical}\n  .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}\n  .addr{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:11px;margin-top:10px}\n  .kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;\n      border-bottom:1px solid var(--line);font-size:13px}\n  .kv:last-child{border:0}\n  .kv span:first-child{color:var(--dim)}\n  .fn{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:11px;background:var(--panel-2)}\n  .fn-head{display:flex;align-items:center;gap:11px;cursor:pointer}\n  .fn-head strong{font-size:13px;flex:1}\n  .fn p{margin-top:6px;color:var(--dim);font-size:12px}\n  .fn-body{display:none;margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}\n  .fn.open .fn-body{display:block}\n  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}\n  .note{font-size:12px;color:var(--dim);padding:8px 11px;background:var(--panel-2);\n        border-left:2px solid var(--line);border-radius:0 6px 6px 0;margin:6px 0}\n  .note.warn{border-left-color:var(--warn);color:#e0c07a}\n  .note.bad{border-left-color:var(--bad);color:#f0a8a4}\n  .note.ok{border-left-color:var(--ok);color:#93d6a4}\n  .dec{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;background:var(--panel-2)}\n  .dec-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}\n  .tag{font-size:11px;padding:2px 9px;border-radius:999px;background:#20262e;color:var(--dim)}\n  .tag.ok{background:#12261a;color:var(--ok)} .tag.bad{background:#2b1618;color:var(--bad)}\n  .tag.warn{background:#2a2314;color:var(--warn)}\n  .empty{color:var(--dim);font-size:13px;padding:26px;text-align:center}\n  .banner{background:#1a1408;border:1px solid #3d2f10;color:#e0c07a;border-radius:12px;\n          padding:14px 17px;margin-bottom:18px;font-size:13px}\n  .banner code{background:rgba(0,0,0,.3);padding:1px 5px;border-radius:4px}\n  .gate{max-width:520px;margin:80px auto;text-align:center}\n  .gate h1{font-size:24px;letter-spacing:-.02em;margin-bottom:12px}\n  .gate p{color:var(--dim);margin-bottom:24px}\n<\/style>\n<script>\n(function () {\n  'use strict';\n\n  // ===== código real do projeto, embutido =====\n  // Matemática de preço e profundidade para pools Uniswap V3.\n// Convenção: sqrtPriceX96 = sqrt(token1/token0) * 2^96, em unidades brutas.\n\nconst Q96 = 2n ** 96n;\nconst Q192 = 2n ** 192n;\nconst SCALE = 10n ** 18n;                       // precisão fixa interna (18 casas)\n\nconst pow10 = (n) => 10n ** BigInt(n);\n\n/**\n * Preço de token1 em token0 (unidades humanas), com 18 casas de precisão.\n * @returns {bigint} preço * 1e18\n */\nfunction priceToken1PerToken0(sqrtPriceX96, decimals0, decimals1) {\n  const sp = BigInt(sqrtPriceX96);\n  return (sp * sp * SCALE * pow10(decimals0)) / (Q192 * pow10(decimals1));\n}\n\n/**\n * Preço do token do lançamento denominado no token do par (ex.: WETH).\n * @returns {bigint} preço * 1e18\n */\nfunction tokenPriceInPair({ sqrtPriceX96, isToken0, tokenDecimals, pairDecimals }) {\n  if (isToken0) return priceToken1PerToken0(sqrtPriceX96, tokenDecimals, pairDecimals);\n  const p = priceToken1PerToken0(sqrtPriceX96, pairDecimals, tokenDecimals);\n  if (p === 0n) return 0n;\n  return (SCALE * SCALE) / p;\n}\n\n/** Market cap em token do par, escalado por 1e18. */\nconst marketCapInPair = (priceScaled, totalSupply, tokenDecimals) =>\n  (priceScaled * BigInt(totalSupply)) / pow10(tokenDecimals);\n\n/** tick -> preço (float, só para exibição). */\nconst tickToPrice = (tick) => Math.pow(1.0001, Number(tick));\n/** preço -> tick mais próximo, alinhado ao tickSpacing. */\nfunction priceToTick(price, tickSpacing = 200) {\n  const raw = Math.log(price) / Math.log(1.0001);\n  return Math.round(raw / tickSpacing) * tickSpacing;\n}\n\n/** Direção do trade a partir de um evento Swap, conforme docs da Pons. */\nfunction swapSide({ amount0, amount1, isToken0 }) {\n  const pairSigned = isToken0 ? BigInt(amount1) : BigInt(amount0);\n  return pairSigned > 0n ? 'buy' : 'sell';   // par entrando no pool = compra do token\n}\n\n/** Valor absoluto do lado do par (quanto de WETH trocou de mãos). */\nconst swapPairVolume = ({ amount0, amount1, isToken0 }) => {\n  const v = isToken0 ? BigInt(amount1) : BigInt(amount0);\n  return v < 0n ? -v : v;\n};\n\n// ------------------------------------------------------- profundidade\n\n/**\n * Simula um swap assumindo liquidez L constante na faixa ativa.\n * Válido para as posições full-range criadas pela Pons; degrada se o preço\n * atravessar limites de faixa — por isso `crossedRangeRisk` é sinalizado.\n *\n * @param {'buy'|'sell'} side  buy = entra token do par, sai token do lançamento\n * @returns {{amountOut: bigint, sqrtPriceX96After: bigint, priceImpactBps: number}}\n */\nfunction simulateSwap({ sqrtPriceX96, liquidity, amountIn, side, isToken0, feePips = 10000 }) {\n  const L = BigInt(liquidity);\n  if (L === 0n) throw new Error('pool has no active liquidity');\n  const sp = BigInt(sqrtPriceX96);\n  const inAfterFee = (BigInt(amountIn) * BigInt(1_000_000 - feePips)) / 1_000_000n;\n\n  // \"token do par sobe de preço o token\" => o par é token1 quando o token é token0\n  const pairIsToken1 = isToken0;\n  const addingToken1 = side === 'buy' ? pairIsToken1 : !pairIsToken1;\n\n  let spAfter;\n  let amountOut;\n  if (addingToken1) {\n    // ΔY = L * Δ√P  =>  √P' = √P + ΔY/L\n    spAfter = sp + (inAfterFee * Q96) / L;\n    // ΔX = L * Q96 * (√P' - √P) / (√P' * √P)\n    amountOut = (L * Q96 * (spAfter - sp)) / (spAfter * sp);\n  } else {\n    // adicionando token0: √P' = 1 / (1/√P + ΔX/L)\n    const denom = (L * Q96) / sp + inAfterFee;\n    spAfter = (L * Q96) / denom;\n    amountOut = (L * (sp - spAfter)) / Q96;\n  }\n\n  const impact = sp === 0n ? 0 : Number(((spAfter > sp ? spAfter - sp : sp - spAfter) * 20000n) / sp);\n  return {\n    amountOut,\n    sqrtPriceX96After: spAfter,\n    priceImpactBps: impact,                  // aprox: 2 * Δ√P/√P em bps\n    crossedRangeRisk: impact > 2000,         // >20% de impacto: simulação pouco confiável\n  };\n}\n\n/** Quanto do token do par é preciso para mover o preço em `bps`. */\nfunction pairAmountForMove({ sqrtPriceX96, liquidity, bps, isToken0 }) {\n  const sp = BigInt(sqrtPriceX96);\n  const L = BigInt(liquidity);\n  const target = sp + (sp * BigInt(bps)) / 20000n;      // Δ√P ≈ √P * bps/2 /10000\n  const delta = target - sp;\n  return isToken0 ? (L * delta) / Q96 : (L * Q96 * delta) / (target * sp);\n}\n\n// ------------------------------------------------------- formatação\n\nfunction formatUnits(value, decimals = 18, precision = 6) {\n  const v = BigInt(value);\n  const neg = v < 0n;\n  const abs = neg ? -v : v;\n  const base = pow10(decimals);\n  const int = abs / base;\n  let frac = (abs % base).toString().padStart(decimals, '0').slice(0, precision).replace(/0+$/, '');\n  return `${neg ? '-' : ''}${int}${frac ? '.' + frac : ''}`;\n}\n\nfunction parseUnits(text, decimals = 18) {\n  const [i, f = ''] = String(text).split('.');\n  return BigInt(i + f.padEnd(decimals, '0').slice(0, decimals));\n}\n\n  // Política de risco do agente. Tudo que a camada de execução puder fazer\n// precisa passar por aqui primeiro — o agente de IA propõe, a política decide.\n\nconst DEFAULT_POLICY = {\n  // --- capital -----------------------------------------------------------\n  minFundingWei: '1000000000000000',      // 0.001 ETH mínimo para ativar\n  maxNotionalPerTradeWei: '10000000000000000',  // 0.01 ETH por operação\n  maxDailyNotionalWei: '100000000000000000',    // 0.1 ETH por dia\n  reserveGasWei: '2000000000000000',      // nunca gastar abaixo desta reserva\n\n  // --- risco de mercado --------------------------------------------------\n  maxSlippageBps: 100,\n  minPoolLiquidityWei: '50000000000000000', // ignora pools sem profundidade\n  maxDrawdownBps: 2000,                   // 20% de queda do NAV pausa o agente\n  maxInventoryBps: 6000,                  // no máx. 60% do NAV no token\n\n  // --- ritmo -------------------------------------------------------------\n  maxTradesPerHour: 6,\n  minSecondsBetweenTrades: 120,\n\n  // --- governança --------------------------------------------------------\n  mode: 'propose',                        // 'propose' | 'auto'\n  requireApprovalAboveWei: '5000000000000000',\n  allowedTokens: [],                      // vazio = qualquer token indexado\n  blockedTokens: [],\n  killSwitch: false,\n};\n\n/** wei -> ETH legível. Sem dependência: a política não importa nada de fora. */\nconst fmtEth = (wei) => {\n  const v = BigInt(wei);\n  const whole = v / 10n ** 18n;\n  const frac = (v % 10n ** 18n).toString().padStart(18, '0').replace(/0+$/, '');\n  return frac ? `${whole}.${frac}` : String(whole);\n};\n\nconst BIG_FIELDS = [\n  'minFundingWei', 'maxNotionalPerTradeWei', 'maxDailyNotionalWei',\n  'reserveGasWei', 'minPoolLiquidityWei', 'requireApprovalAboveWei',\n];\n\nfunction validatePolicy(policy) {\n  const p = { ...policy };\n  for (const f of BIG_FIELDS) {\n    if (p[f] === undefined) throw new Error(`incomplete policy: ${f}`);\n    p[f] = BigInt(p[f]).toString();\n  }\n  if (!['propose', 'auto'].includes(p.mode)) throw new Error(\"mode must be 'propose' or 'auto'\");\n  if (BigInt(p.maxNotionalPerTradeWei) > BigInt(p.maxDailyNotionalWei)) {\n    throw new Error('maxNotionalPerTradeWei cannot exceed maxDailyNotionalWei');\n  }\n  return p;\n}\n\n/**\n * Avalia uma decisão proposta pelo agente contra a política e o estado atual.\n * Retorna sempre uma lista de violações — vazia significa aprovado.\n */\nfunction evaluate(decision, ctx) {\n  const p = ctx.policy;\n  const v = [];\n\n  if (p.killSwitch) v.push('kill switch is on');\n  if (decision.notionalWei !== undefined) {\n    const n = BigInt(decision.notionalWei);\n    if (n > BigInt(p.maxNotionalPerTradeWei)) v.push(`notional ${n} exceeds the per-trade limit`);\n    if (BigInt(ctx.spentTodayWei ?? 0) + n > BigInt(p.maxDailyNotionalWei)) v.push('daily notional limit exceeded');\n    // Diz o número que resolve, não só que está errado. \"eat into the gas\n    // reserve\" deixa a pessoa adivinhando quanto cabe; o teto é uma subtração.\n    const balance = BigInt(ctx.ethBalanceWei ?? 0);\n    const reserve = BigInt(p.reserveGasWei);\n    if (balance - n < reserve) {\n      const room = balance > reserve ? balance - reserve : 0n;\n      v.push(\n        `this would eat into the gas reserve — balance ${fmtEth(balance)} ETH minus the ` +\n        `${fmtEth(reserve)} ETH reserved for gas leaves at most ${fmtEth(room)} ETH per trade` +\n        (room === 0n ? '. Deposit more ETH into the agent wallet.' : ''),\n      );\n    }\n  }\n  if (ctx.poolLiquidityWei !== undefined && BigInt(ctx.poolLiquidityWei) < BigInt(p.minPoolLiquidityWei)) {\n    v.push('pool liquidity below the minimum');\n  }\n  if (ctx.drawdownBps !== undefined && ctx.drawdownBps > p.maxDrawdownBps) v.push('maximum drawdown reached');\n  if (ctx.inventoryBps !== undefined && decision.side === 'buy' && ctx.inventoryBps > p.maxInventoryBps) {\n    v.push('token inventory above the cap');\n  }\n  // \"trades\" aqui significa operações ENVIADAS. Quem passa esse contador é o\n  // runner, e ele conta só decisões com status 'executed' — simular não gasta\n  // nada e não pode consumir cota.\n  if (ctx.tradesLastHour >= p.maxTradesPerHour) {\n    v.push(`hourly trade limit reached (${ctx.tradesLastHour} of ${p.maxTradesPerHour} executed in the last hour)`);\n  }\n  if (ctx.secondsSinceLastTrade !== undefined && ctx.secondsSinceLastTrade < p.minSecondsBetweenTrades) {\n    v.push('minimum interval between trades not met');\n  }\n  if (p.blockedTokens.map((t) => t.toLowerCase()).includes(String(decision.token).toLowerCase())) {\n    v.push('token is on the block list');\n  }\n  if (p.allowedTokens.length && !p.allowedTokens.map((t) => t.toLowerCase()).includes(String(decision.token).toLowerCase())) {\n    v.push('token is not on the allow list');\n  }\n\n  const needsApproval = p.mode === 'propose'\n    || (decision.notionalWei !== undefined && BigInt(decision.notionalWei) >= BigInt(p.requireApprovalAboveWei));\n\n  return { violations: v, approved: v.length === 0, needsApproval };\n}\n\n\n\n  const SPECS = [{\"id\":\"buyback_burn\",\"label\":\"Buyback & burn\",\"description\":\"Buys the token with the agent balance and sends it to the burn address.\",\"needsCapital\":true,\"needsDelegation\":false,\"params\":{\"amountEth\":{\"type\":\"decimal\",\"default\":\"0.005\",\"label\":\"ETH per run\"},\"minIntervalMinutes\":{\"type\":\"int\",\"default\":60,\"label\":\"Minimum interval between runs (min)\"},\"burnAddress\":{\"type\":\"address\",\"default\":\"0x000000000000000000000000000000000000dEaD\",\"label\":\"Burn address\"}}},{\"id\":\"rewards_boost\",\"label\":\"Creator rewards → buyback & burn\",\"description\":\"Collects creator rewards, holds them in reserve, and after graduation puts 100% into buy and burn.\",\"needsCapital\":false,\"needsDelegation\":true,\"params\":{\"mode\":{\"type\":\"enum\",\"options\":[\"reserve_until_graduation\",\"burn_immediately\",\"collect_only\"],\"default\":\"reserve_until_graduation\",\"label\":\"What to do with rewards\"},\"deployPercent\":{\"type\":\"int\",\"default\":100,\"label\":\"% of rewards spent on buyback\"},\"minCollectWei\":{\"type\":\"decimal\",\"default\":\"0.002\",\"label\":\"Only collect above (ETH)\"},\"checkIntervalMinutes\":{\"type\":\"int\",\"default\":240,\"label\":\"Check interval (min)\"}}},{\"id\":\"dca\",\"label\":\"Scheduled buys (DCA)\",\"description\":\"Buys a fixed amount on a regular interval, with a per-order impact ceiling.\",\"needsCapital\":true,\"needsDelegation\":false,\"params\":{\"amountEth\":{\"type\":\"decimal\",\"default\":\"0.002\",\"label\":\"ETH per buy\"},\"intervalMinutes\":{\"type\":\"int\",\"default\":720,\"label\":\"Interval between buys (min)\"},\"totalBudgetEth\":{\"type\":\"decimal\",\"default\":\"0.1\",\"label\":\"Total program budget (ETH)\"},\"destination\":{\"type\":\"enum\",\"options\":[\"hold\",\"burn\"],\"default\":\"hold\",\"label\":\"Where bought tokens go\"}}},{\"id\":\"dip_buy\",\"label\":\"Dip buying\",\"description\":\"Buys when the price falls below its recent high by the percentage you choose.\",\"needsCapital\":true,\"needsDelegation\":false,\"params\":{\"dropPercent\":{\"type\":\"int\",\"default\":10,\"label\":\"Buy when the price falls this much (%)\"},\"amountEth\":{\"type\":\"decimal\",\"default\":\"0.002\",\"label\":\"How much ETH to spend each time\"},\"windowHours\":{\"type\":\"int\",\"default\":24,\"label\":\"Compare against the highest price of the last (hours)\"},\"cooldownMinutes\":{\"type\":\"int\",\"default\":180,\"label\":\"Wait at least this long between buys (minutes)\"},\"destination\":{\"type\":\"enum\",\"options\":[\"hold\",\"burn\"],\"default\":\"hold\",\"label\":\"Where the tokens go\"}}},{\"id\":\"airdrop\",\"label\":\"Airdrop\",\"description\":\"Distributes the token to a recipient list you provide.\",\"needsCapital\":false,\"needsDelegation\":false,\"params\":{\"recipientsCsv\":{\"type\":\"text\",\"default\":\"\",\"label\":\"List: address,amount per line\"},\"batchSize\":{\"type\":\"int\",\"default\":50,\"label\":\"Transfers per batch\"},\"dryRun\":{\"type\":\"bool\",\"default\":true,\"label\":\"Simulate only\"}}},{\"id\":\"holder_airdrop\",\"label\":\"Reward the holders\",\"description\":\"Distributes tokens to the real holders of your token, read from chain.\",\"needsCapital\":false,\"needsDelegation\":false,\"params\":{\"amountTokens\":{\"type\":\"decimal\",\"default\":\"0\",\"label\":\"Total to distribute (0 = whole balance)\"},\"mode\":{\"type\":\"enum\",\"options\":[\"equal\",\"proportional\"],\"default\":\"proportional\",\"label\":\"How to split\"},\"minHolderBalance\":{\"type\":\"decimal\",\"default\":\"1000\",\"label\":\"Minimum balance to qualify\"},\"maxHolders\":{\"type\":\"int\",\"default\":200,\"label\":\"Max holders per run (largest first)\"},\"excludeAddresses\":{\"type\":\"text\",\"default\":\"\",\"label\":\"Extra addresses to exclude, one per line\"},\"batchSize\":{\"type\":\"int\",\"default\":50,\"label\":\"Transfers per batch\"},\"dryRun\":{\"type\":\"bool\",\"default\":true,\"label\":\"Simulate only\"}}}];\n  const TOKEN = {\"address\":\"0x9f2b4c7e1a83d5064b7e2c9a15fd3e8b7c04a621\",\"symbol\":\"MYTOKEN\",\"name\":\"My Token\",\"decimals\":18,\"isToken0\":true,\"poolFee\":10000,\"sqrtPriceX96\":\"4619756043376610355707904\",\"liquidity\":\"28583097523751473441946\",\"totalSupply\":\"1000000000000000000000000000\",\"burned\":\"18400000000000000000000000\",\"graduated\":false,\"pairedPrincipal\":\"3114000000000000000\",\"graduationThreshold\":\"4200000000000000000\",\"pendingRewards\":\"13800000000000000\",\"maxTxTokens\":\"10000000000000000000000000\",\"maxWalletTokens\":\"20000000000000000000000000\"};\n  const CONTRACTS = {\"factory\":\"0xA5aAb3F0c6EeadF30Ef1D3Eb997108E976351feB\",\"factoryDeployBlock\":\"8991118\",\"locker\":\"0x736D76699C26D0d966744cAe304C000d471f7F35\",\"v3Factory\":\"0x1f7d7550B1b028f7571E69A784071F0205FD2EfA\",\"weth\":\"0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73\"};\n  const BURN = \"0x000000000000000000000000000000000000dEaD\";\n  const CHAIN_ID = 4663;\n\n  const S = { agents: [], fns: {}, decisions: [], nextId: 1, me: null };\n\n  const rnd = (n) => Array.from({ length: n }, () =>\n    '0123456789abcdef'[Math.floor(Math.random() * 16)]).join('');\n  const mkAddress = () => {\n    const h = rnd(40);\n    return '0x' + h.split('').map((c, i) => (parseInt(rnd(1), 16) > 7 ? c.toUpperCase() : c)).join('');\n  };\n  const now = () => Math.floor(Date.now() / 1000);\n\n  // ===== normalização de parâmetros (espelha functions/index.js) =====\n  function normalize(fnId, input) {\n    const spec = SPECS.find((s) => s.id === fnId);\n    const out = {};\n    for (const [k, def] of Object.entries(spec.params)) {\n      const raw = (input && input[k] !== undefined && input[k] !== '') ? input[k] : def.default;\n      if (def.type === 'int') {\n        const n = Number(raw);\n        if (!Number.isInteger(n) || n < 0) throw new Error(spec.label + ' → ' + def.label + ': must be an integer >= 0');\n        out[k] = n;\n      } else if (def.type === 'decimal') {\n        if (!/^\\d+(\\.\\d+)?$/.test(String(raw))) throw new Error(spec.label + ' → ' + def.label + ': must be a positive decimal');\n        out[k] = String(raw);\n      } else if (def.type === 'bool') {\n        out[k] = raw === true || raw === 'true';\n      } else if (def.type === 'enum') {\n        out[k] = def.options.includes(raw) ? raw : def.default;\n      } else {\n        out[k] = raw ?? '';\n      }\n    }\n    return out;\n  }\n\n  // ===== helpers de mercado usando a matemática real =====\n  const price = () => tokenPriceInPair({\n    sqrtPriceX96: BigInt(TOKEN.sqrtPriceX96), isToken0: TOKEN.isToken0,\n    tokenDecimals: TOKEN.decimals, pairDecimals: 18,\n  });\n\n  const quote = (amountIn, side) => simulateSwap({\n    sqrtPriceX96: BigInt(TOKEN.sqrtPriceX96), liquidity: BigInt(TOKEN.liquidity),\n    amountIn, side, isToken0: TOKEN.isToken0, feePips: TOKEN.poolFee,\n  });\n\n  const circulating = () => ({\n    total: BigInt(TOKEN.totalSupply),\n    burned: BigInt(TOKEN.burned),\n    circulating: BigInt(TOKEN.totalSupply) - BigInt(TOKEN.burned),\n  });\n\n  // ===== as cinco funções =====\n  const withSlippage = (a, bps) => (BigInt(a) * BigInt(10000 - bps)) / 10000n;\n\n  function planBuyback(agent, p) {\n    const amountIn = parseUnits(p.amountEth, 18);\n    const notes = [];\n    if (agent.eth < amountIn) {\n      return { notes: ['insufficient balance: has ' + formatUnits(agent.eth, 18) + ' ETH, needs ' + p.amountEth], decisions: [] };\n    }\n    const sim = quote(amountIn, 'buy');\n    const s = circulating();\n    notes.push('circulating supply today: ' + formatUnits(s.circulating, 18, 0) + ' of ' + formatUnits(s.total, 18, 0) +\n      ' (burned: ' + formatUnits(s.burned, 18, 0) + ')');\n    notes.push('totalSupply() does not change when you burn — the pons token has no burn()');\n    return {\n      notes,\n      decisions: [{\n        kind: 'buyback_burn', token: TOKEN.address, side: 'buy',\n        notionalWei: amountIn.toString(), priceImpactBps: sim.priceImpactBps,\n        expectedTokensOut: sim.amountOut.toString(),\n        rationale: 'buyback of ' + p.amountEth + ' ETH followed by a burn',\n        steps: [\n          { action: 'swap', side: 'buy', amountInWei: amountIn.toString(), minOutWei: withSlippage(sim.amountOut, 100).toString() },\n          { action: 'transfer', to: p.burnAddress || BURN, amountRef: 'swap.out' },\n        ],\n      }],\n    };\n  }\n\n  function planRewards(agent, p) {\n    const notes = [];\n    const decisions = [];\n    const pending = BigInt(TOKEN.pendingRewards);\n\n    if (!agent.delegated) {\n      notes.push('rewards for this token do not point at the agent yet — sign setFeeRedirect once to enable it');\n      notes.push('current payout: ' + (S.me || '0x…'));\n    }\n    notes.push('pending rewards: ' + formatUnits(pending, 18) + ' ETH');\n    notes.push('graduation: ' + formatUnits(BigInt(TOKEN.pairedPrincipal), 18) + ' / ' +\n      formatUnits(BigInt(TOKEN.graduationThreshold), 18) + ' ETH' + (TOKEN.graduated ? ' — graduated ✓' : ''));\n\n    if (agent.delegated && pending >= parseUnits(p.minCollectWei, 18)) {\n      decisions.push({\n        kind: 'collect_rewards', token: TOKEN.address, notionalWei: '0', priceImpactBps: 0,\n        rationale: 'collect ' + formatUnits(pending, 18) + ' ETH of creator rewards',\n        steps: [{ action: 'call', to: CONTRACTS.locker, method: 'collectFees', args: [TOKEN.address] }],\n      });\n    }\n\n    if (p.mode === 'reserve_until_graduation' && !TOKEN.graduated) {\n      notes.push('reserve mode: accumulating until graduation, no buying yet');\n    } else if (p.mode !== 'collect_only') {\n      const deployable = (agent.eth * BigInt(p.deployPercent)) / 100n;\n      if (deployable > 0n) {\n        const sim = quote(deployable, 'buy');\n        decisions.push({\n          kind: 'rewards_buyback_burn', token: TOKEN.address, side: 'buy',\n          notionalWei: deployable.toString(), priceImpactBps: sim.priceImpactBps,\n          expectedTokensOut: sim.amountOut.toString(),\n          rationale: 'put ' + p.deployPercent + '% of rewards (' + formatUnits(deployable, 18) + ' ETH) into buy and burn',\n          steps: [\n            { action: 'swap', side: 'buy', amountInWei: deployable.toString() },\n            { action: 'transfer', to: BURN, amountRef: 'swap.out' },\n          ],\n        });\n      }\n    }\n    return { notes, decisions };\n  }\n\n  function planDca(agent, p) {\n    const amountIn = parseUnits(p.amountEth, 18);\n    const budget = parseUnits(p.totalBudgetEth, 18);\n    const spent = S.decisions.filter((d) => d.agentId === agent.id && d.kind === 'dca' && d.status === 'executed')\n      .reduce((s, d) => s + BigInt(d.notionalWei), 0n);\n    if (spent + amountIn > budget) {\n      return { notes: ['program budget exhausted: ' + formatUnits(spent, 18) + ' of ' + p.totalBudgetEth + ' ETH'], decisions: [] };\n    }\n    if (agent.eth < amountIn) {\n      return { notes: ['insufficient balance: ' + formatUnits(agent.eth, 18) + ' ETH'], decisions: [] };\n    }\n    const sim = quote(amountIn, 'buy');\n\n    const perDay = (24 * 60) / p.intervalMinutes;\n    const feeYear = (amountIn * BigInt(Math.round(perDay * 365))) / 100n;\n    const notes = [\n      'estimated pool fees alone at this cadence: ~' + formatUnits(feeYear, 18, 4) + ' ETH per year',\n      'budget remaining: ' + formatUnits(budget - spent - amountIn, 18) + ' ETH',\n    ];\n    const steps = [{ action: 'swap', side: 'buy', amountInWei: amountIn.toString() }];\n    if (p.destination === 'burn') steps.push({ action: 'transfer', to: BURN, amountRef: 'swap.out' });\n    return {\n      notes,\n      decisions: [{\n        kind: 'dca', token: TOKEN.address, side: 'buy', notionalWei: amountIn.toString(),\n        priceImpactBps: sim.priceImpactBps, expectedTokensOut: sim.amountOut.toString(),\n        rationale: 'scheduled buy of ' + p.amountEth + ' ETH (every ' + p.intervalMinutes + ' min)',\n        steps,\n      }],\n    };\n  }\n\n  function parseLadder(text) {\n    return String(text).split(',').map((part) => {\n      const bits = part.trim().split(':');\n      const dropBps = Math.round(Number(bits[0]) * 100);\n      if (!Number.isFinite(dropBps) || !bits[1]) throw new Error('invalid ladder step: \"' + part.trim() + '\"');\n      return { dropBps: dropBps, amountEth: bits[1].trim() };\n    }).sort((a, b) => a.dropBps - b.dropBps);\n  }\n\n  function planDip(agent, p) {\n    let ladder;\n    try { ladder = p.ladder ? parseLadder(p.ladder) : [{ dropBps: Math.round(Number(p.dropPercent) * 100), amountEth: String(p.amountEth) }]; }\n    catch (e) { return { notes: [e.message], decisions: [] }; }\n\n    // no demo a máxima da janela é 20% acima do preço atual\n    const cur = price();\n    const high = (cur * 12000n) / 10000n;\n    const dropBps = Number(((high - cur) * 10000n) / high);\n    const notes = ['now ' + formatUnits(cur, 18, 12) + ' ETH · highest in ' + p.windowHours + 'h: ' +\n      formatUnits(high, 18, 12) + ' ETH · that is ' + (dropBps / 100).toFixed(2) + '% below the high'];\n\n    const step = ladder.slice().reverse().find((s) => dropBps >= s.dropBps);\n    if (!step) {\n      notes.push('the drop has not reached ' + (ladder[0].dropBps / 100) + '% yet — no buy');\n      return { notes, decisions: [] };\n    }\n    const amountIn = parseUnits(step.amountEth, 18);\n    if (agent.eth < amountIn) {\n      notes.push('the ' + (step.dropBps / 100) + '% drop was reached, but the agent only has ' + formatUnits(agent.eth, 18) + ' ETH');\n      return { notes, decisions: [] };\n    }\n    const sim = quote(amountIn, 'buy');\n    const steps = [{ action: 'swap', side: 'buy', amountInWei: amountIn.toString() }];\n    if (p.destination === 'burn') steps.push({ action: 'transfer', to: BURN, amountRef: 'swap.out' });\n    return {\n      notes,\n      decisions: [{\n        kind: 'dip_buy', token: TOKEN.address, side: 'buy', notionalWei: amountIn.toString(),\n        priceImpactBps: sim.priceImpactBps, expectedTokensOut: sim.amountOut.toString(),\n        rationale: 'the price is ' + (dropBps / 100).toFixed(2) + '% below the ' + p.windowHours + 'h high, past the ' +\n          (step.dropBps / 100) + '% you set — buying ' + step.amountEth + ' ETH',\n        steps,\n      }],\n    };\n  }\n\n  function parseRecipients(csv, decimals) {\n    const out = []; const errors = []; const seen = {};\n    String(csv).split(/\\r?\\n/).forEach((line, i) => {\n      const raw = line.trim();\n      if (!raw || raw[0] === '#') return;\n      const parts = raw.split(/[,;\\t]/).map((s) => (s || '').trim());\n      const addr = parts[0]; const amount = parts[1]; const n = i + 1;\n      if (!/^0x[0-9a-fA-F]{40}$/.test(addr || '')) { errors.push('line ' + n + ': invalid address \"' + addr + '\"'); return; }\n      if (seen[addr.toLowerCase()]) { errors.push('line ' + n + ': duplicate address ' + addr); return; }\n      let value;\n      try { value = parseUnits(amount, decimals); } catch (e) { errors.push('line ' + n + ': invalid amount \"' + amount + '\"'); return; }\n      if (value <= 0n) { errors.push('line ' + n + ': amount must be greater than zero'); return; }\n      seen[addr.toLowerCase()] = 1;\n      out.push({ address: addr, amount: value });\n    });\n    return { recipients: out, errors, total: out.reduce((s, r) => s + r.amount, 0n) };\n  }\n\n  function planAirdrop(agent, p) {\n    const parsed = parseRecipients(p.recipientsCsv, TOKEN.decimals);\n    const notes = parsed.errors.slice();\n    if (!parsed.recipients.length) {\n      notes.push('no valid recipients — provide the address list');\n      return { notes, decisions: [] };\n    }\n    const known = S.agents.map((a) => a.address.toLowerCase()).concat([String(S.me || '').toLowerCase()]);\n    const self = parsed.recipients.filter((r) => known.indexOf(r.address.toLowerCase()) >= 0);\n    if (self.length) {\n      self.forEach((h) => notes.push('recipient ' + h.address + ' is a wallet owned by this tool'));\n      notes.push('airdrop cancelled: the list points at wallets owned by this tool');\n      return { notes, decisions: [] };\n    }\n    if (agent.token < parsed.total) {\n      notes.push('agent balance (' + formatUnits(agent.token, 18, 4) + ') is below the airdrop total (' +\n        formatUnits(parsed.total, 18, 4) + ')');\n    }\n    const over = parsed.recipients.filter((r) => r.amount > BigInt(TOKEN.maxWalletTokens));\n    if (over.length) {\n      notes.push(over.length + ' recipients exceed maxWallet (' + formatUnits(BigInt(TOKEN.maxWalletTokens), 18, 4) + ') — those transfers would revert');\n    }\n    const batches = [];\n    for (let i = 0; i < parsed.recipients.length; i += p.batchSize) batches.push(parsed.recipients.slice(i, i + p.batchSize));\n    notes.push(parsed.recipients.length + ' recipients, ' + formatUnits(parsed.total, 18, 4) + ' tokens, ' + batches.length + ' batch(es)');\n    if (p.dryRun) { notes.push('simulate only: no transfer will be sent'); return { notes, decisions: [] }; }\n    return {\n      notes,\n      decisions: batches.map((b, i) => ({\n        kind: 'airdrop', token: TOKEN.address, notionalWei: '0', priceImpactBps: 0,\n        rationale: 'airdrop batch ' + (i + 1) + '/' + batches.length + ' — ' + b.length + ' recipients',\n        steps: b.map((r) => ({ action: 'transfer', to: r.address, amountWei: r.amount.toString() })),\n      })),\n    };\n  }\n\n  const PLANNERS = {\n    buyback_burn: planBuyback, rewards_boost: planRewards,\n    dca: planDca, dip_buy: planDip, airdrop: planAirdrop,\n    holder_airdrop: () => ({ notes: ['reading the holder list needs the live explorer — try it on the local site'], decisions: [] }),\n  };\n\n  // ===== motor: guards + política, igual ao runner real =====\n  function runAgent(agent) {\n    const enabled = (S.fns[agent.id] || []).filter((f) => f.enabled);\n    const results = [];\n    const spentToday = S.decisions.filter((d) => d.agentId === agent.id && d.status === 'executed')\n      .reduce((s, d) => s + BigInt(d.notionalWei || 0), 0n);\n\n    for (const f of enabled) {\n      const spec = SPECS.find((s) => s.id === f.function_id);\n      let planned;\n      try { planned = PLANNERS[f.function_id](agent, f.params); }\n      catch (e) { results.push({ functionId: f.function_id, error: e.message }); continue; }\n\n      const evaluated = planned.decisions.map((decision) => {\n        const violations = [];\n        // guards do protocolo\n        if (decision.expectedTokensOut && BigInt(decision.expectedTokensOut) > BigInt(TOKEN.maxTxTokens)) {\n          violations.push('order of ' + decision.expectedTokensOut + ' exceeds maxTx of ' + TOKEN.maxTxTokens);\n        }\n        // política de risco (código real)\n        const verdict = evaluate(decision, {\n          policy: agent.policy,\n          ethBalanceWei: agent.eth,\n          spentTodayWei: spentToday,\n          poolLiquidityWei: BigInt(TOKEN.liquidity),\n          tradesLastHour: 0,\n          secondsSinceLastTrade: 999999,\n        });\n        verdict.violations = violations.concat(verdict.violations);\n        verdict.approved = verdict.violations.length === 0;\n\n        const id = S.nextId++;\n        S.decisions.push({\n          id, agentId: agent.id, kind: decision.kind, notionalWei: decision.notionalWei,\n          ts: now(), status: verdict.violations.length ? 'rejected' : (verdict.needsApproval ? 'pending_approval' : 'approved'),\n        });\n        return { id, decision, verdict };\n      });\n\n      results.push({\n        functionId: f.function_id, label: spec.label,\n        notes: planned.notes || [], decisions: evaluated,\n      });\n    }\n\n    const s = circulating();\n    return {\n      agent: { id: agent.id, address: agent.address, status: agent.status },\n      token: TOKEN.address,\n      state: {\n        symbol: TOKEN.symbol,\n        pricePair: price().toString(),\n        mcapPair: marketCapInPair(price(), BigInt(TOKEN.totalSupply), 18).toString(),\n        liquidity: TOKEN.liquidity,\n        graduated: TOKEN.graduated,\n        balances: { eth: agent.eth.toString(), weth: '0', token: agent.token.toString() },\n        supply: { total: s.total.toString(), burned: s.burned.toString(), circulating: s.circulating.toString() },\n        restrictionsActive: false,\n      },\n      results,\n    };\n  }\n\n  // ===== roteador falso =====\n  const ROUTES = [\n    ['GET', /^\\/api\\/config$/, () => ({\n      chain: { id: CHAIN_ID, name: 'Robinhood Chain', explorer: 'https://robinhoodchain.blockscout.com' },\n      contracts: CONTRACTS, burnAddress: BURN, functions: SPECS, domain: 'pons-mm (demo)', liveExecution: false,\n    })],\n    ['GET', /^\\/api\\/health$/, () => ({ rpc: 'ok', chainId: CHAIN_ID, head: '9142887', expected: CHAIN_ID })],\n    ['GET', /^\\/api\\/auth\\/me$/, () => ({ address: S.me })],\n\n    ['POST', /^\\/api\\/auth\\/nonce$/, (m, body) => {\n      const nonce = rnd(32);\n      S.nonce = nonce;\n      return {\n        nonce,\n        message: 'pons-mm (demo) wants to verify that you control this wallet.\\n\\n' +\n          'Signing this message authorizes no transaction, moves no funds,\\n' +\n          'and gives no access to your wallet.\\n\\n' +\n          'Address: ' + body.address + '\\nNetwork: ' + CHAIN_ID + '\\nNonce: ' + nonce,\n      };\n    }],\n\n    ['POST', /^\\/api\\/auth\\/verify$/, (m, body) => {\n      if (!body.signature || body.nonce !== S.nonce) throw new Error('invalid signature');\n      S.nonce = null;\n      S.me = body.address;\n      return { address: body.address, expiresAt: Date.now() + 7 * 864e5 };\n    }],\n    ['POST', /^\\/api\\/auth\\/logout$/, () => { S.me = null; return { ok: true }; }],\n\n    ['GET', /^\\/api\\/agents$/, () => S.agents.map((a) => ({\n      id: a.id, label: a.label, address: a.address, status: a.status, created_at: a.createdAt,\n    }))],\n\n    ['POST', /^\\/api\\/agents$/, (m, body) => {\n      if (!body.password || body.password.length < 8) throw new Error('keystore password must be at least 8 characters');\n      const agent = {\n        id: 'ag-' + rnd(8), label: body.label || 'agent', address: mkAddress(),\n        status: 'awaiting_funding', createdAt: now(), target_token: TOKEN.address,\n        custody: body.custody || 'hybrid', delegated: false,\n        eth: 0n, token: 0n, policy: validatePolicy(DEFAULT_POLICY),\n      };\n      S.agents.push(agent);\n      S.fns[agent.id] = [];\n      return {\n        id: agent.id, label: agent.label, address: agent.address, chainId: CHAIN_ID,\n        status: agent.status, owner: S.me,\n        depositInstructions: 'Send Robinhood Chain ETH (chain ' + CHAIN_ID + ') to ' + agent.address + '.',\n      };\n    }],\n\n    ['GET', /^\\/api\\/agents\\/([^/]+)$/, (m) => {\n      const a = S.agents.find((x) => x.id === m[1]);\n      if (!a) throw new Error('agent not found');\n      return {\n        id: a.id, label: a.label, address: a.address, status: a.status,\n        target_token: a.target_token, custody: a.custody,\n        balances: { eth: a.eth.toString(), ethFormatted: formatUnits(a.eth, 18), weth: '0' },\n        functions: S.fns[a.id] || [],\n        decisions: S.decisions.filter((d) => d.agentId === a.id).slice(-30).reverse(),\n      };\n    }],\n\n    ['POST', /^\\/api\\/agents\\/([^/]+)\\/functions$/, (m, body) => {\n      const list = S.fns[m[1]] || (S.fns[m[1]] = []);\n      const i = list.findIndex((f) => f.function_id === body.functionId);\n      if (body.enabled === false) { if (i >= 0) list[i].enabled = false; return { ok: true }; }\n      const params = normalize(body.functionId, body.params);\n      if (i >= 0) { list[i] = { function_id: body.functionId, enabled: true, params }; }\n      else list.push({ function_id: body.functionId, enabled: true, params });\n      return { ok: true, params };\n    }],\n\n    ['POST', /^\\/api\\/agents\\/([^/]+)\\/run$/, (m) => {\n      const a = S.agents.find((x) => x.id === m[1]);\n      if (!a) throw new Error('agent not found');\n      return runAgent(a);\n    }],\n\n    ['POST', /^\\/api\\/agents\\/([^/]+)\\/withdraw$/, (m, body) => {\n      const a = S.agents.find((x) => x.id === m[1]);\n      if (!body.password) throw new Error('the keystore password is required to sign the withdrawal');\n      const isEth = body.asset !== 'token';\n      const amount = isEth ? (a.eth > 300000000000000n ? a.eth - 300000000000000n : 0n) : a.token;\n      if (amount <= 0n) throw new Error('nothing to withdraw');\n      if (body.live) { if (isEth) a.eth = 0n; else a.token = 0n; }\n      return {\n        dryRun: !body.live, asset: isEth ? 'eth' : 'token',\n        to: body.to || S.me, amount: amount.toString(),\n        gasCost: isEth ? '300000000000000' : undefined,\n        hash: body.live ? '0x' + rnd(64) : undefined,\n      };\n    }],\n\n    ['PATCH', /^\\/api\\/agents\\/([^/]+)$/, (m, body) => {\n      const a = S.agents.find((x) => x.id === m[1]);\n      if (body.label !== undefined) a.label = String(body.label).trim() || a.label;\n      if (body.token !== undefined) a.target_token = body.token ? String(body.token).toLowerCase() : null;\n      return { ok: true, agent: a, tokenInfo: body.token\n        ? { address: body.token, valid: true, hasCode: true, isPonsToken: true,\n            erc20: { name: TOKEN.name, symbol: TOKEN.symbol, decimals: 18 }, verdict: null }\n        : null };\n    }],\n\n    ['POST', /^\\/api\\/agents\\/([^/]+)\\/delegation$/, (m) => {\n      const a = S.agents.find((x) => x.id === m[1]);\n      return {\n        agentAddress: a.address, token: TOKEN.address,\n        tokenInfo: { address: TOKEN.address, valid: true, hasCode: true, isPonsToken: true,\n          erc20: { name: TOKEN.name, symbol: TOKEN.symbol, decimals: 18 }, verdict: null },\n        status: { feeRecipient: a.delegated ? a.address : S.me, redirectedToAgent: a.delegated, canCollectNow: a.delegated },\n        transactions: [\n          {\n            label: 'point the creator payout at the agent', to: CONTRACTS.locker,\n            data: '0x2f1a' + rnd(60), signature: 'setFeeRedirect(address,address)',\n            note: 'only the token deployer can call this; from then on rewards land in the agent wallet',\n            simulation: { ok: true },\n          },\n          {\n            label: 'authorize the agent to trigger collection', to: CONTRACTS.locker,\n            data: '0x8b4c' + rnd(60), signature: 'setFeeCollector(address,bool)',\n            note: 'restricted to the locker owner — if it fails, the agent can still collect through the pons interface',\n            // A demo mostra o caso real: esta chamada é do dono do locker, não do\n            // criador do token. Fingir que passa esconderia justamente a limitação.\n            simulation: { ok: false, error: 'OwnableUnauthorizedAccount',\n              reason: 'This call is restricted to the locker owner - the pons team, not token creators. You cannot authorize a collector yourself; the agent collects through the redirect instead.' },\n          },\n        ],\n      };\n    }],\n\n    ['POST', /^\\/api\\/decisions\\/(\\d+)\\/execute$/, () => {\n      throw new Error('execution is disabled in the demo — run the site locally to try it');\n    }],\n\n    ['POST', /^\\/api\\/decisions\\/(\\d+)\\/(approve|reject)$/, (m) => {\n      const d = S.decisions.find((x) => x.id === Number(m[1]));\n      if (d) d.status = m[2] === 'approve' ? 'approved' : 'rejected_by_user';\n      return { ok: true };\n    }],\n\n    ['POST', /^\\/api\\/airdrop\\/validate$/, (m, body) => {\n      const p = parseRecipients(body.csv || '', 18);\n      return {\n        count: p.recipients.length, total: p.total.toString(),\n        totalFormatted: formatUnits(p.total, 18, 4), errors: p.errors,\n        sample: p.recipients.slice(0, 5).map((r) => ({ address: r.address, amount: r.amount.toString() })),\n      };\n    }],\n  ];\n\n  window.fetch = async function (url, opts) {\n    opts = opts || {};\n    const path = String(url).replace(/^https?:\\/\\/[^/]+/, '');\n    const method = opts.method || 'GET';\n    const body = opts.body ? JSON.parse(opts.body) : {};\n    await new Promise((r) => setTimeout(r, 90));\n    for (const [m, re, fn] of ROUTES) {\n      if (m !== method) continue;\n      const match = re.exec(path);\n      if (!match) continue;\n      try {\n        const out = fn(match, body);\n        return new Response(JSON.stringify(out, (k, v) => (typeof v === 'bigint' ? v.toString() : v)),\n          { status: 200, headers: { 'content-type': 'application/json' } });\n      } catch (e) {\n        return new Response(JSON.stringify({ error: e.message }), { status: 400, headers: { 'content-type': 'application/json' } });\n      }\n    }\n    return new Response(JSON.stringify({ error: 'route not available in the demo: ' + method + ' ' + path }),\n      { status: 404, headers: { 'content-type': 'application/json' } });\n  };\n\n  // ===== carteira falsa: o \"conectar\" e o \"assinar\" funcionam na demo =====\n  S.me = null;\n  window.ethereum = {\n    isDemo: true,\n    request: async ({ method, params }) => {\n      if (method === 'eth_requestAccounts') { S.me = mkAddress(); return [S.me]; }\n      if (method === 'personal_sign') return '0x' + rnd(130);\n      // A demo finge estar sempre na rede certa: a troca de rede é justamente\n      // a parte que não dá para simular de forma honesta sem uma carteira real.\n      if (method === 'eth_chainId') return '0x1237';\n      if (method === 'wallet_switchEthereumChain' || method === 'wallet_addEthereumChain') return null;\n      if (method === 'eth_sendTransaction') {\n        const a = S.agents.find((x) => x.id === (window.__lastAgentId || ''));\n        S.agents.forEach((x) => { x.delegated = true; });\n        return '0x' + rnd(64);\n      }\n      throw new Error('método não simulado: ' + method);\n    },\n  };\n\n  // ===== ferramentas de demo: depositar e limpar =====\n  window.__demo = {\n    fund(agentId, eth) {\n      const a = S.agents.find((x) => x.id === agentId);\n      if (!a) return;\n      a.eth += parseUnits(String(eth), 18);\n      a.token += parseUnits('12840000', 18);\n      a.status = 'funded';\n    },\n    state: S,\n  };\n\n  window.alert = (m) => {\n    const d = document.createElement('div');\n    d.textContent = m;\n    d.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1a212a;' +\n      'border:1px solid #2f3a47;color:#e8eef5;padding:12px 18px;border-radius:10px;font:13px system-ui;' +\n      'z-index:9999;max-width:80%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5)';\n    document.body.appendChild(d);\n    setTimeout(() => d.remove(), 3400);\n  };\n  // location.reload é somente-leitura no navegador — o \"Sair\" é tratado na barra de demo.\n  window.__demoLogout = () => {\n    S.me = null;\n    S.agents.length = 0;\n    S.decisions.length = 0;\n    document.getElementById('gate').style.display = 'block';\n    document.getElementById('app').style.display = 'none';\n    document.getElementById('connectBtn').style.display = 'inline-block';\n    document.getElementById('logoutBtn').style.display = 'none';\n    document.getElementById('userChip').style.display = 'none';\n  };\n})();\n<\/script>\n<script>\n(function () {\n  function build() {\n    const bar = document.createElement('div');\n    bar.style.cssText = 'position:fixed;right:18px;bottom:18px;background:#141920;border:1px solid #2a3542;' +\n      'border-radius:12px;padding:13px 15px;z-index:900;font:12px system-ui;color:#8b98a8;' +\n      'box-shadow:0 10px 34px rgba(0,0,0,.55);max-width:250px';\n    bar.innerHTML = '<div style=\"color:#e3b341;font-weight:600;margin-bottom:7px\">demo mode<\/div>' +\n      '<div style=\"margin-bottom:9px;line-height:1.45\">The agent starts with no balance, just like the real thing. ' +\n      'Fund it so the capital functions can run.<\/div>' +\n      '<button id=\"__fund\" style=\"background:#5aa2ff;color:#04101f;border:0;border-radius:7px;padding:7px 12px;' +\n      'font:inherit;font-weight:600;cursor:pointer;width:100%\">Deposit 0.05 ETH into the agent<\/button>';\n    document.body.appendChild(bar);\n    const out = document.getElementById('logoutBtn');\n    if (out) out.onclick = () => window.__demoLogout();\n\n    document.getElementById('__fund').onclick = () => {\n      const sel = document.getElementById('agentSelect');\n      if (!sel || !sel.value) return alert('create and select an agent first');\n      window.__demo.fund(sel.value, 0.05);\n      sel.dispatchEvent(new Event('change'));\n      alert('0.05 ETH credited to the agent wallet (demo)');\n    };\n  }\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', build);\n  else build();\n})();\n<\/script>\n<\/head>\n<body>\n\n<nav>\n  <div class=\"logo\"><a href=\"/\" style=\"color:inherit\">{{BRAND_HTML}}<\/a><\/div>\n  <span class=\"chip\" id=\"chainChip\">…<\/span>\n  <div class=\"sp\"><\/div>\n  <span class=\"chip\" id=\"walletChain\" style=\"display:none\"><\/span>\n  <span class=\"chip\" id=\"userChip\" style=\"display:none\"><\/span>\n  <button id=\"connectBtn\">Connect wallet<\/button>\n  <button class=\"ghost sm\" id=\"logoutBtn\" style=\"display:none\">Sign out<\/button>\n<\/nav>\n\n<div id=\"gate\" class=\"gate\">\n  <h1>Connect your wallet<\/h1>\n  <p>You'll sign a plain text message to prove the address is yours.\n     This moves no funds and authorizes no transaction.<\/p>\n  <button id=\"gateBtn\">Connect wallet<\/button>\n  <p style=\"margin-top:20px;font-size:12px\">\n    No wallet in your browser? The <a href=\"/\">CLI<\/a> does the same from the command line.\n  <\/p>\n<\/div>\n\n<main id=\"app\" style=\"display:none\">\n  <div>\n    <div class=\"card\">\n      <h2>Create agent<\/h2>\n      <label>Label<\/label>\n      <input id=\"label\" placeholder=\"my token's agent\">\n      <label>Target token<\/label>\n      <input id=\"token\" class=\"mono\" placeholder=\"0x…\">\n      <label>Keystore password<\/label>\n      <input id=\"password\" type=\"password\" placeholder=\"at least 8 characters\">\n      <label style=\"display:flex;gap:8px;align-items:flex-start;margin-top:14px;cursor:pointer\">\n        <input type=\"checkbox\" id=\"terms\" style=\"width:auto;margin-top:3px\">\n        <span style=\"font-size:12px;color:var(--dim)\">I have read the\n          <a href=\"/terms\" target=\"_blank\">terms and risks<\/a> — including that losing the\n          password means losing the agent's funds.<\/span>\n      <\/label>\n      <button id=\"createBtn\" style=\"margin-top:12px\">Create agent and wallet<\/button>\n      <div id=\"created\" style=\"display:none\">\n        <div class=\"addr\">\n          <div style=\"font-size:12px;color:var(--dim);margin-bottom:6px\">Deposit address<\/div>\n          <div class=\"mono\" id=\"createdAddr\"><\/div>\n        <\/div>\n        <div class=\"note warn\">Save this password. Without it the keystore — and the agent's funds — cannot be recovered.<\/div>\n        <div class=\"note\" id=\"depositAdvice\"><\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"card\">\n      <h2>My agents<\/h2>\n      <select id=\"agentSelect\"><option value=\"\">—<\/option><\/select>\n      <div id=\"agentInfo\"><\/div>\n    <\/div>\n\n    <div class=\"card\">\n      <h2>Delegate creator rewards<\/h2>\n      <p style=\"font-size:12px;color:var(--dim)\">\n        One signature points your creator payout at the agent. Revert it whenever you want.\n      <\/p>\n      <button class=\"ghost\" id=\"delegBtn\" style=\"margin-top:12px\">Prepare transaction<\/button>\n      <div id=\"delegOut\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div>\n    <div id=\"betaBanner\"><\/div>\n    <div class=\"banner\">\n      <strong>About burning:<\/strong> the pons token has no <code>burn()<\/code>.\n      Sending to <code>0x…dEaD<\/code> does remove coins from circulation, but\n      <code>totalSupply()<\/code> stays at 1B forever. Publish circulating supply,\n      not total.\n    <\/div>\n\n    <div class=\"card\">\n      <h2>Functions<\/h2>\n      <div id=\"functions\"><div class=\"empty\">loading…<\/div><\/div>\n      <button id=\"runBtn\" disabled style=\"margin-top:6px\">Run agent (simulation)<\/button>\n    <\/div>\n\n    <div class=\"card\">\n      <h2>Results<\/h2>\n      <div id=\"result\"><div class=\"empty\">Pick an agent, turn on some functions, and run the simulation.<\/div><\/div>\n    <\/div>\n  <\/div>\n<\/main>\n\n<script>\nconst $ = (id) => document.getElementById(id);\nconst esc = (s) => String(s ?? '').replace(/[&<>\"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst api = async (method, path, body) => {\n  const res = await fetch(path, {\n    method, headers: {'content-type':'application/json'},\n    body: body ? JSON.stringify(body) : undefined, credentials: 'same-origin',\n  });\n  const data = await res.json();\n  if (!res.ok) throw new Error(data.error || 'request failed');\n  return data;\n};\n// Prices in these pools are tiny (1e-9 ETH is common). Rounding to 6 decimals would\n// show \"0\" for almost every token, so values below 1 use significant digits instead\n// of fixed decimal places.\nconst eth = (wei, d = 18) => {\n  const v = BigInt(wei || 0);\n  if (v === 0n) return '0';\n  const neg = v < 0n;\n  const n = Number(neg ? -v : v) / Number(10n ** BigInt(d));\n  const s = n >= 1 ? n.toFixed(6).replace(/0+$/, '').replace(/\\.$/, '') : Number(n.toPrecision(4)).toString();\n  return (neg ? '-' : '') + s;\n};\n\nlet CONFIG = null, ME = null, AGENT = null, ME_TERMS = false;\n\nasync function boot() {\n  CONFIG = await api('GET', '/api/config');\n  renderFunctions();\n  renderBanners();\n  api('GET', '/api/health').then((h) => {\n    const c = $('chainChip');\n    if (h.rpc === 'ok' && h.chainId === h.expected) {\n      c.className = 'chip ok'; c.textContent = `chain ${h.chainId} · block ${h.head}`;\n    } else {\n      c.className = 'chip bad';\n      c.textContent = h.rpc === 'ok' ? `unexpected chain ${h.chainId}` : 'RPC unavailable';\n    }\n  });\n  const me = await api('GET', '/api/auth/me');\n  ME_TERMS = !!me.termsAccepted;\n  if (me.address) await onLogin(me.address);\n}\n\n// ---------------------------------------------------------------- login\n\nasync function connect() {\n  if (!window.ethereum) {\n    return alert('No wallet found in this browser. Install MetaMask or use the CLI.');\n  }\n  try {\n    const [address] = await window.ethereum.request({ method: 'eth_requestAccounts' });\n    // Troca de rede antes de assinar: assim a pessoa já entra na rede certa e\n    // não descobre o problema só na hora da primeira transação. Se ela recusar,\n    // o login continua — assinar mensagem não depende de rede.\n    await ensureChain({ silent: true });\n    const { nonce, message } = await api('POST', '/api/auth/nonce', { address });\n    const signature = await window.ethereum.request({\n      method: 'personal_sign', params: [message, address],\n    });\n    const session = await api('POST', '/api/auth/verify', { address, nonce, signature });\n    ME_TERMS = false;\n    await onLogin(session.address);\n  } catch (e) {\n    alert(e.message || 'could not connect');\n  }\n}\n\nasync function onLogin(address) {\n  ME = address;\n  $('gate').style.display = 'none';\n  $('app').style.display = 'grid';\n  $('connectBtn').style.display = 'none';\n  $('logoutBtn').style.display = 'inline-block';\n  const chip = $('userChip');\n  chip.style.display = 'inline-block';\n  chip.textContent = address.slice(0, 6) + '…' + address.slice(-4);\n  renderWalletChain();\n  await loadAgents();\n}\n\n$('connectBtn').onclick = connect;\n$('gateBtn').onclick = connect;\n$('logoutBtn').onclick = async () => { await api('POST', '/api/auth/logout'); location.reload(); };\n\n// ---------------------------------------------------------------- agentes\n\n// A lista é carregada e um agente é SELECIONADO sozinho.\n//\n// Deixar o seletor vazio depois de um refresh faz o painel parecer vazio, e\n// painel vazio parece perda de dados — foi exatamente essa a leitura num teste\n// real (\"atualizei a página e meu agente sumiu\"). Nada tinha sumido: só não\n// havia nada escolhido. Escolher sozinho custa uma linha e elimina o susto.\nasync function loadAgents(preferId = null) {\n  const agents = await api('GET', '/api/agents');\n  const sel = $('agentSelect');\n  sel.innerHTML = '<option value=\"\">—<\/option>' +\n    agents.map((a) => `<option value=\"${a.id}\">${esc(a.label)} · ${a.address.slice(0,10)}…<\/option>`).join('');\n\n  if (agents.length === 0) {\n    AGENT = null;\n    $('runBtn').disabled = true;\n    $('agentInfo').innerHTML = `\n      <div class=\"kv\"><span>agents on this account<\/span><span>none yet<\/span><\/div>\n      <p class=\"muted\" style=\"margin:10px 0 0\">\n        Agents belong to the wallet that created them. This account\n        (<span class=\"mono\">${esc(ME || '')}<\/span>) has none.\n        If you created one earlier, switch back to that account in your wallet\n        and reload — nothing is deleted when you refresh.\n      <\/p>`;\n    return;\n  }\n\n  // mantém a escolha atual; senão fica com a última usada; senão com a primeira\n  const remembered = (() => { try { return sessionStorage.getItem('pons_agent'); } catch { return null; } })();\n  const wanted = (preferId && agents.some((a) => a.id === preferId) && preferId)\n    || (AGENT && agents.some((a) => a.id === AGENT.id) && AGENT.id)\n    || (remembered && agents.some((a) => a.id === remembered) && remembered)\n    || agents[0].id;\n  sel.value = wanted;\n  if (!AGENT || AGENT.id !== wanted) await selectAgent(wanted);\n}\n\n$('createBtn').onclick = async () => {\n  const b = $('createBtn');\n  if (!$('terms').checked && !ME_TERMS) return alert('please read and accept the terms first');\n  b.disabled = true; b.textContent = 'generating wallet…';\n  try {\n    if (!ME_TERMS) { await api('POST', '/api/terms/accept'); ME_TERMS = true; }\n    const agent = await api('POST', '/api/agents', {\n      label: $('label').value || 'agent', password: $('password').value,\n      token: $('token').value.trim() || undefined, custody: 'hybrid',\n    });\n    $('created').style.display = 'block';\n    $('createdAddr').textContent = agent.address;\n    $('depositAdvice').textContent = CONFIG.beta\n      ? `While this is in early access, keep deposits small — around ${CONFIG.depositAdviceEth} ETH is a sensible ceiling.`\n      : '';\n    $('password').value = '';\n    await loadAgents(agent.id);\n  } catch (e) { alert(e.message); }\n  b.disabled = false; b.textContent = 'Create agent and wallet';\n};\n\n$('agentSelect').onchange = (e) => selectAgent(e.target.value);\n\nasync function selectAgent(id) {\n  if (!id) { AGENT = null; $('agentInfo').innerHTML = ''; $('runBtn').disabled = true; return; }\n  AGENT = await api('GET', '/api/agents/' + id);\n  try { sessionStorage.setItem('pons_agent', id); } catch { /* modo privado: sem memória, sem problema */ }\n  $('runBtn').disabled = false;\n  // O token alvo é editável aqui. Antes só dava para escolher na criação, e\n  // quem errasse o endereço tinha que criar outro agente — carteira nova, chave\n  // nova, fundos para mover. Trocar um campo de texto não pode custar isso.\n  $('agentInfo').innerHTML = `\n    <div class=\"addr\"><div class=\"mono\">${AGENT.address}<\/div><\/div>\n    <div class=\"kv\"><span>status<\/span><span>${esc(AGENT.status)}<\/span><\/div>\n    <div class=\"kv\"><span>balance<\/span><span>${AGENT.balances ? AGENT.balances.ethFormatted + ' ETH' : 'network unavailable'}<\/span><\/div>\n    <label>Target token — the token this agent works on<\/label>\n    <input id=\"agentToken\" class=\"mono\" placeholder=\"0x…\" value=\"${esc(AGENT.target_token || '')}\">\n    <button class=\"ghost sm\" id=\"saveTokenBtn\" style=\"margin-top:8px\">Check and save token<\/button>\n    <div id=\"agentTokenOut\"><\/div>\n\n    <label style=\"margin-top:18px\">Withdraw — send the agent's funds back to you<\/label>\n    <div class=\"grid2\">\n      <select id=\"wAsset\">\n        <option value=\"eth\">ETH<\/option>\n        <option value=\"token\">the target token<\/option>\n      <\/select>\n      <input id=\"wPassword\" type=\"password\" placeholder=\"keystore password\">\n    <\/div>\n    <input id=\"wTo\" class=\"mono\" style=\"margin-top:8px\" placeholder=\"destination (default: ${esc(ME || 'your wallet')})\">\n    <div class=\"grid2\" style=\"margin-top:8px\">\n      <button class=\"ghost sm\" id=\"wCheckBtn\">Check first<\/button>\n      <button class=\"ghost sm\" id=\"wSendBtn\">Withdraw everything<\/button>\n    <\/div>\n    <div id=\"wOut\"><\/div>`;\n  $('saveTokenBtn').onclick = saveAgentToken;\n  $('wCheckBtn').onclick = () => withdraw(false);\n  $('wSendBtn').onclick = () => withdraw(true);\n  if (AGENT.target_token) $('token').value = AGENT.target_token;\n  for (const f of AGENT.functions) {\n    const cb = $('on-' + f.function_id);\n    if (cb) cb.checked = !!f.enabled;\n  }\n}\n\n/**\n * Grava o novo token alvo. O servidor confere o endereço na chain antes de\n * aceitar, então o erro aparece aqui — antes de a pessoa assinar qualquer coisa\n * e descobrir na MetaMask que o contrato não conhece o token.\n */\nasync function saveAgentToken() {\n  const btn = $('saveTokenBtn');\n  const out = $('agentTokenOut');\n  const value = $('agentToken').value.trim();\n  btn.disabled = true; btn.textContent = 'checking on chain…';\n  out.innerHTML = '';\n  try {\n    const r = await api('PATCH', '/api/agents/' + AGENT.id, { token: value });\n    AGENT = r.agent;\n    $('token').value = r.agent.target_token || '';\n    const ti = r.tokenInfo;\n    out.innerHTML = value\n      ? `<div class=\"note ok\">Saved. ${ti?.erc20 ? esc((ti.erc20.symbol || '') + ' ' + (ti.erc20.name || '')) + ' — ' : ''}launched through pons ✓<\/div>`\n      : '<div class=\"note\">Target token cleared.<\/div>';\n  } catch (e) {\n    out.innerHTML = `<div class=\"note bad\">${esc(e.message)}<\/div>`;\n  }\n  btn.disabled = false; btn.textContent = 'Check and save token';\n}\n\n/**\n * Saque. `live=false` só calcula e mostra o que sairia; `live=true` envia.\n * O destino em branco significa a carteira conectada — devolver ao dono é o\n * caso normal, e digitar endereço à mão é onde se perde dinheiro.\n */\nasync function withdraw(live) {\n  const out = $('wOut');\n  const password = $('wPassword').value;\n  if (!password) { out.innerHTML = '<div class=\"note bad\">Enter the agent keystore password.<\/div>'; return; }\n\n  const asset = $wValue('wAsset');\n  const to = $('wTo').value.trim() || undefined;\n\n  if (live && !confirm(\n    `Send the agent's entire ${asset === 'eth' ? 'ETH balance' : 'token balance'} to ` +\n    `${to || ME}?\\n\\nThis is a real transaction on chain.`\n  )) return;\n\n  const btn = live ? $('wSendBtn') : $('wCheckBtn');\n  const label = btn.textContent;\n  btn.disabled = true; btn.textContent = live ? 'sending…' : 'checking…';\n  try {\n    const r = await api('POST', `/api/agents/${AGENT.id}/withdraw`, { password, asset, to, live });\n    $('wPassword').value = '';\n    out.innerHTML = r.dryRun\n      ? `<div class=\"note\">Would send ${esc(fmtAmount(r, asset))} to <span class=\"mono\">${esc(r.to)}<\/span>` +\n        `${r.gasCost ? ' — gas up to ' + eth(r.gasCost) + ' ETH' : ''}. Nothing sent yet.<\/div>`\n      : `<div class=\"note ok\">Sent ${esc(fmtAmount(r, asset))} to <span class=\"mono\">${esc(r.to)}<\/span><br>` +\n        `<span class=\"mono\">${esc(r.hash || '')}<\/span><\/div>`;\n    if (!r.dryRun) await selectAgent(AGENT.id);\n  } catch (e) {\n    out.innerHTML = `<div class=\"note bad\">${esc(e.message)}<\/div>`;\n  }\n  btn.disabled = false; btn.textContent = label;\n}\n\nconst $wValue = (id) => $(id).value;\nconst fmtAmount = (r, asset) => asset === 'eth' ? eth(r.amount) + ' ETH' : r.amount + ' units';\n\n// ---------------------------------------------------------------- funções\n\nfunction renderFunctions() {\n  $('functions').innerHTML = CONFIG.functions.map((f) => `\n    <div class=\"fn\" id=\"fn-${f.id}\">\n      <div class=\"fn-head\" onclick=\"toggleFn('${f.id}')\">\n        <input type=\"checkbox\" style=\"width:auto\" id=\"on-${f.id}\" onclick=\"event.stopPropagation()\">\n        <strong>${esc(f.label)}<\/strong>\n        ${f.needsDelegation ? '<span class=\"tag\">delegation<\/span>' : ''}\n        ${f.needsCapital ? '<span class=\"tag\">capital<\/span>' : ''}\n      <\/div>\n      <p>${esc(f.description)}<\/p>\n      <div class=\"fn-body\"><div class=\"grid2\">\n        ${Object.entries(f.params).map(([k,p]) => `\n          <div style=\"${p.type==='text'?'grid-column:1/-1':''}\">\n            <label>${esc(p.label)}<\/label>\n            ${p.type==='enum'\n              ? `<select id=\"p-${f.id}-${k}\">${p.options.map((o)=>`<option ${o===p.default?'selected':''}>${o}<\/option>`).join('')}<\/select>`\n              : p.type==='text'\n              ? `<textarea id=\"p-${f.id}-${k}\" placeholder=\"0xabc…,1000&#10;0xdef…,2500\"><\/textarea>`\n              : p.type==='bool'\n              ? `<select id=\"p-${f.id}-${k}\"><option value=\"true\">yes<\/option><option value=\"false\">no<\/option><\/select>`\n              : `<input id=\"p-${f.id}-${k}\" value=\"${esc(p.default)}\">`}\n          <\/div>`).join('')}\n      <\/div><\/div>\n    <\/div>`).join('');\n}\nwindow.toggleFn = (id) => $('fn-'+id).classList.toggle('open');\n\nfunction renderBanners() {\n  const parts = [];\n  if (CONFIG.maintenance?.on) {\n    parts.push(`<div class=\"banner\" style=\"background:#180f10;border-color:#5c2326;color:#eda9a5\">\n      <strong>Paused for maintenance.<\/strong> ${esc(CONFIG.maintenance.reason || 'Creating agents and running executions are on hold.')}\n      Reading your agents and exporting keystores still works.<\/div>`);\n  }\n  if (CONFIG.beta) {\n    parts.push(`<div class=\"banner\">\n      <strong>Early access.<\/strong> On-chain execution is new here and has seen little\n      real-world use. ${CONFIG.liveExecution\n        ? `Do not deposit more than you are willing to lose — around ${esc(CONFIG.depositAdviceEth)} ETH is a sensible ceiling while this is being proven.`\n        : 'Sending transactions is currently switched off on this server: the agent will analyse and propose, but nothing moves on chain.'}\n      <\/div>`);\n  }\n  $('betaBanner').innerHTML = parts.join('');\n}\n\n$('runBtn').onclick = async () => {\n  const b = $('runBtn');\n  b.disabled = true; b.textContent = 'running…';\n  try {\n    for (const f of CONFIG.functions) {\n      const params = {};\n      for (const k of Object.keys(f.params)) {\n        const el = $(`p-${f.id}-${k}`);\n        if (el) params[k] = el.value;\n      }\n      await api('POST', `/api/agents/${AGENT.id}/functions`,\n        { functionId: f.id, enabled: $('on-'+f.id).checked, params });\n    }\n    renderResult(await api('POST', `/api/agents/${AGENT.id}/run`, { persist: true }));\n  } catch (e) {\n    $('result').innerHTML = `<div class=\"note bad\">${esc(e.message)}<\/div>`;\n  }\n  b.disabled = false; b.textContent = 'Run agent (simulation)';\n};\n\nfunction renderResult(out) {\n  const s = out.state;\n  const supply = s.supply ? `\n    <div class=\"kv\"><span>circulating supply<\/span><span>${eth(s.supply.circulating)}<\/span><\/div>\n    <div class=\"kv\"><span>already burned<\/span><span>${eth(s.supply.burned)}<\/span><\/div>` : '';\n  const head = `\n    <div class=\"kv\"><span>token<\/span><span class=\"mono\">${esc(s.symbol || out.token)}<\/span><\/div>\n    <div class=\"kv\"><span>price<\/span><span>${eth(s.pricePair)} ETH<\/span><\/div>\n    <div class=\"kv\"><span>graduated<\/span><span>${s.graduated ? 'yes' : 'no'}<\/span><\/div>\n    <div class=\"kv\"><span>agent balance<\/span><span>${eth(s.balances.eth)} ETH<\/span><\/div>\n    ${supply}<div style=\"height:16px\"><\/div>`;\n\n  const blocks = out.results.map((r) => {\n    if (r.error) return `<div class=\"note bad\"><strong>${esc(r.functionId)}<\/strong> — ${esc(r.error)}<\/div>`;\n    const notes = (r.notes||[]).map((n)=>`<div class=\"note\">${esc(n)}<\/div>`).join('');\n    const decs = (r.decisions||[]).map((d) => {\n      const v = d.verdict;\n      const tag = v.violations.length ? 'bad' : (v.needsApproval ? 'warn' : 'ok');\n      const txt = v.violations.length ? 'blocked' : (v.needsApproval ? 'awaiting approval' : 'approved');\n      return `<div class=\"dec\">\n        <div class=\"dec-head\"><strong>${esc(d.decision.kind)}<\/strong><span class=\"tag ${tag}\">${txt}<\/span><\/div>\n        <p style=\"margin-top:6px;font-size:12px;color:var(--dim)\">${esc(d.decision.rationale)}<\/p>\n        <div class=\"kv\" style=\"margin-top:8px\"><span>notional<\/span><span>${eth(d.decision.notionalWei)} ETH<\/span><\/div>\n        <div class=\"kv\"><span>impact<\/span><span>${(d.decision.priceImpactBps/100).toFixed(2)}%<\/span><\/div>\n        ${v.violations.map((x)=>`<div class=\"note bad\">${esc(x)}<\/div>`).join('')}\n        ${!v.violations.length && v.needsApproval\n          ? `<button class=\"ghost sm\" style=\"margin-top:10px\" onclick=\"approve(${d.id})\">Approve<\/button>` : ''}\n        ${!v.violations.length ? `<div id=\"exec-${d.id}\"><\/div>` : ''}\n      <\/div>`;\n    }).join('');\n    return `<div style=\"margin-bottom:20
