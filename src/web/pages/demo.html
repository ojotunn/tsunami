der-radius:14px;padding:22px;\r\n        transition:border-color .18s,transform .18s;position:relative;overflow:hidden}\r\n  .card:hover{border-color:rgba(34,180,255,.45);transform:translateY(-2px)}\r\n  .card .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;\r\n    background:rgba(34,180,255,.1);border:1px solid rgba(34,180,255,.25);margin-bottom:16px}\r\n  .card .ic svg{width:20px;height:20px;stroke:var(--hi);fill:none;stroke-width:1.8;\r\n    stroke-linecap:round;stroke-linejoin:round}\r\n  .card h3{font-size:17px;margin-bottom:8px;font-weight:700;letter-spacing:-.01em}\r\n  .card p{color:var(--dim);font-size:14.5px}\r\n  .card .tag2{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;\r\n    text-transform:uppercase;color:var(--dim);border:1px solid var(--line);border-radius:999px;\r\n    padding:3px 10px;margin-top:16px}\r\n\r\n  .steps{counter-reset:s;display:grid;gap:16px;\r\n         grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}\r\n  .step{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}\r\n  .step::before{counter-increment:s;content:\"0\" counter(s);\r\n    font:800 13px/1 ui-monospace,SFMono-Regular,Menlo,monospace;\r\n    display:inline-block;padding:6px 9px;border-radius:8px;margin-bottom:14px;\r\n    background:var(--grad);color:#02111f;letter-spacing:.06em}\r\n  .step h3{font-size:16px;margin-bottom:6px;font-weight:700}\r\n  .step p{color:var(--dim);font-size:14px}\r\n\r\n  /* --- pons v2: o fluxo do dinheiro --------------------------------------- */\r\n  .flow{display:grid;grid-template-columns:repeat(4,1fr);gap:0;align-items:stretch;\r\n        border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel)}\r\n  .flow div{padding:22px;border-right:1px solid var(--line);position:relative}\r\n  .flow div:last-child{border-right:0}\r\n  .flow div::after{content:\"→\";position:absolute;right:-9px;top:50%;transform:translateY(-50%); [open] summary::after{content:\"−\"}\r\n  details p{color:var(--dim);font-size:14.5px;padding:0 0 18px;max-width:78ch}\r\n\r\n  .final{text-align:center;padding:96px 0}\r\n  .final h2{margin-bottom:14px}\r\n  .final .cta{justify-content:center}\r\n\r\n  footer{padding:48px 0 64px;color:var(--dim);font-size:13px}\r\n  footer p{max-width:78ch;margin-bottom:10px}\r\n  footer .links a{margin-right:14px}\r\n\r\n  @media (max-width:900px){\r\n    header .wrap{grid-template-columns:1fr}\r\n    .visual{min-height:0}\r\n    .visual .crystal{display:none}\r\n    .panel{margin-left:0;margin-top:8px;max-width:100%}\r\n    .flow{grid-template-columns:1fr}\r\n    .flow div{border-right:0;border-bottom:1px solid var(--line)}\r\n    .flow div::after{display:none}\r\n    nav .links{display:none}\r\n    nav .btn{padding:9px 14px;font-size:13px}\r\n    nav .xlink a{padding:9px 10px}\r\n    nav .xlink .hd{display:none}\r\n  }\r\n  @media (max-width:480px){\r\n    nav .wrap{gap:10px;padding:0 16px}\r\n    .brand{font-size:15px;gap:8px}\r\n    .brand img{width:26px;height:26px}\r\n    nav .btn{padding:8px 11px;font-size:12.5px}\r\n  }\r\n  @media (max-width:760px){\r\n    header{padding:60px 0 56px}\r\n    section{padding:60px 0}\r\n    .stat{border-right:0;border-bottom:1px solid var(--line)}\r\n  }\r\n<\/style>\r\n<\/head>\r\n<body>\r\n\r\n<nav><div class=\"wrap\">\r\n  <a class=\"brand\" href=\"/\"><img src=\"/assets/brand-64.png?v={{ASSETS_V}}\" alt=\"\" width=\"30\" height=\"30\">{{BRAND_HTML}}<\/a>\r\n  <div class=\"links\">\r\n    <a href=\"#functions\">Functions<\/a>\r\n    <a href=\"#how\">How it works<\/a>\r\n    <a href=\"#v2\">pons v2<\/a>\r\n    <a href=\"#safety\">Safety<\/a>\r\n    <a href=\"#faq\">FAQ<\/a>\r\n  <\/div>\r\n  <div class=\"sp\"><\/div>\r\n  <span class=\"xlink\">{{SOCIAL_NAV}}<\/span>\r\n  <a class=\"btn\" href=\"/app\">Open the app<\/a>\r\n<\/div><\/nav>\r\n\r\n<header>\r\n  <div class=\"wrap\">\r\n    <div>\r\n      <div class=\"eyebrow\"><i><\/i>AI agents for pons tokens · Robinhood Chain<\/div>\r\n      <h1>Every tool your token needs to grow. <span class=\"grad-text\">One click.<\/span><\/h1>\r\n      <p class=\"lead\">\r\n        Buyback and burn, creator-reward compounding, scheduled buys, dip buying and airdrops —\r\n        run around the clock by an AI agent you control from a single panel.\r\n      <\/p>\r\n      <div class=\"cta\">\r\n        <a class=\"btn\" href=\"/app\">Launch your agent →<\/a>\r\n        <a class=\"btn ghost\" href=\"#how\">See how it works<\/a>\r\n      <\/div>\r\n      <div class=\"trust\">\r\n        <span>No private key, ever<\/span>\r\n        <span>Withdraw any time<\/span>\r\n        <span>Every action simulated first<\/span>\r\n      <\/div>\r\n      {{TOKEN_BADGE}}\r\n    <\/div>\r\n\r\n    <div class=\"visual\" aria-hidden=\"true\">\r\n      <div class=\"panel\">\r\n        <div class=\"ph\"><i><\/i><b>Agent · live<\/b><span style=\"margin-left:auto\">pons v2 · bonding curve<\/span><\/div>\r\n        <div class=\"dec\"><strong>Buyback &amp; burn<\/strong><span class=\"tag ok\">approved<\/span>\r\n          <small>0.005 ETH · price impact 0.10% · burned on arrival<\/small><\/div>\r\n        <div class=\"dec\"><strong>Creator rewards<\/strong><span class=\"tag run\">collecting<\/span>\r\n          <small>0.0034 ETH claimable in the fee escrow → buy &amp; burn<\/small><\/div>\r\n        <div class=\"dec\"><strong>Scheduled buy<\/strong><span class=\"tag wait\">in 42 min<\/span>\r\n          <small>0.002 ETH every 4 h · budget 0.05 ETH remaining<\/small><\/div>\r\n        <div class=\"cap\">Illustration · the panel you get after connecting<\/div>\r\n      <\/div>\r\n    <\/div>\r\n  <\/div>\r\n<\/header>\r\n\r\n<div class=\"strip\"><div class=\"wrap\">\r\n  <div class=\"stat\"><b>6<\/b><span>functions, on or off with one click<\/span><\/div>\r\n  <div class=\"stat\"><b>2<\/b><span>checks before every action: protocol limits and your own policy<\/span><\/div>\r\n  <div class=\"stat\"><b>0<\/b><span>dependencies — every line that touches a key is in the repo<\/span><\/div>\r\n  <div class=\"stat\"><b>v1 + v2<\/b><span>every pons launch, bonding curve included<\/span><\/div>\r\n<\/div><\/div>\r\n\r\n<section id=\"functions\"><div class=\"wrap\">\r\n  <div class=\"lbl\">Functions<\/div>\r\n  <h2>Six ways to keep your chart honest<\/h2>\r\n  <p class=\"sub\">Turn on only what you need. Every function clears two checks before it becomes an\r\n     action: the protocol's own limits, and the risk policy you set yourself.<\/p>\r\n  <div class=\"grid\">\r\n    <div class=\"card\">\r\n      <div class=\"ic\"><svg viewBox=\"0 0 24 24\"><path d=\"M12 3c2 4 6 6 6 11a6 6 0 0 1-12 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4 1-7 2-10z\"/><\/svg><\/div>\r\n      <h3>Buyback &amp; burn<\/h3>\r\n      <p>A standing bid under your token. The agent buys — on the bonding curve or in the pool —\r\n         and sends straight to the burn address, so circulating supply only goes one way.<\/p>\r\n      <span class=\"tag2\">your deposit<\/span>\r\n    <\/div>\r\n    <div class=\"card\">\r\n      <div class=\"ic\"><svg viewBox=\"0 0 24 24\"><path d=\"M4 14l4-4 4 4 5-6\"/><path d=\"M14 8h3v3\"/><path d=\"M4 20h16\"/><\/svg><\/div>\r\n      <h3>Creator rewards → burn<\/h3>\r\n      <p>The one that pays for itself. Your creator fees collect themselves and come back as buy\r\n         pressure — funded entirely by fees you already earned. One signature to enable.<\/p>\r\n      <span class=\"tag2\">launch wallet · one signature<\/span>\r\n    <\/div>\r\n    <div class=\"card\">\r\n      <div class=\"ic\"><svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"8\"/><path d=\"M12 8v4l3 2\"/><\/svg><\/div>\r\n      <h3>Scheduled buys<\/h3>\r\n      <p>A fixed amount on the interval you choose, with a hard budget and a per-order impact\r\n         cap. The panel tells you upfront what that cadence costs in fees for a year.<\/p>\r\n      <span class=\"tag2\">your deposit<\/span>\r\n    <\/div>\r\n    <div class=\"card\">\r\n      <div class=\"ic\"><svg viewBox=\"0 0 24 24\"><path d=\"M4 6l5 7 3-3 4 5 4-4\"/><path d=\"M16 11h4v4\"/><\/svg><\/div>\r\n      <h3>Dip buying<\/h3>\r\n      <p>Be the bid when everyone else is asleep. Triggers on a fall from the recent high — not\r\n         from the last price — so ordinary noise never spends your money.<\/p>\r\n      <span class=\"tag2\">your deposit<\/span>\r\n    <\/div>\r\n    <div class=\"card\">\r\n      <div class=\"ic\"><svg viewBox=\"0 0 24 24\"><path d=\"M12 4v10\"/><path d=\"M8 10l4 4 4-4\"/><path d=\"M5 19h14\"/><\/svg><\/div>\r\n      <h3>Airdrops that reach real people<\/h3>\r\n      <p>Send to your own list, or straight to your actual on-chain holders read live from the\r\n         chain. Addresses, duplicates and the per-wallet cap are checked before anything moves.<\/p>\r\n      <span class=\"tag2\">your tokens<\/span>\r\n    <\/div>\r\n    <div class=\"card\">\r\n      <div class=\"ic\"><svg viewBox=\"0 0 24 24\"><rect x=\"4\" y=\"5\" width=\"16\" height=\"14\" rx=\"2\"/><path d=\"M8 13l2-2 2 2 3-4\"/><\/svg><\/div>\r\n      <h3>Dashboard and audit trail<\/h3>\r\n      <p>Price, liquidity, graduation progress, real circulating supply, and every decision the\r\n         agent ever proposed — including the ones your own rules blocked.<\/p>\r\n      <span class=\"tag2\">read only<\/span>\r\n    <\/div>\r\n  <\/div>\r\n<\/div><\/section>\r\n\r\n<section id=\"how\" class=\"alt\"><div class=\"wrap\">\r\n  <div class=\"lbl\">How it works<\/div>\r\n  <h2>Running in under five minutes<\/h2>\r\n  <p class=\"sub\">Four steps. Not one of them asks for your private key.<\/p>\r\n  <div class=\"steps\">\r\n    <div class=\"step\">\r\n      <h3>Connect any wallet<\/h3>\r\n      <p>Sign a plain-text message to prove the address is yours. Signing moves no funds and\r\n         authorizes no transaction. You do not need to be the token's creator.<\/p>\r\n    <\/div>\r\n    <div class=\"step\">\r\n      <h3>Point it at a token<\/h3>\r\n      <p>Paste the contract of any pons token — yours or not. You get a brand-new dedicated\r\n         wallet for the agent, encrypted with your own password. It can only move what you send it.<\/p>\r\n    <\/div>\r\n    <div class=\"step\">\r\n      <h3>Fund it<\/h3>\r\n      <p>Deposit only what you are willing to put to work, and withdraw it any time. If the token\r\n         is yours, one extra signature also points your creator rewards at the agent.<\/p>\r\n    <\/div>\r\n    <div class=\"step\">\r\n      <h3>Pick your functions and watch<\/h3>\r\n      <p>Every proposal shows the reasoning, the price impact and the verdict from both checks.\r\n         On the default setting, nothing moves without your approval.<\/p>\r\n    <\/div>\r\n  <\/div>\r\n<\/div><\/section>\r\n\r\n<section id=\"v2\"><div class=\"wrap\">\r\n  <div class=\"lbl\">Built for pons v2<\/div>\r\n  <h2>From the bonding curve to the burn address, automatically<\/h2>\r\n  <p class=\"sub\">A pons v2 launch trades on a bonding curve and pays its creator through a fee escrow.\r\n     The agent speaks both, and a v1 token still works exactly as before.<\/p>\r\n  <div class=\"flow\">\r\n    <div><small>01 · Curve<\/small><b>Fees accrue on the curve<\/b><p>Every buy and sell on your launch charges a fee. Part of it is yours.<\/p><\/div>\r\n    <div><small>02 · Escrow<\/small><b>Swept into the fee escrow<\/b><p>The agent sweeps the curve and claims your balance — no key of yours involved.<\/p><\/div>\r\n    <div><small>03 · Agent<\/small><b>Buys on the curve<\/b><p>One transaction, ETH in, tokens out, at the price the contract itself quotes.<\/p><\/div>\r\n    <div><small>04 · Burn<\/small><b>Sent to 0x…dEaD<\/b><p>Bought tokens leave circulation. The dashboard shows the real supply.<\/p><\/div>\r\n  <\/div>\r\n  <p class=\"note\">After graduation a v2 token trades on Uniswap v4. Reward collection keeps working there;\r\n     buying on the v4 pool is on the roadmap, and until then the agent says so instead of guessing.<\/p>\r\n<\/div><\/section>\r\n\r\n{{FEE_FLOW}}\r\n\r\n<section id=\"safety\"><div class=\"wrap\">\r\n  <div class=\"lbl\">Safety<\/div>\r\n  <h2>Built like something that holds money<\/h2>\r\n  <p class=\"sub\">The rules below are not settings. They are how the code is written.<\/p>\r\n  <div class=\"safety\">\r\n    <div><b>Your key never leaves your wallet<\/b><p>You sign a message to log in and, if you are the creator, one transaction to delegate rewards. That is all the app ever asks you to sign.<\/p><\/div>\r\n    <div><b>Nothing is sent without a simulation<\/b><p>Every transaction runs through the node first. If it would revert, it is not sent and no gas is spent.<\/p><\/div>\r\n    <div><b>Withdrawing is always open<\/b><p>Maintenance mode, live-execution lock, risk policy — none of them apply to taking your own money out.<\/p><\/div>\r\n    <div><b>Every fee is on screen before you approve<\/b><p>The service fee is charged in ETH only, shown per action, and never taken from your tokens. Withdrawals and airdrops are free.<\/p><\/div>\r\n  <\/div>\r\n<\/div><\/section>\r\n\r\n<section id=\"faq\"><div class=\"wrap\">\r\n  <div class=\"lbl\">FAQ<\/div>\r\n  <h2>Questions people ask before depositing<\/h2>\r\n  <p class=\"sub\">Short answers. The long ones are in the terms.<\/p>\r\n  <details><summary>Do I need to be the token's creator?<\/summary>\r\n    <p>No. Buybacks, scheduled buys, dip buying and airdrops work for any pons token. Only creator-reward collection needs the creator's signature, because only the creator can hand those fees to the agent.<\/p><\/details>\r\n  <details><summary>Where is the agent's wallet, and who controls it?<\/summary>\r\n    <p>The agent gets its own wallet, generated on the server and encrypted with a password only you know. You can export the keystore or withdraw everything at any moment. It never has access to your main wallet.<\/p><\/details>\r\n  <details><summary>Does anything happen without my approval?<\/summary>\r\n    <p>By default, no. The agent proposes; you approve. You can raise the auto-approval threshold in the risk policy once you trust it — and lower it back any time.<\/p><\/details>\r\n  <details><summary>Does burning change the total supply?<\/summary>\r\n    <p>No. The pons token has no burn function, so burned tokens sit at 0x…dEaD forever. Total supply stays the same; the dashboard reports circulating supply separately so the number you publish holds up.<\/p><\/details>\r\n  <details><summary>What does it cost?<\/summary>\r\n    <p>Gas, plus a service fee shown on screen before every action, charged in ETH on what the agent spends or collects. Withdrawing is free. On this instance the fee is not kept: it goes to a public treasury that buys back and burns the house token — see \"Where the fee goes\" above.<\/p><\/details>\r\n<\/div><\/section>\r\n\r\n<section class=\"final\"><div class=\"wrap\">\r\n  <div class=\"lbl\">Get started<\/div>\r\n  <h2>Put your token to work tonight<\/h2>\r\n  <p class=\"sub\" style=\"margin-left:auto;margin-right:auto\">Sign in with your wallet, paste a contract address, fund the agent. Five minutes.<\/p>\r\n  <div class=\"cta\"><a class=\"btn\" href=\"/app\">Launch your agent →<\/a><\/div>\r\n<\/div><\/section>\r\n\r\n<footer><div class=\"wrap\">\r\n  <p><strong style=\"color:var(--tx)\">None of this is financial advice.<\/strong>\r\n     Fixed-supply tokens in a single pool are highly volatile. Buybacks and burns do not\r\n     guarantee price — pons's own documentation says as much. Providing liquidity can\r\n     lose more than the fees it earns.<\/p>\r\n  <p>Providing liquidity or running systematic buybacks may be a regulated activity\r\n     depending on your jurisdiction and volume. Worth talking to a lawyer before you\r\n     scale. If your token runs programmatic buybacks, disclosing that publicly is what\r\n     separates a transparent treasury from a manipulation complaint.<\/p>\r\n  <p class=\"links\" style=\"margin-top:18px\">{{BRAND}} · open source, zero dependencies ·\r\n     {{SOCIAL}}\r\n     <a href=\"/terms\">terms and risks<\/a>\r\n     <a href=\"https://docs.ponsfamily.com/docs/v2\">pons v2 docs<\/a><\/p>\r\n<\/div><\/footer>\r\n\r\n<\/body>\r\n<\/html>\r\n", app: "<!doctype html>\r\n<html lang=\"en\">\r\n<head>\r\n<meta charset=\"utf-8\">\r\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\r\n<title>{{BRAND}} · app<\/title>\r\n<link rel=\"icon\" href=\"/assets/brand-32.png?v={{ASSETS_V}}\" sizes=\"32x32\">\r\n<link rel=\"apple-touch-icon\" href=\"/assets/brand-180.png?v={{ASSETS_V}}\">\r\n<style>\r\n  :root{\r\n    --bg:#070B13; --panel:#0E1626; --panel-2:#121C2F; --line:#1B2842;\r\n    --tx:#EAF2FF; --dim:#8DA0BD; --accent:#22B4FF; --ok:#3fb950;\r\n    --warn:#e3b341; --bad:#f85149;\r\n    /* Extremos do degrade da marca, os mesmos do arquivo SVG do cristal. */\r\n    --accent-hi:#62EDFF; --accent-lo:#0B5FEE;\r\n  }\r\n  *{box-sizing:border-box;margin:0;padding:0}\r\n  body{background:var(--bg);color:var(--tx);\r\n       font:14px/1.6 ui-sans-serif,-apple-system,\"Segoe UI\",Roboto,sans-serif}\r\n  a{color:var(--accent);text-decoration:none}\r\n  nav{border-bottom:1px solid var(--line);height:60px;display:flex;align-items:center;\r\n      gap:14px;padding:0 26px;position:sticky;top:0;background:rgba(11,14,19,.94);\r\n      backdrop-filter:blur(8px);z-index:20}\r\n  .logo{font-weight:700;letter-spacing:-.02em;font-size:16px;\r\n        display:flex;align-items:center;gap:9px}\r\n  .logo img{width:24px;height:24px;display:block}\r\n  .logo span{color:var(--accent)}\r\n  .sp{flex:1}\r\n  .chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--panel-2);\r\n        color:var(--dim);border:1px solid var(--line)}\r\n  .chip.ok{color:var(--ok);border-color:#1f4529}\r\n  .chip.bad{color:var(--bad);border-color:#5c2326}\r\n  button{background:var(--accent);color:#04101f;border:0;border-radius:8px;padding:9px 16px;\r\n         font:inherit;font-size:13px;font-weight:600;cursor:pointer}\r\n  button.ghost{background:transparent;color:var(--tx);border:1px solid var(--line);font-weight:500}\r\n  button.sm{padding:6px 12px;font-size:12px}\r\n  button:disabled{opacity:.4;cursor:not-allowed}\r\n\r\n  /* --- bloco de execucao, na linguagem da landing ------------------------\r\n     Uma acao principal so. O resto — a acao secundaria e o trancar — vira\r\n     link de texto, para nada competir com o botao que gasta dinheiro. */\r\n  .runbar{margin-top:4px}\r\n  .runbar .rule{height:2px;width:38px;border-radius:2px;margin:18px 0 14px;\r\n    background:linear-gradient(90deg,var(--accent-hi),var(--accent-lo))}\r\n  .runbar #runBtn{background:linear-gradient(135deg,var(--accent-hi),var(--accent-lo));\r\n    color:#00171c;font-size:13.5px;padding:10px 20px}\r\n  .cap{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);\r\n    margin-bottom:7px}\r\n  .linky{background:none;border:0;padding:0;margin-left:14px;color:var(--dim);\r\n    font:inherit;font-size:12.5px;cursor:pointer;text-decoration:underline;\r\n    text-underline-offset:3px}\r\n  .linky:hover{color:var(--accent)}\r\n  .linky:disabled{opacity:.4;cursor:not-allowed}\r\n  .state{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--dim);\r\n    margin-bottom:13px}\r\n  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:0 0 7px}\r\n  .warnline{border-left:2px solid var(--accent);padding-left:12px;color:var(--dim);\r\n    font-size:12px;margin-top:16px;max-width:58ch}\r\n\r\n  main{max-width:1220px;margin:0 auto;padding:26px 26px 90px;\r\n       display:grid;grid-template-columns:330px 1fr;gap:22px;align-items:start}\r\n  @media(max-width:940px){main{grid-template-columns:1fr}}\r\n  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;\r\n        padding:20px;margin-bottom:18px}\r\n  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);\r\n           margin-bottom:14px;font-weight:600}\r\n  label{display:block;font-size:12px;color:var(--dim);margin:12px 0 5px}\r\n  input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);\r\n    border-radius:7px;padding:9px 11px;font:inherit;font-size:13px}\r\n  textarea{min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:12px;resize:vertical}\r\n  .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}\r\n  .addr{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:11px;margin-top:10px}\r\n  .kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;\r\n      border-bottom:1px solid var(--line);font-size:13px}\r\n  .kv:last-child{border:0}\r\n  .kv span:first-child{color:var(--dim)}\r\n  .fn{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:11px;background:var(--panel-2)}\r\n  .fn-head{display:flex;align-items:center;gap:11px;cursor:pointer}\r\n  .fn-head strong{font-size:13px;flex:1}\r\n  .fn p{margin-top:6px;color:var(--dim);font-size:12px}\r\n  .fn-body{display:none;margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}\r\n  .fn.open .fn-body{display:block}\r\n  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}\r\n  .note{font-size:12px;color:var(--dim);padding:8px 11px;background:var(--panel-2);\r\n        border-left:2px solid var(--line);border-radius:0 6px 6px 0;margin:6px 0}\r\n  .note.warn{border-left-color:var(--warn);color:#e0c07a}\r\n  .note.bad{border-left-color:var(--bad);color:#f0a8a4}\r\n  .note.ok{border-left-color:var(--ok);color:#93d6a4}\r\n  .dec{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;background:var(--panel-2)}\r\n  .dec-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}\r\n  .tag{font-size:11px;padding:2px 9px;border-radius:999px;background:#20262e;color:var(--dim)}\r\n  .tag.ok{background:#12261a;color:var(--ok)} .tag.bad{background:#2b1618;color:var(--bad)}\r\n  .tag.warn{background:#2a2314;color:var(--warn)}\r\n  .empty{color:var(--dim);font-size:13px;padding:26px;text-align:center}\r\n  .banner{background:#1a1408;border:1px solid #3d2f10;color:#e0c07a;border-radius:12px;\r\n          padding:14px 17px;margin-bottom:18px;font-size:13px}\r\n  .banner code{background:rgba(0,0,0,.3);padding:1px 5px;border-radius:4px}\r\n  .gate{max-width:520px;margin:80px auto;text-align:center}\r\n  .gate h1{font-size:24px;letter-spacing:-.02em;margin-bottom:12px}\r\n  .gate p{color:var(--dim);margin-bottom:24px}\r\n<\/style>\r\n<script>\n(function () {\n  'use strict';\n\n  // ===== código real do projeto, embutido =====\n  // Matemática de preço e profundidade para pools Uniswap V3.\r\n// Convenção: sqrtPriceX96 = sqrt(token1/token0) * 2^96, em unidades brutas.\r\n\r\n\r\nconst Q96 = 2n ** 96n;\r\nconst Q192 = 2n ** 192n;\r\nconst SCALE = 10n ** 18n;                       // precisão fixa interna (18 casas)\r\n\r\nconst pow10 = (n) => 10n ** BigInt(n);\r\n\r\n/**\r\n * Preço de token1 em token0 (unidades humanas), com 18 casas de precisão.\r\n * @returns {bigint} preço * 1e18\r\n */\r\nfunction priceToken1PerToken0(sqrtPriceX96, decimals0, decimals1) {\r\n  const sp = BigInt(sqrtPriceX96);\r\n  return (sp * sp * SCALE * pow10(decimals0)) / (Q192 * pow10(decimals1));\r\n}\r\n\r\n/**\r\n * Preço do token do lançamento denominado no token do par (ex.: WETH).\r\n * @returns {bigint} preço * 1e18\r\n */\r\nfunction tokenPriceInPair({ sqrtPriceX96, isToken0, tokenDecimals, pairDecimals }) {\r\n  if (isToken0) return priceToken1PerToken0(sqrtPriceX96, tokenDecimals, pairDecimals);\r\n  const p = priceToken1PerToken0(sqrtPriceX96, pairDecimals, tokenDecimals);\r\n  if (p === 0n) return 0n;\r\n  return (SCALE * SCALE) / p;\r\n}\r\n\r\n/** Market cap em token do par, escalado por 1e18. */\r\nconst marketCapInPair = (priceScaled, totalSupply, tokenDecimals) =>\r\n  (priceScaled * BigInt(totalSupply)) / pow10(tokenDecimals);\r\n\r\n/** tick -> preço (float, só para exibição). */\r\nconst tickToPrice = (tick) => Math.pow(1.0001, Number(tick));\r\n/** preço -> tick mais próximo, alinhado ao tickSpacing. */\r\nfunction priceToTick(price, tickSpacing = 200) {\r\n  const raw = Math.log(price) / Math.log(1.0001);\r\n  return Math.round(raw / tickSpacing) * tickSpacing;\r\n}\r\n\r\n/** Direção do trade a partir de um evento Swap, conforme docs da Pons. */\r\nfunction swapSide({ amount0, amount1, isToken0 }) {\r\n  const pairSigned = isToken0 ? BigInt(amount1) : BigInt(amount0);\r\n  return pairSigned > 0n ? 'buy' : 'sell';   // par entrando no pool = compra do token\r\n}\r\n\r\n/** Valor absoluto do lado do par (quanto de WETH trocou de mãos). */\r\nconst swapPairVolume = ({ amount0, amount1, isToken0 }) => {\r\n  const v = isToken0 ? BigInt(amount1) : BigInt(amount0);\r\n  return v < 0n ? -v : v;\r\n};\r\n\r\n// ------------------------------------------------------- profundidade\r\n\r\n/**\r\n * Simula um swap assumindo liquidez L constante na faixa ativa.\r\n * Válido para as posições full-range criadas pela Pons; degrada se o preço\r\n * atravessar limites de faixa — por isso `crossedRangeRisk` é sinalizado.\r\n *\r\n * @param {'buy'|'sell'} side  buy = entra token do par, sai token do lançamento\r\n * @returns {{amountOut: bigint, sqrtPriceX96After: bigint, priceImpactBps: number}}\r\n */\r\nfunction simulateSwap({ sqrtPriceX96, liquidity, amountIn, side, isToken0, feePips = 10000 }) {\r\n  const L = BigInt(liquidity);\r\n  if (L === 0n) throw new Error('pool has no active liquidity');\r\n  const sp = BigInt(sqrtPriceX96);\r\n  const inAfterFee = (BigInt(amountIn) * BigInt(1_000_000 - feePips)) / 1_000_000n;\r\n\r\n  // \"token do par sobe de preço o token\" => o par é token1 quando o token é token0\r\n  const pairIsToken1 = isToken0;\r\n  const addingToken1 = side === 'buy' ? pairIsToken1 : !pairIsToken1;\r\n\r\n  let spAfter;\r\n  let amountOut;\r\n  if (addingToken1) {\r\n    // ΔY = L * Δ√P  =>  √P' = √P + ΔY/L\r\n    spAfter = sp + (inAfterFee * Q96) / L;\r\n    // ΔX = L * Q96 * (√P' - √P) / (√P' * √P)\r\n    amountOut = (L * Q96 * (spAfter - sp)) / (spAfter * sp);\r\n  } else {\r\n    // adicionando token0: √P' = 1 / (1/√P + ΔX/L)\r\n    const denom = (L * Q96) / sp + inAfterFee;\r\n    spAfter = (L * Q96) / denom;\r\n    amountOut = (L * (sp - spAfter)) / Q96;\r\n  }\r\n\r\n  const impact = sp === 0n ? 0 : Number(((spAfter > sp ? spAfter - sp : sp - spAfter) * 20000n) / sp);\r\n  return {\r\n    amountOut,\r\n    sqrtPriceX96After: spAfter,\r\n    priceImpactBps: impact,                  // aprox: 2 * Δ√P/√P em bps\r\n    crossedRangeRisk: impact > 2000,         // >20% de impacto: simulação pouco confiável\r\n  };\r\n}\r\n\r\n/**\r\n * Cotação de compra que sabe ONDE o token negocia. As funções de compra não\r\n * precisam saber se o token é V1 (pool V3) ou V2 (bonding curve): passam o\r\n * estado e o valor, e recebem a mesma forma de resposta nos dois casos.\r\n *\r\n * Um token V2 já graduado negocia numa pool Uniswap V4, que exige um router\r\n * com callback para ser operada. Este projeto não tem um; a resposta honesta\r\n * é recusar com o motivo, não devolver uma cotação de mentira.\r\n */\r\nfunction estimateBuy(state, amountIn) {\r\n  if (state.venue === 'v4') {\r\n    throw new Error('this launch has graduated to a Uniswap v4 pool, and buying there is not supported yet');\r\n  }\r\n  if (state.venue === 'curve') {\r\n    if (!state.curve) throw new Error('the bonding curve state was not read');\r\n    const q = quoteCurveBuy({ quoteIn: amountIn, ...state.curve });\r\n    return { amountOut: q.tokensOut, priceImpactBps: q.priceImpactBps, crossedRangeRisk: q.crossedRangeRisk, spent: q.spent, refund: q.refund };\r\n  }\r\n  return simulateSwap({\r\n    sqrtPriceX96: state.sqrtPriceX96, liquidity: state.liquidity, amountIn,\r\n    side: 'buy', isToken0: state.isToken0, feePips: state.poolFee ?? 10000,\r\n  });\r\n}\r\n\r\n/** Quanto do token do par é preciso para mover o preço em `bps`. */\r\nfunction pairAmountForMove({ sqrtPriceX96, liquidity, bps, isToken0 }) {\r\n  const sp = BigInt(sqrtPriceX96);\r\n  const L = BigInt(liquidity);\r\n  const target = sp + (sp * BigInt(bps)) / 20000n;      // Δ√P ≈ √P * bps/2 /10000\r\n  const delta = target - sp;\r\n  return isToken0 ? (L * delta) / Q96 : (L * Q96 * delta) / (target * sp);\r\n}\r\n\r\n// ------------------------------------------------------- formatação\r\n\r\nfunction formatUnits(value, decimals = 18, precision = 6) {\r\n  const v = BigInt(value);\r\n  const neg = v < 0n;\r\n  const abs = neg ? -v : v;\r\n  const base = pow10(decimals);\r\n  const int = abs / base;\r\n  let frac = (abs % base).toString().padStart(decimals, '0').slice(0, precision).replace(/0+$/, '');\r\n  return `${neg ? '-' : ''}${int}${frac ? '.' + frac : ''}`;\r\n}\r\n\r\nfunction parseUnits(text, decimals = 18) {\r\n  const [i, f = ''] = String(text).split('.');\r\n  return BigInt(i + f.padEnd(decimals, '0').slice(0, decimals));\r\n}\r\n\n  // Política de risco do agente. Tudo que a camada de execução puder fazer\r\n// precisa passar por aqui primeiro — o agente de IA propõe, a política decide.\r\n\r\n// Sem teto e sem aprovação por padrão. A pessoa põe o valor e roda o agente.\r\n//\r\n// A política já bloqueou uma compra real por um teto de 0,01 ETH por operação\r\n// que ninguém pediu, e depois de novo por um teto gravado na tela. A regra que\r\n// ficou: a política NÃO julga valor. Quem escolhe quanto gastar é quem\r\n// depositou. O que continua protegendo sem pedir licença é a reserva de gás —\r\n// sem ela a carteira não consegue nem sair de uma posição.\r\nconst NO_CAP = (1000n * 10n ** 18n).toString();   // 1000 ETH: na prática, sem teto\r\n\r\nconst DEFAULT_POLICY = {\r\n  // --- capital -----------------------------------------------------------\r\n  minFundingWei: '1000000000000000',      // 0.001 ETH mínimo para ativar\r\n  maxNotionalPerTradeWei: NO_CAP,         // não é avaliado; fica por compatibilidade\r\n  maxDailyNotionalWei: NO_CAP,            // idem\r\n  reserveGasWei: '2000000000000000',      // nunca gastar abaixo desta reserva\r\n\r\n  // --- risco de mercado --------------------------------------------------\r\n  maxSlippageBps: 100,\r\n  minPoolLiquidityWei: '0',               // sem mínimo: a pessoa escolheu o token\r\n  maxDrawdownBps: 2000,                   // 20% de queda do NAV pausa o agente\r\n  maxInventoryBps: 6000,                  // no máx. 60% do NAV no token\r\n\r\n  // --- ritmo -------------------------------------------------------------\r\n  maxTradesPerHour: 100000,               // sem teto de ritmo por padrão\r\n  minSecondsBetweenTrades: 0,\r\n\r\n  // --- governança --------------------------------------------------------\r\n  mode: 'auto',                           // 'auto' | 'propose' — sem aprovação por padrão\r\n  requireApprovalAboveWei: NO_CAP,        // em 'auto', nunca volta a pedir aval\r\n  allowedTokens: [],                      // vazio = qualquer token indexado\r\n  blockedTokens: [],\r\n  killSwitch: false,\r\n};\r\n\r\n/** wei -> ETH legível. Sem dependência: a política não importa nada de fora. */\r\nconst fmtEth = (wei) => {\r\n  const v = BigInt(wei);\r\n  const whole = v / 10n ** 18n;\r\n  const frac = (v % 10n ** 18n).toString().padStart(18, '0').replace(/0+$/, '');\r\n  return frac ? `${whole}.${frac}` : String(whole);\r\n};\r\n\r\nconst BIG_FIELDS = [\r\n  'minFundingWei', 'maxNotionalPerTradeWei', 'maxDailyNotionalWei',\r\n  'reserveGasWei', 'minPoolLiquidityWei', 'requireApprovalAboveWei',\r\n];\r\n\r\nfunction validatePolicy(policy) {\r\n  const p = { ...policy };\r\n  for (const f of BIG_FIELDS) {\r\n    if (p[f] === undefined) throw new Error(`incomplete policy: ${f}`);\r\n    p[f] = BigInt(p[f]).toString();\r\n  }\r\n  if (!['propose', 'auto'].includes(p.mode)) throw new Error(\"mode must be 'propose' or 'auto'\");\r\n  if (BigInt(p.maxNotionalPerTradeWei) > BigInt(p.maxDailyNotionalWei)) {\r\n    throw new Error('maxNotionalPerTradeWei cannot exceed maxDailyNotionalWei');\r\n  }\r\n  return p;\r\n}\r\n\r\n/**\r\n * Avalia uma decisão proposta pelo agente contra a política e o estado atual.\r\n * Retorna sempre uma lista de violações — vazia significa aprovado.\r\n */\r\nfunction evaluate(decision, ctx) {\r\n  const p = ctx.policy;\r\n  const v = [];\r\n\r\n  if (p.killSwitch) v.push('kill switch is on');\r\n  if (decision.notionalWei !== undefined) {\r\n    const n = BigInt(decision.notionalWei);\r\n    // Taxa de serviço, quando houver. Ausente = 0, e aí a conta inteira fica\r\n    // idêntica à de antes da taxa existir.\r\n    const fee = BigInt(decision.feeWei ?? 0);\r\n\r\n    // Os limites de notional continuam olhando SÓ o notional: taxa não é\r\n    // exposição de mercado, e somá-la aqui encolheria em silêncio o orçamento\r\n    // de todo agente já salvo.\r\n    // Valor NÃO é julgado aqui: a pessoa depositou e escolheu quanto gastar.\r\n    // maxNotionalPerTradeWei e maxDailyNotionalWei continuam existindo no\r\n    // objeto por compatibilidade com políticas já gravadas, e só isso.\r\n\r\n    // A reserva de gás, sim, olha a saída TOTAL de ETH. Ela existe para o\r\n    // agente sempre conseguir sair de uma posição, e a taxa também sai da\r\n    // carteira. Sem isso a decisão passaria na aprovação e só estouraria no\r\n    // meio da execução, com o WETH já embrulhado.\r\n    //\r\n    // Diz o número que resolve, não só que está errado. \"eat into the gas\r\n    // reserve\" deixa a pessoa adivinhando quanto cabe; o teto é uma subtração.\r\n    const balance = BigInt(ctx.ethBalanceWei ?? 0);\r\n    const reserve = BigInt(p.reserveGasWei);\r\n    if (balance - (n + fee) < reserve) {\r\n      const room = balance > reserve ? balance - reserve : 0n;\r\n      v.push(\r\n        `this would eat into the gas reserve — balance ${fmtEth(balance)} ETH minus the ` +\r\n        `${fmtEth(reserve)} ETH reserved for gas` +\r\n        (fee > 0n ? ` minus the ${fmtEth(fee)} ETH service fee` : '') +\r\n        ` leaves at most ${fmtEth(room)} ETH per trade` +\r\n        (room === 0n ? '. Deposit more ETH into the agent wallet.' : ''),\r\n      );\r\n    }\r\n  }\r\n  if (ctx.poolLiquidityWei !== undefined && BigInt(ctx.poolLiquidityWei) < BigInt(p.minPoolLiquidityWei)) {\r\n    v.push('pool liquidity below the minimum');\r\n  }\r\n  if (ctx.drawdownBps !== undefined && ctx.drawdownBps > p.maxDrawdownBps) v.push('maximum drawdown reached');\r\n  if (ctx.inventoryBps !== undefined && decision.side === 'buy' && ctx.inventoryBps > p.maxInventoryBps) {\r\n    v.push('token inventory above the cap');\r\n  }\r\n  // \"trades\" aqui significa operações ENVIADAS. Quem passa esse contador é o\r\n  // runner, e ele conta só decisões com status 'executed' — simular não gasta\r\n  // nada e não pode consumir cota.\r\n  if (ctx.tradesLastHour >= p.maxTradesPerHour) {\r\n    v.push(`hourly trade limit reached (${ctx.tradesLastHour} of ${p.maxTradesPerHour} executed in the last hour)`);\r\n  }\r\n  if (ctx.secondsSinceLastTrade !== undefined && ctx.secondsSinceLastTrade < p.minSecondsBetweenTrades) {\r\n    v.push('minimum interval between trades not met');\r\n  }\r\n  if (p.blockedTokens.map((t) => t.toLowerCase()).includes(String(decision.token).toLowerCase())) {\r\n    v.push('token is on the block list');\r\n  }\r\n  if (p.allowedTokens.length && !p.allowedTokens.map((t) => t.toLowerCase()).includes(String(decision.token).toLowerCase())) {\r\n    v.push('token is not on the allow list');\r\n  }\r\n\r\n  const needsApproval = p.mode === 'propose'\r\n    || (decision.notionalWei !== undefined && BigInt(decision.notionalWei) >= BigInt(p.requireApprovalAboveWei));\r\n\r\n  return { violations: v, approved: v.length === 0, needsApproval };\r\n}\r\n\r\n/**\r\n * Agentes criados antes carregam os padrões antigos gravados: teto de valor,\r\n * ritmo de 6 por hora, 2 minutos entre operações, profundidade mínima e modo\r\n * \"propose\". Isto levanta SÓ quem está exatamente nos valores antigos — um\r\n * valor que a pessoa escolheu de propósito fica como está. Roda no boot;\r\n * idempotente.\r\n */\r\nfunction liftLegacyCaps(db) {\r\n  const OLD = {\r\n    maxNotionalPerTradeWei: ['10000000000000000', NO_CAP],\r\n    maxDailyNotionalWei: ['100000000000000000', NO_CAP],\r\n    minPoolLiquidityWei: ['50000000000000000', '0'],\r\n    maxTradesPerHour: [6, 100000],\r\n    minSecondsBetweenTrades: [120, 0],\r\n    requireApprovalAboveWei: ['5000000000000000', NO_CAP],\r\n    mode: ['propose', 'auto'],\r\n  };\r\n  let lifted = 0;\r\n  for (const row of db.prepare('SELECT id, policy FROM agents').all()) {\r\n    let p;\r\n    try { p = JSON.parse(row.policy); } catch { continue; }\r\n    let changed = false;\r\n    for (const [k, [was, now]] of Object.entries(OLD)) {\r\n      if (p[k] === was) { p[k] = now; changed = true; }\r\n    }\r\n    if (changed) {\r\n      db.prepare('UPDATE agents SET policy = ? WHERE id = ?').run(JSON.stringify(p), row.id);\r\n      lifted += 1;\r\n    }\r\n  }\r\n  return lifted;\r\n}\r\n\r\n\n\n  const SPECS = [{\"id\":\"buyback_burn\",\"label\":\"Buyback & burn\",\"description\":\"Buys the token with the agent balance and sends it to the burn address.\",\"needsCapital\":true,\"needsDelegation\":false,\"params\":{\"amountEth\":{\"type\":\"decimal\",\"default\":\"0.005\",\"label\":\"ETH per run\"},\"minIntervalMinutes\":{\"type\":\"int\",\"default\":60,\"label\":\"Minimum interval between runs (min)\"},\"afterGraduation\":{\"type\":\"bool\",\"default\":false,\"label\":\"Only buy after the token graduates\"},\"useFullBalance\":{\"type\":\"bool\",\"default\":false,\"label\":\"Spend the whole balance instead of the amount above\"},\"burnAddress\":{\"type\":\"address\",\"default\":\"0x000000000000000000000000000000000000dEaD\",\"label\":\"Burn address\"}}},{\"id\":\"rewards_boost\",\"label\":\"Creator rewards → buyback & burn\",\"description\":\"Collects creator rewards, holds them in reserve, and after graduation puts 100% into buy and burn.\",\"needsCapital\":false,\"needsDelegation\":true,\"params\":{\"mode\":{\"type\":\"enum\",\"options\":[\"reserve_until_graduation\",\"burn_immediately\",\"collect_only\"],\"default\":\"reserve_until_graduation\",\"label\":\"What to do with rewards\"},\"deployPercent\":{\"type\":\"int\",\"default\":100,\"label\":\"% of rewards spent on buyback\"},\"minCollectWei\":{\"type\":\"decimal\",\"default\":\"0.002\",\"label\":\"Only collect above (ETH)\"},\"checkIntervalMinutes\":{\"type\":\"int\",\"default\":240,\"label\":\"Check interval (min)\"}}},{\"id\":\"dca\",\"label\":\"Scheduled buys (DCA)\",\"description\":\"Buys a fixed amount on a regular interval, with a per-order impact ceiling.\",\"needsCapital\":true,\"needsDelegation\":false,\"params\":{\"amountEth\":{\"type\":\"decimal\",\"default\":\"0.002\",\"label\":\"ETH per buy\"},\"intervalMinutes\":{\"type\":\"int\",\"default\":720,\"label\":\"Interval between buys (min)\"},\"totalBudgetEth\":{\"type\":\"decimal\",\"default\":\"0.1\",\"label\":\"Total program budget (ETH)\"},\"destination\":{\"type\":\"enum\",\"options\":[\"hold\",\"burn\"],\"default\":\"hold\",\"label\":\"Where bought tokens go\"}}},{\"id\":\"dip_buy\",\"label\":\"Dip buying\",\"description\":\"Buys when the price falls below its recent high by the percentage you choose.\",\"needsCapital\":true,\"needsDelegation\":false,\"params\":{\"dropPercent\":{\"type\":\"int\",\"default\":10,\"label\":\"Buy when the price falls this much (%)\"},\"amountEth\":{\"type\":\"decimal\",\"default\":\"0.002\",\"label\":\"How much ETH to spend each time\"},\"windowHours\":{\"type\":\"int\",\"default\":24,\"label\":\"Compare against the highest price of the last (hours)\"},\"cooldownMinutes\":{\"type\":\"int\",\"default\":180,\"label\":\"Wait at least this long between buys (minutes)\"},\"destination\":{\"type\":\"enum\",\"options\":[\"hold\",\"burn\"],\"default\":\"hold\",\"label\":\"Where the tokens go\"}}},{\"id\":\"airdrop\",\"label\":\"Airdrop\",\"description\":\"Distributes the token to a recipient list you provide.\",\"needsCapital\":false,\"needsDelegation\":false,\"params\":{\"recipientsCsv\":{\"type\":\"text\",\"default\":\"\",\"label\":\"List: address,amount per line\"},\"batchSize\":{\"type\":\"int\",\"default\":50,\"label\":\"Transfers per batch\"}}},{\"id\":\"holder_airdrop\",\"label\":\"Reward the holders\",\"description\":\"Distributes tokens to the real holders of your token, read from chain.\",\"needsCapital\":false,\"needsDelegation\":false,\"params\":{\"amountTokens\":{\"type\":\"decimal\",\"default\":\"0\",\"label\":\"Total to distribute (0 = whole balance)\"},\"mode\":{\"type\":\"enum\",\"options\":[\"equal\",\"proportional\"],\"default\":\"proportional\",\"label\":\"How to split\"},\"minHolderBalance\":{\"type\":\"decimal\",\"default\":\"1000\",\"label\":\"Minimum balance to qualify\"},\"maxHolders\":{\"type\":\"int\",\"default\":200,\"label\":\"Max holders per run (largest first)\"},\"excludeAddresses\":{\"type\":\"text\",\"default\":\"\",\"label\":\"Extra addresses to exclude, one per line\"},\"batchSize\":{\"type\":\"int\",\"default\":50,\"label\":\"Transfers per batch\"}}}];\n  const TOKEN = {\"address\":\"0x9f2b4c7e1a83d5064b7e2c9a15fd3e8b7c04a621\",\"symbol\":\"MYTOKEN\",\"name\":\"My Token\",\"decimals\":18,\"isToken0\":true,\"poolFee\":10000,\"sqrtPriceX96\":\"4619756043376610355707904\",\"liquidity\":\"28583097523751473441946\",\"totalSupply\":\"1000000000000000000000000000\",\"burned\":\"18400000000000000000000000\",\"graduated\":false,\"pairedPrincipal\":\"3114000000000000000\",\"graduationThreshold\":\"4200000000000000000\",\"pendingRewards\":\"13800000000000000\",\"maxTxTokens\":\"10000000000000000000000000\",\"maxWalletTokens\":\"20000000000000000000000000\"};\n  const CONTRACTS = {\"factory\":\"0xA5aAb3F0c6EeadF30Ef1D3Eb997108E976351feB\",\"factoryDeployBlock\":\"8991118\",\"locker\":\"0x736D76699C26D0d966744cAe304C000d471f7F35\",\"v3Factory\":\"0x1f7d7550B1b028f7571E69A784071F0205FD2EfA\",\"weth\":\"0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73\",\"v2Factory\":\"0x7eD598BcEf8bd9Edd8C97A195C6d13f40801EC7e\",\"v2FeeEscrow\":\"0xd3AFEB2a57f70eF218Aa82451c51B2fb0416Ac9e\",\"v2MemeHook\":\"0xE5e702641Ea86F4ae6cC3cDaeD2B886f976Be044\"};\n  const BURN = \"0x000000000000000000000000000000000000dEaD\";\n  const CHAIN_ID = 4663;\n\n  const S = { agents: [], fns: {}, decisions: [], nextId: 1, me: null };\n\n  const rnd = (n) => Array.from({ length: n }, () =>\n    '0123456789abcdef'[Math.floor(Math.random() * 16)]).join('');\n  const mkAddress = () => {\n    const h = rnd(40);\n    return '0x' + h.split('').map((c, i) => (parseInt(rnd(1), 16) > 7 ? c.toUpperCase() : c)).join('');\n  };\n  const now = () => Math.floor(Date.now() / 1000);\n\n  // ===== normalização de parâmetros (espelha functions/index.js) =====\n  function normalize(fnId, input) {\n    const spec = SPECS.find((s) => s.id === fnId);\n    const out = {};\n    for (const [k, def] of Object.entries(spec.params)) {\n      const raw = (input && input[k] !== undefined && input[k] !== '') ? input[k] : def.default;\n      if (def.type === 'int') {\n        const n = Number(raw);\n        if (!Number.isInteger(n) || n < 0) throw new Error(spec.label + ' → ' + def.label + ': must be an integer >= 0');\n        out[k] = n;\n      } else if (def.type === 'decimal') {\n        if (!/^\\d+(\\.\\d+)?$/.test(String(raw))) throw new Error(spec.label + ' → ' + def.label + ': must be a positive decimal');\n        out[k] = String(raw);\n      } else if (def.type === 'bool') {\n        out[k] = raw === true || raw === 'true';\n      } else if (def.type === 'enum') {\n        out[k] = def.options.includes(raw) ? raw : def.default;\n      } else {\n        out[k] = raw ?? '';\n      }\n    }\n    return out;\n  }\n\n  // ===== helpers de mercado usando a matemática real =====\n  const price = () => tokenPriceInPair({\n    sqrtPriceX96: BigInt(TOKEN.sqrtPriceX96), isToken0: TOKEN.isToken0,\n    tokenDecimals: TOKEN.decimals, pairDecimals: 18,\n  });\n\n  const quote = (amountIn, side) => simulateSwap({\n    sqrtPriceX96: BigInt(TOKEN.sqrtPriceX96), liquidity: BigInt(TOKEN.liquidity),\n    amountIn, side, isToken0: TOKEN.isToken0, feePips: TOKEN.poolFee,\n  });\n\n  const circulating = () => ({\n    total: BigInt(TOKEN.totalSupply),\n    burned: BigInt(TOKEN.burned),\n    circulating: BigInt(TOKEN.totalSupply) - BigInt(TOKEN.burned),\n  });\n\n  // ===== as cinco funções =====\n  const withSlippage = (a, bps) => (BigInt(a) * BigInt(10000 - bps)) / 10000n;\n\n  function planBuyback(agent, p) {\n    const amountIn = parseUnits(p.amountEth, 18);\n    const notes = [];\n    if (agent.eth < amountIn) {\n      return { notes: ['insufficient balance: has ' + formatUnits(agent.eth, 18) + ' ETH, needs ' + p.amountEth], decisions: [] };\n    }\n    const sim = quote(amountIn, 'buy');\n    const s = circulating();\n    notes.push('circulating supply today: ' + formatUnits(s.circulating, 18, 0) + ' of ' + formatUnits(s.total, 18, 0) +\n      ' (burned: ' + formatUnits(s.burned, 18, 0) + ')');\n    notes.push('totalSupply() does not change when you burn — the pons token has no burn()');\n    return {\n      notes,\n      decisions: [{\n        kind: 'buyback_burn', token: TOKEN.address, side: 'buy',\n        notionalWei: amountIn.toString(), priceImpactBps: sim.priceImpactBps,\n        expectedTokensOut: sim.amountOut.toString(),\n        rationale: 'buyback of ' + p.amountEth + ' ETH followed by a burn',\n        steps: [\n          { action: 'swap', side: 'buy', amountInWei: amountIn.toString(), minOutWei: withSlippage(sim.amountOut, 100).toString() },\n          { action: 'transfer', to: p.burnAddress || BURN, amountRef: 'swap.out' },\n        ],\n      }],\n    };\n  }\n\n  function planRewards(agent, p) {\n    const notes = [];\n    const decisions = [];\n    const pending = BigInt(TOKEN.pendingRewards);\n\n    if (!agent.delegated) {\n      notes.push('rewards for this token do not point at the agent yet — sign setFeeRedirect once to enable it');\n      notes.push('current payout: ' + (S.me || '0x…'));\n    }\n    notes.push('pending rewards: ' + formatUnits(pending, 18) + ' ETH');\n    notes.push('graduation: ' + formatUnits(BigInt(TOKEN.pairedPrincipal), 18) + ' / ' +\n      formatUnits(BigInt(TOKEN.graduationThreshold), 18) + ' ETH' + (TOKEN.graduated ? ' — graduated ✓' : ''));\n\n    if (agent.delegated && pending >= parseUnits(p.minCollectWei, 18)) {\n      decisions.push({\n        kind: 'collect_rewards', token: TOKEN.address, notionalWei: '0', priceImpactBps: 0,\n        rationale: 'collect ' + formatUnits(pending, 18) + ' ETH of creator rewards',\n        steps: [{ action: 'call', to: CONTRACTS.locker, method: 'collectFees', args: [TOKEN.address] }],\n      });\n    }\n\n    if (p.mode === 'reserve_until_graduation' && !TOKEN.graduated) {\n      notes.push('reserve mode: accumulating until graduation, no buying yet');\n    } else if (p.mode !== 'collect_only') {\n      const deployable = (agent.eth * BigInt(p.deployPercent)) / 100n;\n      if (deployable > 0n) {\n        const sim = quote(deployable, 'buy');\n        decisions.push({\n          kind: 'rewards_buyback_burn', token: TOKEN.address, side: 'buy',\n          notionalWei: deployable.toString(), priceImpactBps: sim.priceImpactBps,\n          expectedTokensOut: sim.amountOut.toString(),\n          rationale: 'put ' + p.deployPercent + '% of rewards (' + formatUnits(deployable, 18) + ' ETH) into buy and burn',\n          steps: [\n            { action: 'swap', side: 'buy', amountInWei: deployable.toString() },\n            { action: 'transfer', to: BURN, amountRef: 'swap.out' },\n          ],\n        });\n      }\n    }\n    return { notes, decisions };\n  }\n\n  function planDca(agent, p) {\n    const amountIn = parseUnits(p.amountEth, 18);\n    const budget = parseUnits(p.totalBudgetEth, 18);\n    const spent = S.decisions.filter((d) => d.agentId === agent.id && d.kind === 'dca' && d.status === 'executed')\n      .reduce((s, d) => s + BigInt(d.notionalWei), 0n);\n    if (spent + amountIn > budget) {\n      return { notes: ['program budget exhausted: ' + formatUnits(spent, 18) + ' of ' + p.totalBudgetEth + ' ETH'], decisions: [] };\n    }\n    if (agent.eth < amountIn) {\n      return { notes: ['insufficient balance: ' + formatUnits(agent.eth, 18) + ' ETH'], decisions: [] };\n    }\n    const sim = quote(amountIn, 'buy');\n\n    const perDay = (24 * 60) / p.intervalMinutes;\n    const feeYear = (amountIn * BigInt(Math.round(perDay * 365))) / 100n;\n    const notes = [\n      'estimated pool fees alone at this cadence: ~' + formatUnits(feeYear, 18, 4) + ' ETH per year',\n      'budget remaining: ' + formatUnits(budget - spent - amountIn, 18) + ' ETH',\n    ];\n    const steps = [{ action: 'swap', side: 'buy', amountInWei: amountIn.toString() }];\n    if (p.destination === 'burn') steps.push({ action: 'transfer', to: BURN, amountRef: 'swap.out' });\n    return {\n      notes,\n      decisions: [{\n        kind: 'dca', token: TOKEN.address, side: 'buy', notionalWei: amountIn.toString(),\n        priceImpactBps: sim.priceImpactBps, expectedTokensOut: sim.amountOut.toString(),\n        rationale: 'scheduled buy of ' + p.amountEth + ' ETH (every ' + p.intervalMinutes + ' min)',\n        steps,\n      }],\n    };\n  }\n\n  function parseLadder(text) {\n    return String(text).split(',').map((part) => {\n      const bits = part.trim().split(':');\n      const dropBps = Math.round(Number(bits[0]) * 100);\n      if (!Number.isFinite(dropBps) || !bits[1]) throw new Error('invalid ladder step: \"' + part.trim() + '\"');\n      return { dropBps: dropBps, amountEth: bits[1].trim() };\n    }).sort((a, b) => a.dropBps - b.dropBps);\n  }\n\n  function planDip(agent, p) {\n    let ladder;\n    try { ladder = p.ladder ? parseLadder(p.ladder) : [{ dropBps: Math.round(Number(p.dropPercent) * 100), amountEth: String(p.amountEth) }]; }\n    catch (e) { return { notes: [e.message], decisions: [] }; }\n\n    // no demo a máxima da janela é 20% acima do preço atual\n    const cur = price();\n    const high = (cur * 12000n) / 10000n;\n    const dropBps = Number(((high - cur) * 10000n) / high);\n    const notes = ['now ' + formatUnits(cur, 18, 12) + ' ETH · highest in ' + p.windowHours + 'h: ' +\n      formatUnits(high, 18, 12) + ' ETH · that is ' + (dropBps / 100).toFixed(2) + '% below the high'];\n\n    const step = ladder.slice().reverse().find((s) => dropBps >= s.dropBps);\n    if (!step) {\n      notes.push('the drop has not reached ' + (ladder[0].dropBps / 100) + '% yet — no buy');\n      return { notes, decisions: [] };\n    }\n    const amountIn = parseUnits(step.amountEth, 18);\n    if (agent.eth < amountIn) {\n      notes.push('the ' + (step.dropBps / 100) + '% drop was reached, but the agent only has ' + formatUnits(agent.eth, 18) + ' ETH');\n      return { notes, decisions: [] };\n    }\n    const sim = quote(amountIn, 'buy');\n    const steps = [{ action: 'swap', side: 'buy', amountInWei: amountIn.toString() }];\n    if (p.destination === 'burn') steps.push({ action: 'transfer', to: BURN, amountRef: 'swap.out' });\n    return {\n      notes,\n      decisions: [{\n        kind: 'dip_buy', token: TOKEN.address, side: 'buy', notionalWei: amountIn.toString(),\n        priceImpactBps: sim.priceImpactBps, expectedTokensOut: sim.amountOut.toString(),\n        rationale: 'the price is ' + (dropBps / 100).toFixed(2) + '% below the ' + p.windowHours + 'h high, past the ' +\n          (step.dropBps / 100) + '% you set — buying ' + step.amountEth + ' ETH',\n        steps,\n      }],\n    };\n  }\n\n  function parseRecipients(csv, decimals) {\n    const out = []; const errors = []; const seen = {};\n    String(csv).split(/\\r?\\n/).forEach((line, i) => {\n      const raw = line.trim();\n      if (!raw || raw[0] === '#') return;\n      const parts = raw.split(/[,;\\t]/).map((s) => (s || '').trim());\n      const addr = parts[0]; const amount = parts[1]; const n = i + 1;\n      if (!/^0x[0-9a-fA-F]{40}$/.test(addr || '')) { errors.push('line ' + n + ': invalid address \"' + addr + '\"'); return; }\n      if (seen[addr.toLowerCase()]) { errors.push('line ' + n + ': duplicate address ' + addr); return; }\n      let value;\n      try { value = parseUnits(amount, decimals); } catch (e) { errors.push('line ' + n + ': invalid amount \"' + amount + '\"'); return; }\n      if (value <= 0n) { errors.push('line ' + n + ': amount must be greater than zero'); return; }\n      seen[addr.toLowerCase()] = 1;\n      out.push({ address: addr, amount: value });\n    });\n    return { recipients: out, errors, total: out.reduce((s, r) => s + r.amount, 0n) };\n  }\n\n  function planAirdrop(agent, p) {\n    const parsed = parseRecipients(p.recipientsCsv, TOKEN.decimals);\n    const notes = parsed.errors.slice();\n    if (!parsed.recipients.length) {\n      notes.push('no valid recipients — provide the address list');\n      return { notes, decisions: [] };\n    }\n    const known = S.agents.map((a) => a.address.toLowerCase()).concat([String(S.me || '').toLowerCase()]);\n    const self = parsed.recipients.filter((r) => known.indexOf(r.address.toLowerCase()) >= 0);\n    if (self.length) {\n      self.forEach((h) => notes.push('recipient ' + h.address + ' is a wallet owned by this tool'));\n      notes.push('airdrop cancelled: the list points at wallets owned by this tool');\n      return { notes, decisions: [] };\n    }\n    if (agent.token < parsed.total) {\n      notes.push('agent balance (' + formatUnits(agent.token, 18, 4) + ') is below the airdrop total (' +\n        formatUnits(parsed.total, 18, 4) + ')');\n    }\n    const over = parsed.recipients.filter((r) => r.amount > BigInt(TOKEN.maxWalletTokens));\n    if (over.length) {\n      notes.push(over.length + ' recipients exceed maxWallet (' + formatUnits(BigInt(TOKEN.maxWalletTokens), 18, 4) + ') — those transfers would revert');\n    }\n    const batches = [];\n    for (let i = 0; i < parsed.recipients.length; i += p.batchSize) batches.push(parsed.recipients.slice(i, i + p.batchSize));\n    notes.push(parsed.recipients.length + ' recipients, ' + formatUnits(parsed.total, 18, 4) + ' tokens, ' + batches.length + ' batch(es)');\n    if (p.dryRun) { notes.push('simulate only: no transfer will be sent'); return { notes, decisions: [] }; }\n    return {\n      notes,\n      decisions: batches.map((b, i) => ({\n        kind: 'airdrop', token: TOKEN.address, notionalWei: '0', priceImpactBps: 0,\n        rationale: 'airdrop batch ' + (i + 1) + '/' + batches.length + ' — ' + b.length + ' recipients',\n        steps: b.map((r) => ({ action: 'transfer', to: r.address, amountWei: r.amount.toString() })),\n      })),\n    };\n  }\n\n  const PLANNERS = {\n    buyback_burn: planBuyback, rewards_boost: planRewards,\n    dca: planDca, dip_buy: planDip, airdrop: planAirdrop,\n    holder_airdrop: () => ({ notes: ['reading the holder list needs the live explorer — try it on the local site'], decisions: [] }),\n  };\n\n  // ===== motor: guards + política, igual ao runner real =====\n  function runAgent(agent) {\n    const enabled = (S.fns[agent.id] || []).filter((f) => f.enabled);\n    const results = [];\n    const spentToday = S.decisions.filter((d) => d.agentId === agent.id && d.status === 'executed')\n      .reduce((s, d) => s + BigInt(d.notionalWei || 0), 0n);\n\n    for (const f of enabled) {\n      const spec = SPECS.find((s) => s.id === f.function_id);\n      let planned;\n      try { planned = PLANNERS[f.function_id](agent, f.params); }\n      catch (e) { results.push({ functionId: f.function_id, error: e.message }); continue; }\n\n      const evaluated = planned.decisions.map((decision) => {\n        const violations = [];\n        // guards do protocolo\n        if (decision.expectedTokensOut && BigInt(decision.expectedTokensOut) > BigInt(TOKEN.maxTxTokens)) {\n          violations.push('order of ' + decision.expectedTokensOut + ' exceeds maxTx of ' + TOKEN.maxTxTokens);\n        }\n        // política de risco (código real)\n        const verdict = evaluate(decision, {\n          policy: agent.policy,\n          ethBalanceWei: agent.eth,\n          spentTodayWei: spentToday,\n          poolLiquidityWei: BigInt(TOKEN.liquidity),\n          tradesLastHour: 0,\n          secondsSinceLastTrade: 999999,\n        });\n        verdict.violations = violations.concat(verdict.violations);\n        verdict.approved = verdict.violations.length === 0;\n\n        const id = S.nextId++;\n        S.decisions.push({\n          id, agentId: agent.id, kind: decision.kind, notionalWei: decision.notionalWei,\n          ts: now(), status: verdict.violations.length ? 'rejected' : (verdict.needsApproval ? 'pending_approval' : 'approved'),\n        });\n        return { id, decision, verdict };\n      });\n\n      results.push({\n        functionId: f.function_id, label: spec.label,\n        notes: planned.notes || [], decisions: evaluated,\n      });\n    }\n\n    const s = circulating();\n    return {\n      agent: { id: agent.id, address: agent.address, status: agent.status },\n      token: TOKEN.address,\n      state: {\n        symbol: TOKEN.symbol,\n        pricePair: price().toString(),\n        mcapPair: marketCapInPair(price(), BigInt(TOKEN.totalSupply), 18).toString(),\n        liquidity: TOKEN.liquidity,\n        graduated: TOKEN.graduated,\n        balances: { eth: agent.eth.toString(), weth: '0', token: agent.token.toString() },\n        supply: { total: s.total.toString(), burned: s.burned.toString(), circulating: s.circulating.toString() },\n        restrictionsActive: false,\n      },\n      results,\n    };\n  }\n\n  // ===== roteador falso =====\n  const ROUTES = [\n    ['GET', /^\\/api\\/config$/, () => ({\n      chain: { id: CHAIN_ID, name: 'Robinhood Chain', explorer: 'https://robinhoodchain.blockscout.com' },\n      contracts: CONTRACTS, burnAddress: BURN, functions: SPECS, domain: 'pons-mm (demo)', liveExecution: false,\n    })],\n    ['GET', /^\\/api\\/health$/, () => ({ rpc: 'ok', chainId: CHAIN_ID, head: '9142887', expected: CHAIN_ID })],\n    ['GET', /^\\/api\\/auth\\/me$/, () => ({ address: S.me })],\n\n    ['POST', /^\\/api\\/auth\\/nonce$/, (m, body) => {\n      const nonce = rnd(32);\n      S.nonce = nonce;\n      return {\n        nonce,\n        message: 'pons-mm (demo) wants to verify that you control this wallet.\\n\\n' +\n          'Signing this message authorizes no transaction, moves no funds,\\n' +\n          'and gives no access to your wallet.\\n\\n' +\n          'Address: ' + body.address + '\\nNetwork: ' + CHAIN_ID + '\\nNonce: ' + nonce,\n      };\n    }],\n\n    ['POST', /^\\/api\\/auth\\/verify$/, (m, body) => {\n      if (!body.signature || body.nonce !== S.nonce) throw new Error('invalid signature');\n      S.nonce = null;\n      S.me = body.address;\n      return { address: body.address, expiresAt: Date.now() + 7 * 864e5 };\n    }],\n    ['POST', /^\\/api\\/auth\\/logout$/, () => { S.me = null; return { ok: true }; }],\n\n    ['GET', /^\\/api\\/agents$/, () => S.agents.map((a) => ({\n      id: a.id, label: a.label, address: a.address, status: a.status, created_at: a.createdAt,\n    }))],\n\n    ['POST', /^\\/api\\/agents$/, (m, body) => {\n      if (!body.password || body.password.length < 8) throw new Error('keystore password must be at least 8 characters');\n      const agent = {\n        id: 'ag-' + rnd(8), label: body.label || 'agent', address: mkAddress(),\n        status: 'awaiting_funding', createdAt: now(), target_token: TOKEN.address,\n        custody: body.custody || 'hybrid', delegated: false,\n        eth: 0n, token: 0n, policy: validatePolicy(DEFAULT_POLICY),\n      };\n      S.agents.push(agent);\n      S.fns[agent.id] = [];\n      return {\n        id: agent.id, label: agent.label, address: agent.address, chainId: CHAIN_ID,\n        status: agent.status, owner: S.me,\n        depositInstructions: 'Send Robinhood Chain ETH (chain ' + CHAIN_ID + ') to ' + agent.address + '.',\n      };\n    }],\n\n    ['GET', /^\\/api\\/agents\\/([^/]+)$/, (m) => {\n      const a = S.agents.find((x) => x.id === m[1]);\n      if (!a) throw new Error('agent not found');\n      return {\n        id: a.id, label: a.label, address: a.address, status: a.status,\n        target_token: a.target_token, custody: a.custody,\n        balances: { eth: a.eth.toString(), ethFormatted: formatUnits(a.eth, 18), weth: '0' },\n        functions: S.fns[a.id] || [],\n        decisions: S.decisions.filter((d) => d.agentId === a.id).slice(-30).reverse(),\n      };\n    }],\n\n    ['POST', /^\\/api\\/agents\\/([^/]+)\\/functions$/, (m, body) => {\n      const list = S.fns[m[1]] || (S.fns[m[1]] = []);\n      const i = list.findIndex((f) => f.function_id === body.functionId);\n      if (body.enabled === false) { if (i >= 0) list[i].enabled = false; return { ok: true }; }\n      const params = normalize(body.functionId, body.params);\n      if (i >= 0) { list[i] = { function_id: body.functionId, enabled: true, params }; }\n      else list.push({ function_id: body.functionId, enabled: true, params });\n      return { ok: true, params };\n    }],\n\n    ['POST', /^\\/api\\/agents\\/([^/]+)\\/run$/, (m) => {\n      const a = S.agents.find((x) => x.id === m[1]);\n      if (!a) throw new Error('agent not found');\n      return runAgent(a);\n    }],\n\n    ['POST', /^\\/api\\/agents\\/([^/]+)\\/withdraw$/, (m, body) => {\n      const a = S.agents.find((x) => x.id === m[1]);\n      if (!body.password) throw new Error('the keystore password is required to sign the withdrawal');\n      const isEth = body.asset !== 'token';\n      const amount = isEth ? (a.eth > 300000000000000n ? a.eth - 300000000000000n : 0n) : a.token;\n      if (amount <= 0n) throw new Error('nothing to withdraw');\n      if (body.live) { if (isEth) a.eth = 0n; else a.token = 0n; }\n      return {\n        dryRun: !body.live, asset: isEth ? 'eth' : 'token',\n        to: body.to || S.me, amount: amount.toString(),\n        gasCost: isEth ? '300000000000000' : undefined,\n        hash: body.live ? '0x' + rnd(64) : undefined,\n      };\n    }],\n\n    ['PATCH', /^\\/api\\/agents\\/([^/]+)$/, (m, body) => {\n      const a = S.agents.find((x) => x.id === m[1]);\n      if (body.label !== undefined) a.label = String(body.label).trim() || a.label;\n      if (body.token !== undefined) a.target_token = body.token ? String(body.token).toLowerCase() : null;\n      return { ok: true, agent: a, tokenInfo: body.token\n        ? { address: body.token, valid: true, hasCode: true, isPonsToken: true,\n            erc20: { name: TOKEN.name, symbol: TOKEN.symbol, decimals: 18 }, verdict: null }\n        : null };\n    }],\n\n    ['POST', /^\\/api\\/agents\\/([^/]+)\\/delegation$/, (m) => {\n      const a = S.agents.find((x) => x.id === m[1]);\n      return {\n        agentAddress: a.address, token: TOKEN.address,\n        tokenInfo: { address: TOKEN.address, valid: true, hasCode: true, isPonsToken: true,\n          erc20: { name: TOKEN.name, symbol: TOKEN.symbol, decimals: 18 }, verdict: null },\n        status: { feeRecipient: a.delegated ? a.address : S.me, redirectedToAgent: a.delegated, canCollectNow: a.delegated },\n        transactions: [\n          {\n            label: 'point the creator payout at the agent', to: CONTRACTS.locker,\n            data: '0x2f1a' + rnd(60), signature: 'setFeeRedirect(address,address)',\n            note: 'only the token deployer can call this; from then on rewards land in the agent wallet',\n            simulation: { ok: true },\n          },\n          {\n            label: 'authorize the agent to trigger collection', to: CONTRACTS.locker,\n            data: '0x8b4c' + rnd(60), signature: 'setFeeCollector(address,bool)',\n            note: 'restricted to the locker owner — if it fails, the agent can still collect through the pons interface',\n            // A demo mostra o caso real: esta chamada é do dono do locker, não do\n            // criador do token. Fingir que passa esconderia justamente a limitação.\n            simulation: { ok: false, error: 'OwnableUnauthorizedAccount',\n              reason: 'This call is restricted to the locker owner - the pons team, not token creators. You cannot authorize a collector yourself; the agent collects through the redirect instead.' },\n          },\n        ],\n      };\n    }],\n\n    ['POST', /^\\/api\\/decisions\\/(\\d+)\\/execute$/, () => {\n      throw new Error('execution is disabled in the demo — run the site locally to try it');\n    }],\n\n    ['POST', /^\\/api\\/decisions\\/(\\d+)\\/(approve|reject)$/, (m) => {\n      const d = S.decisions.find((x) => x.id === Number(m[1]));\n      if (d) d.status = m[2] === 'approve' ? 'approved' : 'rejected_by_user';\n      return { ok: true };\n    }],\n\n    ['POST', /^\\/api\\/airdrop\\/validate$/, (m, body) => {\n      const p = parseRecipients(body.csv || '', 18);\n      return {\n        count: p.recipients.length, total: p.total.toString(),\n        totalFormatted: formatUnits(p.total, 18, 4), errors: p.errors,\n        sample: p.recipients.slice(0, 5).map((r) => ({ address: r.address, amount: r.amount.toString() })),\n      };\n    }],\n  ];\n\n  window.fetch = async function (url, opts) {\n    opts = opts || {};\n    const path = String(url).replace(/^https?:\\/\\/[^/]+/, '');\n    const method = opts.method || 'GET';\n    const body = opts.body ? JSON.parse(opts.body) : {};\n    await new Promise((r) => setTimeout(r, 90));\n    for (const [m, re, fn] of ROUTES) {\n      if (m !== method) continue;\n      const match = re.exec(path);\n      if (!match) continue;\n      try {\n        const out = fn(match, body);\n        return new Response(JSON.stringify(out, (k, v) => (typeof v === 'bigint' ? v.toString() : v)),\n          { status: 200, headers: { 'content-type': 'application/json' } });\n      } catch (e) {\n        return new Response(JSON.stringify({ error: e.message }), { status: 400, headers: { 'content-type': 'application/json' } });\n      }\n    }\n    return new Response(JSON.stringify({ error: 'route not available in the demo: ' + method + ' ' + path }),\n      { status: 404, headers: { 'content-type': 'application/json' } });\n  };\n\n  // ===== carteira falsa: o \"conectar\" e o \"assinar\" funcionam na demo =====\n  S.me = null;\n  window.ethereum = {\n    isDemo: true,\n    request: async ({ method, params }) => {\n      if (method === 'eth_requestAccounts') { S.me = mkAddress(); return [S.me]; }\n      if (method === 'personal_sign') return '0x' + rnd(130);\n      // A demo finge estar sempre na rede certa: a troca de rede é justamente\n      // a parte que não dá para simular de forma honesta sem uma carteira real.\n      if (method === 'eth_chainId') return '0x1237';\n      if (method === 'wallet_switchEthereumChain' || method === 'wallet_addEthereumChain') return null;\n      if (method === 'eth_sendTransaction') {\n        const a = S.agents.find((x) => x.id === (window.__lastAgentId || ''));\n        S.agents.forEach((x) => { x.delegated = true; });\n        return '0x' + rnd(64);\n      }\n      throw new Error('método não simulado: ' + method);\n    },\n  };\n\n  // ===== ferramentas de demo: depositar e limpar =====\n  window.__demo = {\n    fund(agentId, eth) {\n      const a = S.agents.find((x) => x.id === agentId);\n      if (!a) return;\n      a.eth += parseUnits(String(eth), 18);\n      a.token += parseUnits('12840000', 18);\n      a.status = 'funded';\n    },\n    state: S,\n  };\n\n  window.alert = (m) => {\n    const d = document.createElement('div');\n    d.textContent = m;\n    d.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1a212a;' +\n      'border:1px solid #2f3a47;color:#e8eef5;padding:12px 18px;border-radius:10px;font:13px system-ui;' +\n      'z-index:9999;max-width:80%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5)';\n    document.body.appendChild(d);\n    setTimeout(() => d.remove(), 3400);\n  };\n  // location.reload é somente-leitura no navegador — o \"Sair\" é tratado na barra de demo.\n  window.__demoLogout = () => {\n    S.me = null;\n    S.agents.length = 0;\n    S.decisions.length = 0;\n    document.getElementById('gate').style.display = 'block';\n    document.getElementById('app').style.display = 'none';\n    document.getElementById('connectBtn').style.display = 'inline-block';\n    document.getElementById('logoutBtn').style.display = 'none';\n    document.getElementById('userChip').style.display = 'none';\n  };\n})();\n<\/script>\n<script>\n(function () {\n  function build() {\n    const bar = document.createElement('div');\n    bar.style.cssText = 'position:fixed;right:18px;bottom:18px;background:#141920;border:1px solid #2a3542;' +\n      'border-radius:12px;padding:13px 15px;z-index:900;font:12px system-ui;color:#8b98a8;' +\n      'box-shadow:0 10px 34px rgba(0,0,0,.55);max-width:250px';\n    bar.innerHTML = '<div style=\"color:#e3b341;font-weight:600;margin-bottom:7px\">demo mode<\/div>' +\n      '<div style=\"margin-bottom:9px;line-height:1.45\">The agent starts with no balance, just like the real thing. ' +\n      'Fund it so the capital functions can run.<\/div>' +\n      '<button id=\"__fund\" style=\"background:#5aa2ff;color:#04101f;border:0;border-radius:7px;padding:7px 12px;' +\n      'font:inherit;font-weight:600;cursor:pointer;width:100%\">Deposit 0.05 ETH into the agent<\/button>';\n    document.body.appendChild(bar);\n    const out = document.getElementById('logoutBtn');\n    if (out) out.onclick = () => window.__demoLogout();\n\n    document.getElementById('__fund').onclick = () => {\n      const sel = document.getElementById('agentSelect');\n      if (!sel || !sel.value) return alert('create and select an agent first');\n      window.__demo.fund(sel.value, 0.05);\n      sel.dispatchEvent(new Event('change'));\n      alert('0.05 ETH credited to the agent wallet (demo)');\n    };\n  }\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', build);\n  else build();\n})();\n<\/script>\n<\/head>\r\n<body>\r\n\r\n<nav>\r\n  <div class=\"logo\"><a href=\"/\" style=\"color:inherit;display:flex;align-items:center;gap:9px\"><img src=\"/assets/brand-64.png?v={{ASSETS_V}}\" alt=\"\" width=\"24\" height=\"24\">{{BRAND_HTML}}<\/a><\/div>\r\n  <span class=\"chip\" id=\"chainChip\">…<\/span>\r\n  <div class=\"sp\"><\/div>\r\n  <span class=\"chip\" id=\"walletChain\" style=\"display:none\"><\/span>\r\n  <span class=\"chip\" id=\"userChip\" style=\"display:none\"><\/span>\r\n  <button id=\"connectBtn\">Connect wallet<\/button>\r\n  <button class=\"ghost sm\" id=\"logoutBtn\" style=\"display:none\">Sign out<\/button>\r\n<\/nav>\r\n\r\n<div id=\"gate\" class=\"gate\">\r\n  <h1>Connect your wallet<\/h1>\r\n  <p>You'll sign a plain text message to prove the address is yours.\r\n     This moves no funds and authorizes no transaction.<\/p>\r\n  <button id=\"gateBtn\">Connect wallet<\/button>\r\n  <p style=\"margin-top:20px;font-size:12px\">\r\n    No wallet in your browser? The <a href=\"/\">CLI<\/a> does the same from the command line.\r\n  <\/p>\r\n<\/div>\r\n\r\n<main id=\"app\" style=\"display:none\">\r\n  <div>\r\n    <div class=\"card\">\r\n      <h2>Create agent<\/h2>\r\n      <label>Agent name<\/label>\r\n      <input id=\"label\" placeholder=\"my token's agent\">\r\n      <label>Target token<\/label>\r\n      <input id=\"token\" class=\"mono\" placeholder=\"0x…\">\r\n      <label>Password<\/label>\r\n      <input id=\"password\" type=\"password\" placeholder=\"at least 8 characters\">\r\n      <label style=\"display:flex;gap:8px;align-items:flex-start;margin-top:14px;cursor:pointer\">\r\n        <input type=\"checkbox\" id=\"terms\" style=\"width:auto;margin-top:3px\">\r\n        <span style=\"font-size:12px;color:var(--dim)\">I have read the\r\n          <a href=\"/terms\" target=\"_blank\">terms and risks<\/a> — including that losing the\r\n          password means losing the agent's funds.<\/span>\r\n      <\/label>\r\n      <button id=\"createBtn\" style=\"margin-top:12px\">Create agent and wallet<\/button>\r\n      <div id=\"created\" style=\"display:none\">\r\n        <div class=\"addr\">\r\n          <div style=\"font-size:12px;color:var(--dim);margin-bottom:6px\">Deposit address<\/div>\r\n          <div class=\"mono\" id=\"createdAddr\"><\/div>\r\n        <\/div>\r\n        <div class=\"note warn\">Save this password. Without it the keystore — and the agent's funds — cannot be recovered.<\/div>\r\n      <\/div>\r\n    <\/div>\r\n\r\n    <div class=\"card\">\r\n      <h2>My agents<\/h2>\r\n      <select id=\"agentSelect\"><option value=\"\">—<\/option><\/select>\r\n      <div id=\"agentInfo\"><\/div>\r\n    <\/div>\r\n\r\n    <div class=\"card\">\r\n      <h2>Delegate creator rewards<\/h2>\r\n      <p style=\"font-size:12px;color:var(--dim)\">\r\n        One signature points your creator payout at the agent. Revert it whenever you want.\r\n      <\/p>\r\n      <button class=\"ghost\" id=\"delegBtn\" style=\"margin-top:12px\">Prepare transaction<\/button>\r\n      <div id=\"delegOut\"><\/div>\r\n    <\/div>\r\n  <\/div>\r\n\r\n  <div>\r\n    <div id=\"betaBanner\"><\/div>\r\n    <div class=\"banner\">\r\n      <strong>About burning:<\/strong> the pons token has no <code>burn()<\/code>.\r\n      Sending to <code>0x…dEaD<\/code> does remove coins from circulation, but\r\n      <code>totalSupply()<\/code> stays at 1B forever. Publish circulating supply,\r\n      not total.\r\n    <\/div>\r\n\r\n    <div class=\"card\">\r\n      <h2>Functions<\/h2>\r\n      <div id=\"functions\"><div class=\"empty\">loading…<\/div><\/div>\r\n\r\n      <div class=\"runbar\">\r\n        <div class=\"rule\"><\/div>\r\n\r\n        <!-- Senha: aparece so no primeiro start desta aba. Depois disso o\r\n             botao age sozinho, e este bloco fica escondido. -->\r\n        <div id=\"askPw\" style=\"display:none\">\r\n          <p class=\"cap\">Password · unlocks this agent for this browser tab<\/p>\r\n          <input type=\"password\" id=\"livePw\" placeholder=\"agent password\" autocomplete=\"off\">\r\n        <\/div>\r\n\r\n        <div id=\"agentState\" class=\"state\" style=\"display:none\">\r\n          <span class=\"dot\"><\/span><span id=\"stateText\"><\/span>\r\n          <button class=\"linky\" onclick=\"forgetPassword()\">lock<\/button>\r\n        <\/div>\r\n\r\n        <button id=\"runBtn\" disabled>Start agent<\/button>\r\n\r\n        <div class=\"warnline\">Runs every function you turned on, with the amounts you set,\r\n          and sends the transactions. Only the gas reserve is ever held back.<\/div>\r\n      <\/div>\r\n    <\/div>\r\n\r\n    <div class=\"card\">\r\n      <h2>Results<\/h2>\r\n      <div id=\"result\"><div class=\"empty\">Pick an agent, turn on some functions, and run it.<\/div><\/div>\r\n    <\/div>\r\n  <\/div>\r\n<\/main>\r\n\r\n<script>\r\nconst $ = (id) => document.getElementById(id);\r\nconst esc = (s) => String(s ?? '').replace(/[&<>\"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\r\nconst api = async (method, path, body) => {\r\n  const res = await fetch(path, {\r\n    method, headers: {'content-type':'application/json'},\r\n    body: body ? JSON.stringify(body) : undefined, credentials: 'same-origin',\r\n  });\r\n  const data = await res.json();\r\n  if (!res.ok) throw new Error(data.error || 'request failed');\r\n  return data;\r\n};\r\n// Prices in these pools are tiny (1e-9 ETH is common). Rounding to 6 decimals would\r\n// show \"0\" for almost every token, so values below 1 use significant digits instead\r\n// of fixed decimal places.\r\nconst eth = (wei, d = 18) => {\r\n  const v = BigInt(wei || 0);\r\n  if (v === 0n) return '0';\r\n  const neg = v < 0n;\r\n  const n = Number(neg ? -v : v) / Number(10n ** BigInt(d));\r\n  const s = n >= 1 ? n.toFixed(6).replace(/0+$/, '').replace(/\\.$/, '') : Number(n.toPrecision(4)).toString();\r\n  return (neg ? '-' : '') + s;\r\n};\r\n\r\nlet CONFIG = null, ME = null, AGENT = null, ME_TERMS = false;\r\n\r\nasync function boot() {\r\n  CONFIG = await api('GET', '/api/config');\r\n  renderFunctions();\r\n  renderBanners();\r\n  api('GET', '/api/health').then((h) => {\r\n    const c = $('chainChip');\r\n    if (h.rpc === 'ok' && h.chainId === h.expected) {\r\n      c.className = 'chip ok'; c.textContent = `chain ${h.chainId} · block ${h.head}`;\r\n    } else {\r\n      c.className = 'chip bad';\r\n      c.textContent = h.rpc === 'ok' ? `unexpected chain ${h.chainId}` : 'RPC unavailable';\r\n    }\r\n  });\r\n  const me = await api('GET', '/api/auth/me');\r\n  ME_TERMS = !!me.termsAccepted;\r\n  // Conta que já usava a ferramenta e ainda não aceitou a versão atual dos\r\n  // termos precisa saber disso antes de tentar executar, não no erro.\r\n  if (me.address && !ME_TERMS) renderBanners();\r\n  if (me.address) await onLogin(me.address);\r\n}\r\n\r\n// ---------------------------------------------------------------- login\r\n\r\nasync function connect() {\r\n  if (!window.ethereum) {\r\n    return alert('No wallet found in this browser. Install MetaMask or use the CLI.');\r\n  }\r\n  try {\r\n    const [address] = await window.ethereum.request({ method: 'eth_requestAccounts' });\r\n    // Troca de rede antes de assinar: assim a pessoa já entra na rede certa e\r\n    // não descobre o problema só na hora da primeira transação. Se ela recusar,\r\n    // o login continua — assinar mensagem não depende de rede.\r\n    await ensureChain({ silent: true });\r\n    const { nonce, message } = await api('POST', '/api/auth/nonce', { address });\r\n    const signature = await window.ethereum.request({\r\n      method: 'personal_sign', params: [message, address],\r\n    });\r\n    const session = await api('POST', '/api/auth/verify', { address, nonce, signature });\r\n    ME_TERMS = false;\r\n    await onLogin(session.address);\r\n  } catch (e) {\r\n    alert(e.message || 'could not connect');\r\n  }\r\n}\r\n\r\nasync function onLogin(address) {\r\n  ME = address;\r\n  $('gate').style.display = 'none';\r\n  $('app').style.display = 'grid';\r\n  $('connectBtn').style.display = 'none';\r\n  $('logoutBtn').style.display = 'inline-block';\r\n  const chip = $('userChip');\r\n  chip.style.display = 'inline-block';\r\n  chip.textContent = address.slice(0, 6) + '…' + address.slice(-4);\r\n  renderWalletChain();\r\n  await loadAgents();\r\n}\r\n\r\n$('connectBtn').onclick = connect;\r\n$('gateBtn').onclick = connect;\r\n$('logoutBtn').onclick = async () => { await api('POST', '/api/auth/logout'); location.reload(); };\r\n\r\n// ---------------------------------------------------------------- agentes\r\n\r\n// A lista é carregada e um agente é SELECIONADO sozinho.\r\n//\r\n// Deixar o seletor vazio depois de um refresh faz o painel parecer vazio, e\r\n// painel vazio parece perda de dados — foi exatamente essa a leitura num teste\r\n// real (\"atualizei a página e meu agente sumiu\"). Nada tinha sumido: só não\r\n// havia nada escolhido. Escolher sozinho custa uma linha e elimina o susto.\r\nasync function loadAgents(preferId = null) {\r\n  const agents = await api('GET', '/api/agents');\r\n  const sel = $('agentSelect');\r\n  sel.innerHTML = '<option value=\"\">—<\/option>' +\r\n    agents.map((a) => `<option value=\"${a.id}\">${esc(a.label)} · ${a.address.slice(0,10)}…<\/option>`).join('');\r\n\r\n  if (agents.length === 0) {\r\n    AGENT = null;\r\n    $('runBtn').disabled = true;\r\n    $('agentInfo').innerHTML = `\r\n      <div class=\"kv\"><span>agents on this account<\/span><span>none yet<\/span><\/div>\r\n      <p class=\"muted\" style=\"margin:10px 0 0\">\r\n        Agents belong to the wallet that created them.
