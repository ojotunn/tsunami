This account\r\n        (<span class=\"mono\">${esc(ME || '')}<\/span>) has none.\r\n        If you created one earlier, switch back to that account in your wallet\r\n        and reload — nothing is deleted when you refresh.\r\n      <\/p>`;\r\n    return;\r\n  }\r\n\r\n  // mantém a escolha atual; senão fica com a última usada; senão com a primeira\r\n  const remembered = (() => { try { return sessionStorage.getItem('pons_agent'); } catch { return null; } })();\r\n  const wanted = (preferId && agents.some((a) => a.id === preferId) && preferId)\r\n    || (AGENT && agents.some((a) => a.id === AGENT.id) && AGENT.id)\r\n    || (remembered && agents.some((a) => a.id === remembered) && remembered)\r\n    || agents[0].id;\r\n  sel.value = wanted;\r\n  if (!AGENT || AGENT.id !== wanted) await selectAgent(wanted);\r\n}\r\n\r\n$('createBtn').onclick = async () => {\r\n  const b = $('createBtn');\r\n  if (!$('terms').checked && !ME_TERMS) return alert('please read and accept the terms first');\r\n  b.disabled = true; b.textContent = 'generating wallet…';\r\n  try {\r\n    if (!ME_TERMS) { await api('POST', '/api/terms/accept'); ME_TERMS = true; }\r\n    const agent = await api('POST', '/api/agents', {\r\n      label: $('label').value || 'agent', password: $('password').value,\r\n      token: $('token').value.trim() || undefined, custody: 'hybrid',\r\n    });\r\n    $('created').style.display = 'block';\r\n    $('createdAddr').textContent = agent.address;\r\n    $('password').value = '';\r\n    await loadAgents(agent.id);\r\n  } catch (e) { alert(e.message); }\r\n  b.disabled = false; b.textContent = 'Create agent and wallet';\r\n};\r\n\r\n$('agentSelect').onchange = (e) => selectAgent(e.target.value);\r\n\r\nasync function selectAgent(id) {\r\n  if (!id) {\r\n    AGENT = null; $('agentInfo').innerHTML = '';\r\n    $('runBtn').disabled = true;\r\n    renderRunState();\r\n    return;\r\n  }\r\n  AGENT = await api('GET', '/api/agents/' + id);\r\n  try { sessionStorage.setItem('pons_agent', id); } catch { /* modo privado: sem memória, sem problema */ }\r\n  $('runBtn').disabled = false;\r\n  renderRunState();\r\n  // O token alvo é editável aqui. Antes só dava para escolher na criação, e\r\n  // quem errasse o endereço tinha que criar outro agente — carteira nova, chave\r\n  // nova, fundos para mover. Trocar um campo de texto não pode custar isso.\r\n  $('agentInfo').innerHTML = `\r\n    <div class=\"addr\"><div class=\"mono\">${AGENT.address}<\/div><\/div>\r\n    <div class=\"kv\"><span>status<\/span><span>${esc(AGENT.status)}<\/span><\/div>\r\n    <div class=\"kv\"><span>balance<\/span><span>${AGENT.balances ? AGENT.balances.ethFormatted + ' ETH' : 'network unavailable'}<\/span><\/div>\r\n    <label>Target token — the token this agent works on<\/label>\r\n    <input id=\"agentToken\" class=\"mono\" placeholder=\"0x…\" value=\"${esc(AGENT.target_token || '')}\">\r\n    <button class=\"ghost sm\" id=\"saveTokenBtn\" style=\"margin-top:8px\">Check and save token<\/button>\r\n    <div id=\"agentTokenOut\"><\/div>\r\n\r\n    <label style=\"margin-top:18px\">Withdraw — send the agent's funds back to you<\/label>\r\n    <div class=\"grid2\">\r\n      <select id=\"wAsset\">\r\n        <option value=\"eth\">ETH<\/option>\r\n        <option value=\"token\">the target token<\/option>\r\n      <\/select>\r\n      <input id=\"wPassword\" type=\"password\" placeholder=\"keystore password\">\r\n    <\/div>\r\n    <input id=\"wTo\" class=\"mono\" style=\"margin-top:8px\" placeholder=\"destination (default: ${esc(ME || 'your wallet')})\">\r\n    <div class=\"grid2\" style=\"margin-top:8px\">\r\n      <button class=\"ghost sm\" id=\"wCheckBtn\">Check first<\/button>\r\n      <button class=\"ghost sm\" id=\"wSendBtn\">Withdraw everything<\/button>\r\n    <\/div>\r\n    <div id=\"wOut\"><\/div>`;\r\n  $('saveTokenBtn').onclick = saveAgentToken;\r\n  $('wCheckBtn').onclick = () => withdraw(false);\r\n  $('wSendBtn').onclick = () => withdraw(true);\r\n  if (AGENT.target_token) $('token').value = AGENT.target_token;\r\n  for (const f of AGENT.functions) {\r\n    const cb = $('on-' + f.function_id);\r\n    if (cb) cb.checked = !!f.enabled;\r\n  }\r\n}\r\n\r\n/**\r\n * Grava o novo token alvo. O servidor confere o endereço na chain antes de\r\n * aceitar, então o erro aparece aqui — antes de a pessoa assinar qualquer coisa\r\n * e descobrir na MetaMask que o contrato não conhece o token.\r\n */\r\nasync function saveAgentToken() {\r\n  const btn = $('saveTokenBtn');\r\n  const out = $('agentTokenOut');\r\n  const value = $('agentToken').value.trim();\r\n  btn.disabled = true; btn.textContent = 'checking on chain…';\r\n  out.innerHTML = '';\r\n  try {\r\n    const r = await api('PATCH', '/api/agents/' + AGENT.id, { token: value });\r\n    AGENT = r.agent;\r\n    $('token').value = r.agent.target_token || '';\r\n    const ti = r.tokenInfo;\r\n    out.innerHTML = value\r\n      ? `<div class=\"note ok\">Saved. ${ti?.erc20 ? esc((ti.erc20.symbol || '') + ' ' + (ti.erc20.name || '')) + ' — ' : ''}launched through pons${ti?.version === 'v2' ? ' v2 (' + esc(ti.v2?.phaseName || 'bonding curve') + ')' : ''} ✓<\/div>` +\r\n        (ti?.note ? `<div class=\"note warn\">${esc(ti.note)}<\/div>` : '')\r\n      : '<div class=\"note\">Target token cleared.<\/div>';\r\n  } catch (e) {\r\n    out.innerHTML = `<div class=\"note bad\">${esc(e.message)}<\/div>`;\r\n  }\r\n  btn.disabled = false; btn.textContent = 'Check and save token';\r\n}\r\n\r\n/**\r\n * Saque. `live=false` só calcula e mostra o que sairia; `live=true` envia.\r\n * O destino em branco significa a carteira conectada — devolver ao dono é o\r\n * caso normal, e digitar endereço à mão é onde se perde dinheiro.\r\n */\r\nasync function withdraw(live) {\r\n  const out = $('wOut');\r\n  const password = $('wPassword').value;\r\n  if (!password) { out.innerHTML = '<div class=\"note bad\">Enter the agent keystore password.<\/div>'; return; }\r\n\r\n  const asset = $wValue('wAsset');\r\n  const to = $('wTo').value.trim() || undefined;\r\n\r\n  if (live && !confirm(\r\n    `Send the agent's entire ${asset === 'eth' ? 'ETH balance' : 'token balance'} to ` +\r\n    `${to || ME}?\\n\\nThis is a real transaction on chain.`\r\n  )) return;\r\n\r\n  const btn = live ? $('wSendBtn') : $('wCheckBtn');\r\n  const label = btn.textContent;\r\n  btn.disabled = true; btn.textContent = live ? 'sending…' : 'checking…';\r\n  try {\r\n    const r = await api('POST', `/api/agents/${AGENT.id}/withdraw`, { password, asset, to, live });\r\n    $('wPassword').value = '';\r\n    out.innerHTML = r.dryRun\r\n      ? `<div class=\"note\">Would send ${esc(fmtAmount(r, asset))} to <span class=\"mono\">${esc(r.to)}<\/span>` +\r\n        `${r.gasCost ? ' — gas up to ' + eth(r.gasCost) + ' ETH' : ''}. Nothing sent yet.<\/div>`\r\n      : `<div class=\"note ok\">Sent ${esc(fmtAmount(r, asset))} to <span class=\"mono\">${esc(r.to)}<\/span><br>` +\r\n        `<span class=\"mono\">${esc(r.hash || '')}<\/span><\/div>`;\r\n    if (!r.dryRun) await selectAgent(AGENT.id);\r\n  } catch (e) {\r\n    out.innerHTML = `<div class=\"note bad\">${esc(e.message)}<\/div>`;\r\n  }\r\n  btn.disabled = false; btn.textContent = label;\r\n}\r\n\r\nconst $wValue = (id) => $(id).value;\r\nconst fmtAmount = (r, asset) => asset === 'eth' ? eth(r.amount) + ' ETH' : r.amount + ' units';\r\n\r\n// ---------------------------------------------------------------- funções\r\n\r\nfunction renderFunctions() {\r\n  $('functions').innerHTML = CONFIG.functions.map((f) => `\r\n    <div class=\"fn\" id=\"fn-${f.id}\">\r\n      <div class=\"fn-head\" onclick=\"toggleFn('${f.id}')\">\r\n        <input type=\"checkbox\" style=\"width:auto\" id=\"on-${f.id}\" onclick=\"event.stopPropagation()\">\r\n        <strong>${esc(f.label)}<\/strong>\r\n        ${f.needsDelegation ? '<span class=\"tag\">delegation<\/span>' : ''}\r\n        ${f.needsCapital ? '<span class=\"tag\">capital<\/span>' : ''}\r\n      <\/div>\r\n      <p>${esc(f.description)}<\/p>\r\n      <div class=\"fn-body\"><div class=\"grid2\">\r\n        ${Object.entries(f.params).map(([k,p]) => `\r\n          <div style=\"${p.type==='text'?'grid-column:1/-1':''}\">\r\n            <label>${esc(p.label)}<\/label>\r\n            ${p.type==='enum'\r\n              ? `<select id=\"p-${f.id}-${k}\">${p.options.map((o)=>`<option ${o===p.default?'selected':''}>${o}<\/option>`).join('')}<\/select>`\r\n              : p.type==='text'\r\n              ? `<textarea id=\"p-${f.id}-${k}\" placeholder=\"0xabc…,1000&#10;0xdef…,2500\"><\/textarea>`\r\n              : p.type==='bool'\r\n              ? `<select id=\"p-${f.id}-${k}\"><option value=\"true\">yes<\/option><option value=\"false\">no<\/option><\/select>`\r\n              : `<input id=\"p-${f.id}-${k}\" value=\"${esc(p.default)}\">`}\r\n          <\/div>`).join('')}\r\n      <\/div><\/div>\r\n    <\/div>`).join('');\r\n}\r\nwindow.toggleFn = (id) => $('fn-'+id).classList.toggle('open');\r\n\r\nwindow.reaccept = async () => {\r\n  try {\r\n    await api('POST', '/api/terms/accept');\r\n    ME_TERMS = true;\r\n    renderBanners();\r\n  } catch (e) { alert(e.message || 'could not record your acceptance'); }\r\n};\r\n\r\nfunction renderBanners() {\r\n  const parts = [];\r\n  if (ME && !ME_TERMS) {\r\n    parts.push(`<div class=\"banner\" style=\"background:#181410;border-color:#5c4423;color:#edd0a5\">\r\n      <strong>The terms of use changed.<\/strong> Please\r\n      <a href=\"/terms\" target=\"_blank\" rel=\"noopener\">read them<\/a> and accept again —\r\n      sending transactions is on hold until you do. Reading your agents and\r\n      withdrawing are not affected.\r\n      <button class=\"ghost sm\" style=\"margin-left:8px\" onclick=\"reaccept()\">I accept the updated terms<\/button><\/div>`);\r\n  }\r\n  if (CONFIG.maintenance?.on) {\r\n    parts.push(`<div class=\"banner\" style=\"background:#180f10;border-color:#5c2326;color:#eda9a5\">\r\n      <strong>Paused for maintenance.<\/strong> ${esc(CONFIG.maintenance.reason || 'Creating agents and running executions are on hold.')}\r\n      Reading your agents and exporting keystores still works.<\/div>`);\r\n  }\r\n  // O banner permanente da taxa saiu daqui de proposito. A cobranca continua\r\n  // declarada nos dois lugares que importam na hora de gastar: nos termos, que\r\n  // a pessoa precisa aceitar, e na linha \"service fee\" de cada decisao, ao lado\r\n  // do notional, antes de qualquer aprovacao. Ver feeRow() mais acima.\r\n  // O aviso de \"early access\" saiu: o produto foi lancado, e um alerta que diz\r\n  // \"isto e novo, cuidado\" em toda visita deixa de informar e vira ruido. O que\r\n  // realmente precisa ser dito sobre risco esta nos termos, que sao aceitos\r\n  // antes de criar agente e de novo antes da primeira execucao real.\r\n  //\r\n  // Sobram aqui so os banners que carregam informacao acionavel: termos\r\n  // mudaram, e servico em manutencao.\r\n  $('betaBanner').innerHTML = parts.join('');\r\n\r\n  // Sem envio real ligado no servidor o botão principal viraria promessa vazia:\r\n  // o pedido voltaria como ensaio e a pessoa acharia que enviou. Aqui ele\r\n  // assume o texto do que de fato acontece.\r\n  if (!CONFIG.liveExecution) $('runBtn').textContent = 'Run agent (nothing is sent)';\r\n  renderRunState();\r\n}\r\n\r\n/** Grava o que está nos campos antes de rodar, senão o agente usa o salvo. */\r\nasync function salvarFuncoes() {\r\n  for (const f of CONFIG.functions) {\r\n    const params = {};\r\n    for (const k of Object.keys(f.params)) {\r\n      const el = $(`p-${f.id}-${k}`);\r\n      if (el) params[k] = el.value;\r\n    }\r\n    await api('POST', `/api/agents/${AGENT.id}/functions`,\r\n      { functionId: f.id, enabled: $('on-'+f.id).checked, params });\r\n  }\r\n}\r\n\r\n// ------------------------------------------------------ iniciar o agente\r\n//\r\n// Um botão só: roda o agente, aprova o que a política liberou e envia.\r\n//\r\n// A senha é pedida UMA VEZ por aba. Ela não é uma trava de formulário — é o que\r\n// decifra a chave privada, então sem ela não existe assinatura. Depois do\r\n// primeiro start fica no sessionStorage desta aba e some quando a aba fecha. O\r\n// servidor continua sem guardá-la: recebe, usa e esquece a cada pedido.\r\n//\r\n// O que este botão NÃO pula: decisão com qualquer violação fica de fora, a\r\n// política de risco e os limites do protocolo seguem valendo no servidor, e\r\n// cada transação continua passando por eth_call antes de ser assinada. Aqui se\r\n// pula a revisão humana, não as verificações.\r\n\r\nconst chaveSenha = (id) => 'pons_pw_' + id;\r\nconst senhaDaAba = (id) => { try { return sessionStorage.getItem(chaveSenha(id)); } catch { return null; } };\r\n\r\n/** Só guarda depois que o servidor aceitou — senha errada nunca fica salva. */\r\nfunction guardarSenha(senha) {\r\n  try { sessionStorage.setItem(chaveSenha(AGENT.id), senha); } catch { /* modo privado */ }\r\n  $('livePw').value = '';\r\n  renderRunState();\r\n}\r\n\r\nwindow.forgetPassword = () => {\r\n  try { sessionStorage.removeItem(chaveSenha(AGENT.id)); } catch { /* modo privado */ }\r\n  renderRunState();\r\n};\r\n\r\n/** Campo de senha ou linha de estado, conforme esta aba já conheça o agente. */\r\nfunction renderRunState() {\r\n  if (!AGENT) { $('askPw').style.display = 'none'; $('agentState').style.display = 'none'; return; }\r\n  const destravado = !!senhaDaAba(AGENT.id);\r\n  $('askPw').style.display = (destravado || !CONFIG.liveExecution) ? 'none' : 'block';\r\n  $('agentState').style.display = destravado ? 'flex' : 'none';\r\n  if (destravado) {\r\n    $('stateText').textContent =\r\n      'Unlocked for this tab · ' + AGENT.address.slice(0, 10) + '…' + AGENT.address.slice(-4);\r\n  }\r\n}\r\n\r\nwindow.startAgent = async () => {\r\n  const b = $('runBtn');\r\n  const rotulo = b.textContent;\r\n\r\n  const senha = senhaDaAba(AGENT.id) || $('livePw').value;\r\n  if (!senha) { $('livePw').focus(); return alert('enter the agent keystore password once to start it'); }\r\n\r\n  b.disabled = true; b.textContent = 'starting…';\r\n  try {\r\n    await salvarFuncoes();\r\n    const out = await api('POST', `/api/agents/${AGENT.id}/run`, { persist: true });\r\n    renderResult(out);\r\n\r\n    const aprovaveis = (out.results || [])\r\n      .flatMap((r) => r.decisions || [])\r\n      .filter((d) => d.id && d.verdict && d.verdict.violations.length === 0);\r\n\r\n    if (!aprovaveis.length) {\r\n      $('result').insertAdjacentHTML('afterbegin',\r\n        '<div class=\"note\">Nothing to send: no decision passed your policy this round.<\/div>');\r\n      return;\r\n    }\r\n\r\n    // Soma o que sai da carteira: o que entra no mercado mais a taxa.\r\n    const totalWei = aprovaveis.reduce((s, d) =>\r\n      s + BigInt(d.decision.notionalWei || 0) + BigInt(d.decision.feeWei || 0), 0n);\r\n    if (!confirm(`Send ${aprovaveis.length} decision(s) for real now, spending up to `\r\n      + `${eth(totalWei.toString())} ETH from the agent wallet? This cannot be undone.`)) return;\r\n\r\n    for (const d of aprovaveis) {\r\n      const alvo = $('exec-' + d.id);\r\n      if (alvo) alvo.insertAdjacentHTML('beforeend', `<div class=\"note\" id=\"run-${d.id}\">sending…<\/div>`);\r\n      try {\r\n        if (d.verdict.needsApproval) await api('POST', `/api/decisions/${d.id}/approve`);\r\n        const r = await api('POST', `/api/decisions/${d.id}/execute`, { password: senha, live: true });\r\n        guardarSenha(senha);\r\n        if ($('run-' + d.id)) {\r\n          $('run-' + d.id).outerHTML = `<div class=\"note ok\">Executed ${r.steps.length} step(s)<\/div>` +\r\n            r.steps.map((s) => `<div class=\"note${s.failed ? ' bad' : ''}\">${esc(s.label)}${\r\n              s.failed ? ' — did not go through: ' + esc(s.failed)\r\n              : s.skipped ? ' — ' + esc(s.skipped)\r\n              : s.hash ? ' — <span class=\"mono\">' + esc(s.hash.slice(0, 18)) + '…<\/span>' : ''}<\/div>`).join('');\r\n        }\r\n      } catch (e) {\r\n        // Uma decisão que falha não interrompe as outras: são independentes, e\r\n        // parar aqui deixaria metade do plano sem explicação na tela.\r\n        if ($('run-' + d.id)) $('run-' + d.id).outerHTML = `<div class=\"note bad\">${esc(e.message)}<\/div>`;\r\n      }\r\n    }\r\n  } catch (e) {\r\n    $('result').innerHTML = `<div class=\"note bad\">${esc(e.message)}<\/div>`;\r\n  }\r\n  b.disabled = false; b.textContent = rotulo;\r\n};\r\n\r\n$('runBtn').onclick = () => startAgent();\r\n\r\n\r\n// Taxa de serviço na tela da decisão. Na coleta de rewards o número é\r\n// estimativa — dizer isso evita a reclamação de quando não bater.\r\nfunction feeRow(dec) {\r\n  if (!dec.feeBps) return '';\r\n  const pct = dec.feeBps / 100;\r\n  if (dec.feeWei && BigInt(dec.feeWei) > 0n) {\r\n    return `<div class=\"kv\"><span>service fee (${pct}%)<\/span><span>${eth(dec.feeWei)} ETH<\/span><\/div>`;\r\n  }\r\n  if (dec.feeEstimateWei) {\r\n    return `<div class=\"kv\"><span>service fee (${pct}%)<\/span><span>~${eth(dec.feeEstimateWei)} ETH · estimated,\r\n      charged on what is actually collected<\/span><\/div>`;\r\n  }\r\n  return `<div class=\"kv\"><span>service fee<\/span><span>${pct}% of what this collects<\/span><\/div>`;\r\n}\r\n\r\nfunction renderResult(out) {\r\n  const s = out.state;\r\n  const supply = s.supply ? `\r\n    <div class=\"kv\"><span>circulating supply<\/span><span>${eth(s.supply.circulating)}<\/span><\/div>\r\n    <div class=\"kv\"><span>already burned<\/span><span>${eth(s.supply.burned)}<\/span><\/div>` : '';\r\n  const head = `\r\n    <div class=\"kv\"><span>token<\/span><span class=\"mono\">${esc(s.symbol || out.token)}<\/span><\/div>\r\n    <div class=\"kv\"><span>price<\/span><span>${eth(s.pricePair)} ETH<\/span><\/div>\r\n    <div class=\"kv\"><span>graduated<\/span><span>${s.graduated ? 'yes' : 'no'}<\/span><\/div>\r\n    <div class=\"kv\"><span>agent balance<\/span><span>${eth(s.balances.eth)} ETH<\/span><\/div>\r\n    ${supply}<div style=\"height:16px\"><\/div>`;\r\n\r\n  const blocks = out.results.map((r) => {\r\n    if (r.error) return `<div class=\"note bad\"><strong>${esc(r.functionId)}<\/strong> — ${esc(r.error)}<\/div>`;\r\n    const notes = (r.notes||[]).map((n)=>`<div class=\"note\">${esc(n)}<\/div>`).join('');\r\n    const decs = (r.decisions||[]).map((d) => {\r\n      const v = d.verdict;\r\n      const tag = v.violations.length ? 'bad' : (v.needsApproval ? 'warn' : 'ok');\r\n      const txt = v.violations.length ? 'blocked' : (v.needsApproval ? 'awaiting approval' : 'approved');\r\n      return `<div class=\"dec\">\r\n        <div class=\"dec-head\"><strong>${esc(d.decision.kind)}<\/strong><span class=\"tag ${tag}\">${txt}<\/span><\/div>\r\n        <p style=\"margin-top:6px;font-size:12px;color:var(--dim)\">${esc(d.decision.rationale)}<\/p>\r\n        <div class=\"kv\" style=\"margin-top:8px\"><span>notional<\/span><span>${eth(d.decision.notionalWei)} ETH<\/span><\/div>\r\n        <div class=\"kv\"><span>impact<\/span><span>${(d.decision.priceImpactBps/100).toFixed(2)}%<\/span><\/div>\r\n        ${feeRow(d.decision)}\r\n        ${v.violations.map((x)=>`<div class=\"note bad\">${esc(x)}<\/div>`).join('')}\r\n        ${!v.violations.length && v.needsApproval\r\n          ? `<button class=\"ghost sm\" style=\"margin-top:10px\" onclick=\"approve(${d.id})\">Approve<\/button>` : ''}\r\n        ${!v.violations.length ? `<div id=\"exec-${d.id}\"><\/div>` : ''}\r\n      <\/div>`;\r\n    }).join('');\r\n    return `<div style=\"margin-bottom:20px\">\r\n      <div style=\"font-weight:600;margin-bottom:8px\">${esc(r.label || r.functionId)}<\/div>\r\n      ${notes}${decs || '<div class=\"note\">no action proposed this round<\/div>'}\r\n    <\/div>`;\r\n  }).join('');\r\n\r\n  $('result').innerHTML = head + (blocks || '<div class=\"empty\">no functions enabled<\/div>');\r\n}\r\n\r\nwindow.approve = async (id) => {\r\n  await api('POST', `/api/decisions/${id}/approve`);\r\n  const slot = $('exec-' + id);\r\n  // Uma acao so aqui tambem: aprovar e mandar. O botao de simular saiu — quem\r\n  // quiser ver antes de gastar tem o resultado da rodada logo acima, com o\r\n  // notional, o impacto no preco e a taxa de cada decisao.\r\n  slot.innerHTML = `\r\n    <div class=\"note ok\" style=\"margin-top:10px\">Approved and recorded.<\/div>\r\n    ${CONFIG.liveExecution\r\n      ? `<label>Password<\/label>\r\n         <input type=\"password\" id=\"pw-${id}\" placeholder=\"agent password\">\r\n         <button class=\"sm\" style=\"margin-top:8px\" onclick=\"execute(${id}, true)\">Send<\/button>`\r\n      : `<div class=\"note warn\">Sending is off on this server. Turn it on with\r\n           <code>PONS_ALLOW_LIVE_EXECUTION=1<\/code>.<\/div>`}`;\r\n};\r\n\r\nwindow.execute = async (id, live) => {\r\n  const pw = $('pw-' + id)?.value;\r\n  if (!pw) return alert('enter the agent keystore password');\r\n  if (live && !confirm('This will send real transactions on chain. Continue?')) return;\r\n\r\n  const slot = $('exec-' + id);\r\n  slot.insertAdjacentHTML('beforeend', `<div class=\"note\" id=\"run-${id}\">running…<\/div>`);\r\n  try {\r\n    const out = await api('POST', `/api/decisions/${id}/execute`, { password: pw, live });\r\n    $('pw-' + id).value = '';\r\n    $('run-' + id).outerHTML = `<div class=\"note ${out.dryRun ? '' : 'ok'}\">\r\n      ${out.dryRun ? 'Simulated' : 'Executed'} ${out.steps.length} step(s)<\/div>` +\r\n      out.steps.map((s) => `<div class=\"note${s.failed ? ' bad' : ''}\">${esc(s.label)}${\r\n        s.failed ? ' — did not go through: ' + esc(s.failed)\r\n        : s.skipped ? ' — ' + esc(s.skipped)\r\n        : s.notSimulated ? ' — not simulated: ' + esc(s.reason || '')\r\n        : s.hash ? ' — <span class=\"mono\">' + esc(s.hash.slice(0, 18)) + '…<\/span>'\r\n        : s.gasLimit ? ' — gas ' + esc(s.gasLimit) : ''}<\/div>`).join('');\r\n  } catch (e) {\r\n    $('run-' + id).outerHTML = `<div class=\"note bad\">${esc(e.message)}<\/div>`;\r\n  }\r\n};\r\n\r\n// ---------------------------------------------------------------- delegação\r\n\r\n$('delegBtn').onclick = async () => {\r\n  if (!AGENT) return alert('pick an agent first');\r\n  try {\r\n    const d = await api('POST', `/api/agents/${AGENT.id}/delegation`, { token: $('token').value.trim() || undefined });\r\n    const st = d.status || {};\r\n    // Cada transação já vem simulada pelo servidor com o endereço conectado.\r\n    // Só aparece botão de assinar no que de fato passa: oferecer um botão que\r\n    // sempre reverte é convidar a pessoa a queimar gás para descobrir sozinha.\r\n    const ti = d.tokenInfo || {};\r\n    // O endereço inspecionado aparece SEMPRE. Sem ele, \"token not found\" deixa\r\n    // no ar a pergunta mais básica: procurado onde, exatamente?\r\n    const tokenBlock = `\r\n      <div class=\"kv\"><span>token checked<\/span><span class=\"mono\">${esc((d.token||'—').slice(0,14))}…<\/span><\/div>\r\n      ${ti.erc20 ? `<div class=\"kv\"><span>token name<\/span><span>${esc(ti.erc20.symbol || '')} ${esc(ti.erc20.name || '')}<\/span><\/div>` : ''}\r\n      <div class=\"kv\"><span>launched through pons<\/span><span>${\r\n        ti.isPonsToken === true ? (ti.version === 'v2' ? 'yes ✓ · v2 (' + esc(ti.v2?.phaseName || 'bonding curve') + ')' : 'yes ✓ · v1') : ti.checked === false ? 'could not check' : 'no'\r\n      }<\/span><\/div>\r\n      ${ti.verdict ? `<div class=\"note ${ti.checked === false ? 'warn' : 'bad'}\">${esc(ti.verdict)}<\/div>` : ''}\r\n      ${ti.note ? `<div class=\"note warn\">${esc(ti.note)}<\/div>` : ''}`;\r\n\r\n    $('delegOut').innerHTML = tokenBlock + `\r\n      <div class=\"kv\"><span>current payout<\/span><span class=\"mono\">${esc((st.feeRecipient||'—').slice(0,14))}…<\/span><\/div>\r\n      <div class=\"kv\"><span>connected wallet<\/span><span class=\"mono\">${esc((d.connected||'—').slice(0,14))}…<\/span><\/div>\r\n      ${st.feeRecipient && d.connected && st.feeRecipient.toLowerCase() !== d.connected.toLowerCase() && !st.redirectedToAgent\r\n        ? `<div class=\"note warn\">Only the wallet that receives the creator fees can sign this. Log out, connect\r\n           <span class=\"mono\">${esc(st.feeRecipient)}<\/span> and come back to this card.<\/div>` : ''}\r\n      <div class=\"kv\"><span>points to agent<\/span><span>${st.redirectedToAgent?'yes ✓':'no'}<\/span><\/div>\r\n      ${st.version === 'v2' && st.pending ? `<div class=\"kv\"><span>claimable in escrow<\/span><span>${esc(String(Number(st.pending.inEscrow || 0) / 1e18))} ETH<\/span><\/div>` : ''}\r\n      ${d.deployer ? `<div class=\"kv\"><span>token launched by<\/span><span class=\"mono\">${esc(d.deployer.slice(0,14))}…<\/span><\/div>` : ''}\r\n      ${d.transactions.map((t,i)=>{\r\n        const sim = t.simulation || {};\r\n        const cls = sim.ok ? 'note ok' : sim.unknown ? 'note warn' : 'note bad';\r\n        const verdict = sim.ok\r\n          ? '<span class=\"tag ok\">simulated: will succeed<\/span>'\r\n          : sim.unknown\r\n            ? '<span class=\"tag warn\">could not check right now<\/span>'\r\n            : `<span class=\"tag bad\">will fail${sim.error ? ' · ' + esc(sim.error) : ''}<\/span>`;\r\n        // Só o caso comprovadamente ruim ganha o botão de \"assinar mesmo assim\".\r\n        // Quando a checagem não completou, o botão normal continua — a carteira\r\n        // faz a própria simulação antes de você confirmar.\r\n        const btn = sim.ok || sim.unknown\r\n          ? `<button class=\"ghost sm\" style=\"margin-top:8px\" onclick=\"sendTx(${i})\">Sign in wallet<\/button>`\r\n          : `<button class=\"ghost sm\" style=\"margin-top:8px\" onclick=\"sendTx(${i}, true)\">Sign anyway<\/button>`;\r\n        return `\r\n        <div class=\"${cls}\"><strong>${esc(t.label)}<\/strong> ${verdict}<br>\r\n          <span class=\"mono\">${esc(t.signature)}<\/span><br>\r\n          <span style=\"opacity:.8\">${esc(sim.ok ? t.note : (sim.reason || t.note))}<\/span>\r\n          <br>${btn}\r\n        <\/div>`;\r\n      }).join('')}`;\r\n    window.__txs = d.transactions;\r\n  } catch (e) { $('delegOut').innerHTML = `<div class=\"note bad\">${esc(e.message)}<\/div>`; }\r\n};\r\n\r\n// ---------------------------------------------------- rede da carteira\r\n//\r\n// A carteira não conhece a Robinhood Chain por padrão, e `personal_sign` não\r\n// se importa com rede nenhuma — então dá para fazer login inteiro conectado na\r\n// Ethereum e só descobrir o problema na hora de assinar a transação, que é\r\n// quando a MetaMask abre na rede errada. Aqui a rede é trocada (ou adicionada)\r\n// ANTES de qualquer eth_sendTransaction, e o estado fica visível o tempo todo.\r\n\r\nconst CHAIN_ID_HEX = () => CONFIG.chain.idHex || ('0x' + CONFIG.chain.id.toString(16));\r\n\r\nasync function walletChainId() {\r\n  if (!window.ethereum) return null;\r\n  try { return await window.ethereum.request({ method: 'eth_chainId' }); }\r\n  catch { return null; }\r\n}\r\n\r\nconst sameChain = (hex) =>\r\n  typeof hex === 'string' && parseInt(hex, 16) === CONFIG.chain.id;\r\n\r\n/** Garante que a carteira está na rede certa. Devolve true se está. */\r\nasync function ensureChain({ silent = false } = {}) {\r\n  if (!window.ethereum) return false;\r\n  if (sameChain(await walletChainId())) { renderWalletChain(); return true; }\r\n\r\n  try {\r\n    await window.ethereum.request({\r\n      method: 'wallet_switchEthereumChain',\r\n      params: [{ chainId: CHAIN_ID_HEX() }],\r\n    });\r\n  } catch (err) {\r\n    // 4902 = rede desconhecida pela carteira. Alguns provedores devolvem o\r\n    // código aninhado em err.data, e a MetaMask às vezes manda -32603 com a\r\n    // mesma causa; por isso a checagem é larga em vez de igual a 4902.\r\n    const code = err?.code ?? err?.data?.originalError?.code;\r\n    const unknown = code === 4902 || code === -32603 || /unrecognized|not added|add.*chain/i.test(err?.message || '');\r\n    if (!unknown) {\r\n      if (!silent) alert(err?.message || 'network switch rejected');\r\n      renderWalletChain();\r\n      return false;\r\n    }\r\n    try {\r\n      await window.ethereum.request({\r\n        method: 'wallet_addEthereumChain',\r\n        params: [{\r\n          chainId: CHAIN_ID_HEX(),\r\n          chainName: CONFIG.chain.name,\r\n          nativeCurrency: CONFIG.chain.nativeCurrency || { name: 'Ether', symbol: 'ETH', decimals: 18 },\r\n          rpcUrls: [CONFIG.chain.rpc],\r\n          blockExplorerUrls: CONFIG.chain.explorer ? [CONFIG.chain.explorer] : undefined,\r\n        }],\r\n      });\r\n    } catch (addErr) {\r\n      if (!silent) alert(addErr?.message || 'could not add the network');\r\n      renderWalletChain();\r\n      return false;\r\n    }\r\n  }\r\n\r\n  const ok = sameChain(await walletChainId());\r\n  renderWalletChain();\r\n  return ok;\r\n}\r\n\r\nasync function renderWalletChain() {\r\n  const chip = $('walletChain');\r\n  if (!chip) return;\r\n  if (!window.ethereum || !ME) { chip.style.display = 'none'; return; }\r\n  chip.style.display = 'inline-block';\r\n  const hex = await walletChainId();\r\n  if (sameChain(hex)) {\r\n    chip.className = 'chip ok';\r\n    chip.textContent = 'wallet on ' + CONFIG.chain.name;\r\n    chip.onclick = null;\r\n    chip.style.cursor = 'default';\r\n    chip.title = '';\r\n  } else {\r\n    chip.className = 'chip bad';\r\n    chip.textContent = 'wallet on wrong network — click to switch';\r\n    chip.style.cursor = 'pointer';\r\n    chip.title = 'Your wallet is on chain ' + (hex ? parseInt(hex, 16) : '?') +\r\n      '. Transactions must be signed on ' + CONFIG.chain.name + ' (chain ' + CONFIG.chain.id + ').';\r\n    chip.onclick = () => ensureChain();\r\n  }\r\n}\r\n\r\nif (window.ethereum?.on) {\r\n  window.ethereum.on('chainChanged', () => renderWalletChain());\r\n  window.ethereum.on('accountsChanged', () => location.reload());\r\n}\r\n\r\nwindow.sendTx = async (i, knownToFail = false) => {\r\n  const tx = window.__txs[i];\r\n  if (!window.ethereum) return alert('no wallet in this browser');\r\n  if (knownToFail && !confirm(\r\n    (tx.simulation?.reason || 'This call reverts when simulated.') +\r\n    '\\n\\nSigning it will still cost gas and will almost certainly fail. Continue anyway?'\r\n  )) return;\r\n  // A troca de rede vem primeiro. Sem isto a MetaMask abre na rede em que o\r\n  // usuário estiver, e a transação ou falha ou vai parar na chain errada.\r\n  if (!await ensureChain()) {\r\n    return alert('Switch your wallet to ' + CONFIG.chain.name + ' (chain ' +\r\n      CONFIG.chain.id + ') before signing. Nothing was sent.');\r\n  }\r\n  try {\r\n    const hash = await window.ethereum.request({\r\n      method: 'eth_sendTransaction',\r\n      params: [{ from: ME, to: tx.to, data: tx.data, chainId: CHAIN_ID_HEX() }],\r\n    });\r\n    alert('transaction sent: ' + hash);\r\n  } catch (e) { alert(e.message || 'transaction rejected'); }\r\n};\r\n\r\nboot().catch((e) => {\r\n  $('chainChip').className = 'chip bad';\r\n  $('chainChip').textContent = e.message;\r\n});\r\n<\/script>\r\n<\/body>\r\n<\/html>\r\n" };
const f = document.getElementById('f');
document.querySelectorAll('.tab').forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll('.tab').forEach((x) => x.classList.remove('on'));
    b.classList.add('on');
    f.srcdoc = PAGES[b.dataset.v];
  };
});
f.srcdoc = PAGES.app;
</script>
</body></html>
